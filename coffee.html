<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>请我喝杯咖啡 · 有点困</title>
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Ma Shan Zheng","Xingkai SC","STXingkai","Kaiti SC","STKaiti","KaiTi","楷体",serif;
  background:linear-gradient(180deg,#04020e 0%,#0a0524 55%,#14103a 100%);
  color:#f2ede0;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.coffee-wrap{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:max(22px,env(safe-area-inset-top)) 24px max(26px,env(safe-area-inset-bottom))}
.coffee-card{width:min(360px,100%);text-align:center;padding:30px 24px 26px;border-radius:28px;
  background:rgba(24,16,44,.94);border:1px solid rgba(240,207,130,.22);
  box-shadow:0 28px 72px rgba(3,1,14,.6),inset 0 1px 0 rgba(255,255,255,.1);
  animation:pop .45s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}
.cf-ic{font-size:2.2rem;margin-bottom:8px}
.cf-title{font-size:1.25rem;color:#f0cf82;font-weight:600;letter-spacing:.16em;text-indent:.16em}
.cf-sub{font-size:.7rem;color:rgba(240,207,130,.55);line-height:1.9;margin:10px 0 20px}
.cf-qr{position:relative;display:inline-block;border-radius:16px;overflow:hidden;
  border:2px solid rgba(240,207,130,.3);background:#fff;box-shadow:0 12px 36px rgba(0,0,0,.4)}
.cf-qr img{display:block;width:auto;height:auto;max-width:100%;max-height:54vh;margin:0 auto;
  -webkit-user-select:all;user-select:all;-webkit-touch-callout:default;touch-action:manipulation}
.cf-qr-tag{position:absolute;left:0;right:0;bottom:0;padding:5px 0;font-size:.56rem;letter-spacing:.1em;
  color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,.75));text-align:center}
.cf-tip{font-size:.62rem;color:rgba(240,207,130,.42);margin-top:14px;line-height:1.8}
.cf-back{display:inline-block;margin-top:20px;padding:10px 34px;border-radius:999px;cursor:pointer;
  font-family:inherit;font-size:.76rem;letter-spacing:.14em;color:#fffbef;font-weight:600;
  border:1px solid rgba(240,207,130,.3);background:rgba(240,207,130,.12);transition:.22s;text-decoration:none}
.cf-back:active{transform:scale(.96);background:rgba(240,207,130,.22)}
.cf-foot{margin-top:18px;font-size:.6rem;letter-spacing:.24em;color:rgba(240,207,130,.32)}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="coffee-wrap">
  <div class="coffee-card">
    <div class="cf-ic">☕</div>
    <div class="cf-title">请我喝杯咖啡</div>
    <div class="cf-qr">
      <img src="assets/qr-coffee.jpg" alt="收款码">
    </div>
    <div class="cf-tip">长按识别二维码 · 感谢支持</div>
    <a class="cf-back" href="index.html">‹ 返回主页</a>
  </div>
  <div class="cf-foot">‥ 有点困 · Sleepy Space ‥</div>
</div>
<script>
/* 星空粒子背景 */
(function(){
  var cv=document.getElementById('sky'),ctx=cv.getContext('2d');
  var W,H,DPR,stars=[];
  function resize(){
    DPR=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
    cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
    stars=Array.from({length:120},function(){return{x:Math.random()*W,y:Math.random()*H*.7,
      r:(Math.random()*1.2+.3)*DPR,p:Math.random()*7,s:.3+Math.random()*.8};});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    stars.forEach(function(s){
      s.y+=s.s*.12*DPR; if(s.y>H){s.y=-5;s.x=Math.random()*W;}
      var a=.35+.45*Math.abs(Math.sin(Date.now()*.001+s.p));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fillStyle='rgba(240,238,255,'+a+')';ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  addEventListener('resize',resize);resize();draw();
})();
</script>
</body>
</html>
