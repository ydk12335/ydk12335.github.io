<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>便签墙</title>
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;background:#eaf3fb;color:#3d4a5e;font-family:"Ma Shan Zheng","Xingkai SC","Kaiti SC","STKaiti","KaiTi","楷体",serif;overflow:hidden;touch-action:none}
#viewport{position:fixed;inset:0;overflow:hidden;z-index:1;background:#eaf3fb}
#viewport::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(100,130,170,.05) 0,rgba(100,130,170,.05) 1px,transparent 1px,transparent 28px);background-size:100% 28px}
#canvas{position:absolute;left:0;top:0;width:100000px;height:100000px;transform-origin:0 0;background:transparent}
#canvas.dragging{cursor:grabbing}
#canvas.place{cursor:copy}
#ghost{position:absolute;display:none;pointer-events:none;z-index:5}
.wt-note{position:absolute;width:190px;aspect-ratio:.8;border-radius:3px 14px 3px 3px;padding:13px 11px 9px;cursor:pointer;border:2.5px solid #3a4a66;box-shadow:3px 4px 0 rgba(48,64,92,.75),0 9px 12px -6px rgba(48,64,92,.4);font-family:"Ma Shan Zheng","Xingkai SC","STKaiti",serif;display:flex;flex-direction:column;overflow:hidden}
/* 底部微微上翘卷边（手绘感） */
.wt-note .wcurl{position:absolute;left:10px;right:10px;bottom:0;height:10px;border-radius:50% 50% 0 0;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0));box-shadow:0 -2px 3px -1px rgba(0,0,0,.14);z-index:1;pointer-events:none}
.wt-note::before{content:'';position:absolute;top:-2.5px;left:50%;transform:translateX(-50%) rotate(-2deg);width:64%;height:16px;background:linear-gradient(90deg,rgba(255,255,255,.7),rgba(255,255,255,.35));border-left:1.5px dashed rgba(0,0,0,.15);border-right:1.5px dashed rgba(0,0,0,.15);z-index:2}
.wt-note::after{content:'';position:absolute;top:0;right:0;width:26px;height:26px;background:linear-gradient(225deg,rgba(0,0,0,.14) 50%,transparent 50%);border-bottom-left-radius:10px}
.wt-note .ic{font-size:.74rem;letter-spacing:.15em;color:rgba(0,0,0,.45);margin-bottom:4px;font-weight:600}
.wt-note .tt{font-size:1rem;font-weight:700;line-height:1.45;letter-spacing:.04em;color:#2c3a52;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.wt-note .ct{font-size:.7rem;color:rgba(0,0,0,.6);line-height:1.6;margin-top:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;flex:1}
.wt-note .au{display:flex;align-items:center;gap:5px;font-size:.6rem;color:rgba(0,0,0,.5);margin-top:4px;min-width:0}
.wt-note .au-dt{margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-note .au-nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74px;font-size:.62rem;color:rgba(0,0,0,.55)}
.wt-note .av{width:16px;height:16px;border-radius:50%;flex:none;border:1.5px solid rgba(0,0,0,.28);background-size:cover;background-position:center;display:inline-flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;color:#fff;line-height:1}
.wt-note .av-anon{background:#9aa8bd;color:#fff}
.wt-note .av-letter{color:#fff}
.wt-top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;background:linear-gradient(180deg,rgba(234,243,251,.95),rgba(234,243,251,.55),rgba(234,243,251,0));pointer-events:none}
.wt-top>*{pointer-events:auto}
.wt-btn{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:6px;border:2.5px solid #3a4a66;background:#f2f7fd;color:#3a4a66;font-family:inherit;font-size:.78rem;letter-spacing:.08em;cursor:pointer;transition:.15s;text-decoration:none;box-shadow:2.5px 3px 0 rgba(48,64,92,.9);font-weight:600}
.wt-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(48,64,92,.9)}
.wt-title{flex:1;text-align:center;font-size:1.3rem;color:#3a4a66;letter-spacing:.35em;font-weight:700;text-shadow:2px 2px 0 rgba(255,255,255,.6);transform:rotate(-.5deg)}
.wt-title small{display:block;font-size:.62rem;color:rgba(48,64,92,.55);letter-spacing:.2em;margin-top:3px;font-weight:400;transform:rotate(.8deg)}
.wt-tabs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:0;right:0;z-index:15;display:flex;gap:8px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;background:linear-gradient(180deg,rgba(234,243,251,.92),rgba(234,243,251,.25));pointer-events:none}
.wt-tabs::-webkit-scrollbar{display:none}
.wt-tabs>*{pointer-events:auto}
.wt-tab{flex:none;padding:6px 15px;border-radius:5px;border:2.5px solid #3a4a66;background:#f2f7fd;color:#3a4a66;font-family:inherit;font-size:.75rem;letter-spacing:.08em;cursor:pointer;transition:.15s;box-shadow:2px 2.5px 0 rgba(48,64,92,.85);font-weight:600;transform:rotate(-1deg)}
.wt-tab:nth-child(even){transform:rotate(1.2deg)}
.wt-tab.on{background:#a8d8ff;box-shadow:2px 2.5px 0 rgba(48,64,92,.85)}
.wt-tab:active{transform:translate(2px,2px) rotate(0deg);box-shadow:0 0 0 rgba(48,64,92,.85)}
.wt-add{position:fixed;top:calc(env(safe-area-inset-top,0px) + 104px);right:14px;z-index:20;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:7px;border:3px solid #3a4a66;background:#a8d8ff;color:#3a4a66;font-family:inherit;font-size:.9rem;font-weight:700;letter-spacing:.12em;cursor:pointer;box-shadow:4px 4.5px 0 rgba(48,64,92,.9);transform:rotate(1deg);transition:transform .16s,box-shadow .2s}
.wt-add:active{transform:translate(3px,3px) rotate(0deg);box-shadow:1px 1px 0 rgba(48,64,92,.9)}
.wt-zoom-ctl{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:20;display:flex;flex-direction:column;gap:8px}
.wt-zbtn{width:42px;height:42px;border-radius:6px;border:2.5px solid #3a4a66;background:#f2f7fd;color:#3a4a66;font-family:inherit;font-size:1.1rem;cursor:pointer;box-shadow:2.5px 3px 0 rgba(48,64,92,.7);display:flex;align-items:center;justify-content:center;font-weight:700}
.wt-zbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0}
.wt-bottom{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:20;display:flex;gap:10px;align-items:center}
.wt-btn2{display:flex;align-items:center;gap:6px;padding:11px 20px;border-radius:7px;border:3px solid #3a4a66;background:#f2f7fd;color:#3a4a66;font-family:inherit;font-size:.8rem;letter-spacing:.1em;cursor:pointer;box-shadow:4px 4.5px 0 rgba(48,64,92,.85);font-weight:600;transition:transform .16s,box-shadow .2s;transform:rotate(.7deg)}
.wt-btn2:active{transform:translate(3px,3px) rotate(0deg);box-shadow:1px 1px 0 rgba(48,64,92,.85)}
.wt-zoom-lbl{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);z-index:20;background:#f2f7fd;border:2.5px solid #3a4a66;border-radius:6px;padding:6px 14px;font-size:.72rem;color:#3a4a66;letter-spacing:.08em;box-shadow:2.5px 3px 0 rgba(48,64,92,.6);font-weight:600;pointer-events:none}
#placeBar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 100px);left:50%;transform:translateX(-50%);z-index:25;background:#fff;border:2.5px solid #3a4a66;border-radius:6px;padding:9px 22px;font-size:.8rem;color:#3a4a66;letter-spacing:.1em;box-shadow:3px 3.5px 0 rgba(48,64,92,.7);font-weight:600;display:none;white-space:nowrap}
#placeBar.show{display:block}
#placeBar b{cursor:pointer;color:#8a5a2a;text-decoration:underline}
.wt-hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:50%;transform:translateX(-50%);z-index:30;background:#f2f7fd;border:2.5px solid #3a4a66;border-radius:6px;padding:8px 20px;font-size:.78rem;color:#3a4a66;letter-spacing:.08em;opacity:0;transition:opacity .5s,transform .5s;pointer-events:none;box-shadow:3px 3px 0 rgba(48,64,92,.7);font-weight:600}
.wt-hint.show{opacity:1;transform:translateX(-50%) translateY(4px)}
.wt-mask{position:fixed;inset:0;z-index:50;background:rgba(48,64,92,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;animation:wtFade .28s ease}
.wt-mask.show{display:flex}
@keyframes wtFade{from{opacity:0}to{opacity:1}}
.wt-panel{width:min(420px,94%);max-height:86vh;overflow-y:auto;overscroll-behavior:contain;border-radius:10px;padding:24px 22px;background:#f2f7fd;border:3px solid #3a4a66;box-shadow:6px 7px 0 rgba(48,64,92,.55);animation:wtPop .35s cubic-bezier(.16,1,.3,1);text-align:center;transform:rotate(-.3deg)}
@keyframes wtPop{from{opacity:0;transform:scale(.92) translateY(18px) rotate(-.3deg)}to{opacity:1;transform:rotate(-.3deg)}}
.wt-panel h3{color:#3a4a66;font-size:1.05rem;letter-spacing:.28em;margin-bottom:6px;font-weight:700}
.wt-panel .sub{color:rgba(48,64,92,.55);font-size:.7rem;letter-spacing:.08em;margin-bottom:18px}
.wt-types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.wt-type{padding:10px 4px;border-radius:5px;border:2.5px solid rgba(48,64,92,.5);cursor:pointer;transition:.15s;background:#f2f7fd;color:rgba(48,64,92,.7);font-family:inherit;font-size:.72rem;letter-spacing:.05em;font-weight:600}
.wt-type.on{background:#a8d8ff;border-color:#3a4a66;color:#3a4a66;box-shadow:2.5px 3px 0 rgba(48,64,92,.7)}
.wt-type:active{transform:scale(.94)}
.wt-field{margin-bottom:14px;text-align:left}
.wt-field label{display:block;font-size:.68rem;color:rgba(48,64,92,.6);letter-spacing:.1em;margin-bottom:6px;font-weight:600}
.wt-field input,.wt-field textarea{width:100%;padding:11px 13px;border-radius:6px;border:2.5px solid rgba(48,64,92,.45);background:#fff;color:#3d4a5e;font-family:inherit;font-size:.88rem;outline:none;box-sizing:border-box}
.wt-field input:focus,.wt-field textarea:focus{border-color:#3a4a66;box-shadow:3px 3px 0 rgba(48,64,92,.35)}
.wt-field textarea{min-height:110px;resize:vertical;line-height:1.7}
.wt-field .cnt{text-align:right;font-size:.6rem;color:rgba(48,64,92,.4);margin-top:3px}
.wt-anon-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.wt-anon-row .anon-lbl{font-size:.68rem;color:rgba(48,64,92,.6);letter-spacing:.08em;font-weight:600}
.wt-anon{flex:none;padding:7px 16px;border-radius:6px;border:2.5px solid #3a4a66;background:#f2f7fd;color:#3a4a66;font-family:inherit;font-size:.7rem;cursor:pointer;transition:.15s;box-shadow:2px 2.5px 0 rgba(48,64,92,.7);font-weight:600}
.wt-anon.on{background:#cfe6ff;color:#3a4a66}
.wt-anon:active{transform:translate(2px,2px);box-shadow:0 0 0}
.wt-shades{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wt-shade{width:76px;height:36px;border-radius:6px;border:2.5px solid rgba(48,64,92,.4);cursor:pointer;transition:.15s;box-shadow:2px 2.5px 0 rgba(48,64,92,.35);flex:none;display:flex;align-items:center;justify-content:center;font-size:.62rem;color:rgba(48,64,92,.75);font-weight:700;letter-spacing:.05em}
.wt-shade.on{border-color:#3a4a66;box-shadow:0 0 0 2.5px #fff,2.5px 3px 0 rgba(48,64,92,.55);transform:translateY(-2px) rotate(-2deg)}
.wt-vis{display:flex;gap:8px}
.wt-vis-btn{flex:1;padding:10px 6px;border-radius:6px;border:2.5px solid #3a4a66;background:#f2f7fd;color:#3a4a66;font-family:inherit;font-size:.72rem;cursor:pointer;transition:.15s;box-shadow:2px 2.5px 0 rgba(48,64,92,.7);font-weight:600}
.wt-vis-btn.on{background:#cfe6ff}
.wt-vis-btn:active{transform:translate(2px,2px);box-shadow:0 0 0}
.wt-btns{display:flex;gap:10px;margin-top:16px}
.wt-btns button{flex:1;padding:12px;border-radius:6px;border:2.5px solid #3a4a66;font-family:inherit;font-size:.85rem;letter-spacing:.12em;cursor:pointer;transition:.15s;font-weight:700}
.wt-ok{background:#a8d8ff;color:#3a4a66;box-shadow:3px 3.5px 0 rgba(48,64,92,.8)}
.wt-ok:active{transform:translate(2px,2px);box-shadow:1px 1px 0}
.wt-cancel{background:#f2f7fd;color:#3a4a66;box-shadow:3px 3.5px 0 rgba(48,64,92,.5)}
.wt-cancel:active{transform:translate(2px,2px);box-shadow:1px 1px 0}
.wt-list{max-height:46vh;overflow-y:auto;overscroll-behavior:contain;text-align:left;margin:4px 0 12px}
.wt-list::-webkit-scrollbar{width:0}
.wt-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;margin-bottom:8px;cursor:pointer;background:#fff;border:2px solid rgba(48,64,92,.35);transition:.15s;box-shadow:2px 2.5px 0 rgba(48,64,92,.25)}
.wt-item:active{transform:scale(.97)}
.wt-item .dot{width:12px;height:12px;border-radius:3px;flex:none;border:1.5px solid rgba(0,0,0,.25);transform:rotate(6deg)}
.wt-item .bd{flex:1;min-width:0}
.wt-item .tt{font-size:.8rem;color:#33415a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.wt-item .dt{font-size:.6rem;color:rgba(48,64,92,.45);margin-top:2px}
.wt-item .go{color:rgba(48,64,92,.5);font-size:.8rem}
.wt-empty{font-size:.75rem;color:rgba(48,64,92,.45);text-align:center;padding:26px 0}
.wt-search{display:flex;gap:8px;margin-bottom:12px}
.wt-search input{flex:1;padding:10px 13px;border-radius:6px;border:2.5px solid rgba(48,64,92,.45);background:#fff;color:#3d4a5e;font-family:inherit;font-size:.82rem;outline:none}
.wt-search input:focus{border-color:#3a4a66}
.wt-search button{padding:10px 18px;border-radius:6px;border:2.5px solid #3a4a66;background:#a8d8ff;color:#3a4a66;font-family:inherit;font-size:.78rem;cursor:pointer;font-weight:700;box-shadow:2.5px 3px 0 rgba(48,64,92,.7)}
.wt-search button:active{transform:translate(2px,2px);box-shadow:1px 1px 0}
.wt-zoom{position:fixed;inset:0;z-index:60;background:rgba(48,64,92,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:24px;animation:wtFade .25s ease}
.wt-zoom.show{display:flex}
.wt-zoom-card{width:min(420px,100%);aspect-ratio:.8;border-radius:4px 18px 4px 4px;padding:24px 22px;border:3px solid #3a4a66;box-shadow:6px 7px 0 rgba(48,64,92,.6);animation:wtPop .3s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;font-family:"Ma Shan Zheng","Xingkai SC","STKaiti",serif;color:#2c3a52;position:relative;transform:rotate(-.4deg)}
.wt-zoom-card::before{content:'';position:absolute;top:-3px;left:50%;transform:translateX(-50%) rotate(-1.5deg);width:55%;height:18px;background:linear-gradient(90deg,rgba(255,255,255,.75),rgba(255,255,255,.4));border-left:1.5px dashed rgba(0,0,0,.15);border-right:1.5px dashed rgba(0,0,0,.15)}
.wt-zoom-card .z-type{font-size:.68rem;letter-spacing:.25em;color:rgba(0,0,0,.5);margin-bottom:5px;font-weight:600}
.wt-zoom-card .z-title{font-size:1.5rem;font-weight:700;line-height:1.4;letter-spacing:.06em;margin-bottom:10px}
.wt-zoom-card .z-content{font-size:.95rem;line-height:1.9;flex:1;overflow-y:auto;word-break:break-all;white-space:pre-wrap}
.wt-zoom-card .z-author{font-size:.75rem;color:rgba(0,0,0,.55);text-align:right;margin-top:8px;display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0}
.wt-zoom-card .z-author .av{width:18px;height:18px;border-radius:50%;flex:none;border:1.5px solid rgba(0,0,0,.28);background-size:cover;background-position:center;display:inline-flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff;line-height:1}
.wt-zoom-card .z-author .au-nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;font-weight:600}
.wt-zoom-card .z-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.66rem;color:rgba(0,0,0,.5)}
.wt-zoom-card .z-badge{font-size:.62rem;padding:2px 10px;border-radius:4px;background:rgba(255,255,255,.6);border:2px solid rgba(0,0,0,.2);font-weight:600}
.wt-zoom-card .z-meta-r{display:flex;align-items:center;gap:8px}
.wt-zoom-card #zDel{font-size:.62rem;padding:2px 10px;border-radius:4px;background:rgba(255,235,235,.9);border:2px solid #c0504a;color:#c0504a;font-family:inherit;font-weight:700;cursor:pointer}
.wt-zoom-card #zDel:active{transform:scale(.94)}
.wt-zoom-card .z-comments{margin-top:10px;text-align:left;max-height:26%;overflow-y:auto}
.wt-zoom-card .z-cmt{display:flex;gap:7px;align-items:flex-start;font-size:.72rem;color:rgba(0,0,0,.7);padding:6px 10px;border-radius:5px;background:rgba(255,255,255,.55);margin-bottom:5px;border:1.5px solid rgba(0,0,0,.12)}
.wt-zoom-card .z-cmt .cmt-av{width:18px;height:18px;border-radius:50%;flex:none;border:1.5px solid rgba(0,0,0,.25);background-size:cover;background-position:center;display:inline-flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:700;color:#fff;line-height:1;margin-top:1px}
.wt-zoom-card .z-cmt .cmt-av.av-anon{background:#9aa8bd}
.wt-zoom-card .z-cmt .cmt-bd{flex:1;min-width:0}
.wt-zoom-card .z-cmt .cmt-txt{word-break:break-all;white-space:pre-wrap}
.wt-zoom-card .z-cmt .m{font-size:.58rem;color:rgba(0,0,0,.45);margin-top:2px}
.wt-zoom-card .z-no-cmt{font-size:.62rem;color:rgba(0,0,0,.45);text-align:center;padding:6px 0}
.wt-zoom-card .z-cmt-form{display:flex;gap:5px;margin-top:8px}
.wt-zoom-card .z-cmt-form input{flex:1;min-width:0;padding:7px 9px;border-radius:5px;border:2px solid rgba(0,0,0,.2);background:rgba(255,255,255,.8);color:#33415a;font-family:inherit;font-size:.68rem;outline:none}
.wt-zoom-card .z-cmt-form button{flex:none;padding:7px 14px;border-radius:5px;border:2px solid #3a4a66;background:#a8d8ff;color:#3a4a66;font-family:inherit;font-size:.68rem;cursor:pointer;font-weight:700}
.wt-zoom-card .z-cmt-form button:active{transform:scale(.94)}
.wt-zoom-card .z-cmt-anon-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.wt-zoom-card .z-cmt-anon{flex:none;padding:4px 12px;border-radius:5px;border:2px solid rgba(0,0,0,.22);background:rgba(255,255,255,.6);color:#33415a;font-family:inherit;font-size:.6rem;cursor:pointer;font-weight:600}
.wt-zoom-card .z-cmt-anon.on{background:#cfe6ff;border-color:#3a4a66;color:#3a4a66}
.wt-zoom-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;width:40px;height:40px;border-radius:6px;border:2.5px solid #3a4a66;background:#a8d8ff;color:#3a4a66;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:65;box-shadow:2.5px 3px 0 rgba(48,64,92,.7);font-weight:700}
.wt-zoom-close:active{transform:translate(2px,2px);box-shadow:1px 1px 0}
</style>
</head>
<body>
<div id="viewport"><div id="canvas"></div></div>
<div id="ghost"></div>
<div class="wt-top"><a class="wt-btn" href="../" id="btnHome">首页</a><div class="wt-title">便 签 墙<small>拖动画布 · 把便签贴到喜欢的位置</small></div><button class="wt-btn" id="btnMy">我的便签</button></div>
<div class="wt-tabs" id="wallTabs"><button class="wt-tab on" data-w="all">全部</button><button class="wt-tab" data-w="bless">祝福</button><button class="wt-tab" data-w="story">故事</button><button class="wt-tab" data-w="relation">关系</button><button class="wt-tab" data-w="heart">心事</button></div>
<button class="wt-add" id="btnAdd">贴一张便签</button>
<div class="wt-zoom-ctl"><button class="wt-zbtn" id="zoomIn">+</button><button class="wt-zbtn" id="zoomOut">-</button><button class="wt-zbtn" id="zoomFit" style="font-size:.78rem">全</button></div>
<div class="wt-bottom"><button class="wt-btn2" id="btnFind">找便签</button></div>
<div class="wt-zoom-lbl" id="zoomLbl">100%</div>
<div id="placeBar">点画布上的位置贴上去 <b id="placeCancel">取消</b></div>
<div class="wt-hint" id="wtHint"></div>
<!-- 写便签弹层 -->
<div class="wt-mask" id="addMask">
  <div class="wt-panel">
    <h3>贴 一 张 便 签</h3>
    <div class="sub">写下心愿、故事，或想对谁说的话</div>
    <div class="wt-types" id="typeSel">
      <div class="wt-type on" data-t="bless">祝福</div>
      <div class="wt-type" data-t="story">故事</div>
      <div class="wt-type" data-t="relation">关系</div>
      <div class="wt-type" data-t="heart">心事</div>
    </div>
    <div class="wt-field"><label>标题</label><input id="addTitle" maxlength="12" placeholder="几个字即可"></div>
    <div class="wt-field"><label>内容</label><textarea id="addContent" maxlength="300" placeholder="把想说的话写下来……"></textarea><div class="cnt"><span id="addCnt">0</span>/300</div></div>
    <div class="wt-anon-row"><span class="anon-lbl">匿名发布</span><button type="button" class="wt-anon" id="anonBtn">不匿名</button><span class="anon-tip" style="font-size:.6rem;color:rgba(48,64,92,.45)">匿名则不显示头像和名字</span></div>
    <div class="wt-field"><label>颜色深浅</label><div class="wt-shades" id="shadeSel"></div></div>
    <div class="wt-field"><label>可见范围</label>
      <div class="wt-vis">
        <button type="button" class="wt-vis-btn on" data-v="public">公开（所有人可见）</button>
        <button type="button" class="wt-vis-btn" data-v="private">私密（仅自己可见）</button>
      </div>
    </div>
    <div class="wt-btns"><button class="wt-cancel" id="addCancel">算了</button><button class="wt-ok" id="addOk">贴上去</button></div>
  </div>
</div>
<!-- 我的便签弹层 -->
<div class="wt-mask" id="myMask">
  <div class="wt-panel">
    <h3>我 的 便 签</h3>
    <div class="sub">点一张去看它</div>
    <div class="wt-list" id="myList"></div>
    <div class="wt-btns"><button class="wt-cancel" id="myClose">关 闭</button></div>
  </div>
</div>
<!-- 找便签弹层 -->
<div class="wt-mask" id="findMask">
  <div class="wt-panel">
    <h3>找 便 签</h3>
    <div class="sub">按标题或内容搜索</div>
    <div class="wt-search"><input id="findInput" placeholder="搜标题或内容…"><button id="findGo">找</button></div>
    <div class="wt-list" id="findList"></div>
    <div class="wt-btns"><button class="wt-cancel" id="findClose">关 闭</button></div>
  </div>
</div>
<!-- 放大查看（含评论） -->
<div class="wt-zoom" id="zoomMask">
  <button class="wt-zoom-close" id="zoomClose">×</button>
  <div class="wt-zoom-card" id="zoomCard">
    <div class="z-type" id="zType"></div>
    <div class="z-title" id="zTitle"></div>
    <div class="z-content" id="zContent"></div>
    <div class="z-author" id="zAuthor"></div>
    <div class="z-meta"><span id="zDate"></span><span class="z-meta-r"><span class="z-badge" id="zBadge"></span><button id="zDel" style="display:none">删除</button></span></div>
    <div class="z-comments" id="zComments"></div>
    <div class="z-cmt-form">
      <input id="zCmtText" maxlength="120" placeholder="写点什么…">
      <button id="zCmtSend">评论</button>
    </div>
    <div class="z-cmt-anon-row"><span style="font-size:.58rem;color:rgba(0,0,0,.45)">匿名评论</span><button type="button" class="z-cmt-anon" id="cmtAnonBtn">不匿名</button></div>
  </div>
</div>
<script src="../supabase-config.js?v=14"></script>
<script src="app.js?v=8"></script>
</body>
</html>
