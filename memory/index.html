<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>月下记忆库</title>
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Ma Shan Zheng","Xingkai SC","STXingkai","Kaiti SC","STKaiti","KaiTi","楷体",serif;color:#f2ede0;background:#05030f;user-select:none}
canvas#stars{position:fixed;inset:0;z-index:0}
#app{position:fixed;inset:0;z-index:1}

/* ===== 顶栏 ===== */
.header{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;z-index:20}
.header h1{font-size:1rem;color:#f0cf82;letter-spacing:.35em;text-shadow:0 0 18px rgba(240,207,130,.4);font-weight:400}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(240,207,130,.22);background:rgba(10,8,30,.65);color:#f2ede0;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.icon-btn:active{transform:scale(.9)}

/* ===== 图布 ===== */
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
#world{position:absolute;left:0;top:0;width:100%;height:100%}
.node{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;will-change:transform}
.node-core{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0a0815;font-weight:bold}
.node-ring{position:absolute;inset:-7px;border-radius:50%;pointer-events:none;animation:pulse 3s ease-in-out infinite}
.node-label{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:.62rem;white-space:nowrap;letter-spacing:.05em;text-shadow:0 1px 4px rgba(0,0,0,.8)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.12);opacity:.1}}
#emptyHint{position:absolute;left:50%;top:58%;transform:translateX(-50%);text-align:center;color:rgba(240,207,130,.45);font-size:.78rem;line-height:2;pointer-events:none;letter-spacing:.1em}
#centerHint{position:absolute;left:50%;top:64px;transform:translateX(-50%);font-size:.6rem;color:rgba(240,207,130,.38);letter-spacing:.18em;pointer-events:none;z-index:19;white-space:nowrap}

/* ===== 底部 + 按钮 ===== */
#addBtn{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;border:2px solid rgba(240,207,130,.45);background:radial-gradient(circle at 32% 30%,rgba(240,207,130,.25),rgba(240,207,130,.05));color:#f0cf82;font-size:1.9rem;cursor:pointer;box-shadow:0 0 28px rgba(240,207,130,.2);z-index:20;line-height:1}
#addBtn:active{transform:translateX(-50%) scale(.92)}
#sumBtn{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:999px;border:1px solid rgba(240,207,130,.42);background:linear-gradient(135deg,rgba(240,207,130,.2),rgba(240,207,130,.05));color:#f0cf82;font-family:inherit;font-size:.76rem;letter-spacing:.16em;cursor:pointer;box-shadow:0 0 22px rgba(240,207,130,.18);z-index:20;white-space:nowrap}
#sumBtn:active{transform:translateX(-50%) scale(.94)}
#sumBtn:disabled{opacity:.5}

/* ===== 类型选择弹窗 ===== */
.sheet-mask{position:fixed;inset:0;background:rgba(3,2,10,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px)}
.sheet-mask.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:linear-gradient(to top,rgba(8,5,20,.99),rgba(8,5,20,.92));backdrop-filter:blur(20px);border-top:1px solid rgba(240,207,130,.2);border-radius:24px 24px 0 0;padding:18px 18px 30px;transform:translateY(100%);transition:transform .32s cubic-bezier(.4,0,.2,1)}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:rgba(240,207,130,.3);border-radius:2px;margin:0 auto 14px}
.sheet-title{font-size:.85rem;color:#f0cf82;text-align:center;letter-spacing:.25em;margin-bottom:16px}
.type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.type-card{padding:16px 12px;border-radius:14px;border:1px solid rgba(240,207,130,.16);background:rgba(255,255,255,.03);text-align:center;cursor:pointer;transition:all .2s}
.type-card:active{transform:scale(.95);background:rgba(240,207,130,.08)}
.type-card .t-ico{font-size:1.5rem;margin-bottom:6px}
.type-card .t-name{font-size:.82rem;color:#f2ede0;letter-spacing:.08em}
.type-card .t-desc{font-size:.6rem;color:rgba(240,207,130,.4);margin-top:3px}

/* ===== 编辑面板 ===== */
#panel{position:fixed;left:0;right:0;bottom:0;z-index:45;background:linear-gradient(to top,rgba(8,5,20,.99),rgba(8,5,20,.93));backdrop-filter:blur(20px);border-top:1px solid rgba(240,207,130,.2);border-radius:24px 24px 0 0;padding:16px 18px calc(24px + env(safe-area-inset-bottom));max-height:82vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .34s cubic-bezier(.4,0,.2,1)}
#panel.open{transform:translateY(0)}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.panel-head h2{font-size:.9rem;color:#f0cf82;letter-spacing:.2em;font-weight:400}
.p-btn-close{width:32px;height:32px;border-radius:50%;border:1px solid rgba(240,207,130,.2);background:transparent;color:rgba(242,237,224,.7);font-size:.95rem;cursor:pointer}
.panel-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:.66rem;color:rgba(240,207,130,.55);margin-bottom:6px;letter-spacing:.12em}
.form-input{width:100%;background:rgba(255,255,255,.045);border:1px solid rgba(240,207,130,.15);border-radius:10px;padding:11px 13px;color:#f2ede0;font-family:inherit;font-size:.88rem;outline:none;user-select:text}
.form-input:focus{border-color:rgba(240,207,130,.45);background:rgba(240,207,130,.04)}
textarea.form-input{min-height:90px;resize:vertical;line-height:1.6}
select.form-input{cursor:pointer;-webkit-appearance:none;appearance:none}
.ai-hint{font-size:.62rem;color:rgba(167,154,222,.6);margin-top:5px;letter-spacing:.05em}
.panel-foot{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:13px;border-radius:12px;border:none;font-family:inherit;font-size:.85rem;letter-spacing:.12em;cursor:pointer}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,rgba(240,207,130,.3),rgba(200,155,60,.15));color:#f0cf82;border:1px solid rgba(240,207,130,.35)}
.btn-ghost{background:rgba(255,255,255,.04);color:rgba(240,207,130,.55);border:1px solid rgba(240,207,130,.15)}
.btn-danger{background:rgba(255,80,80,.08);color:rgba(255,110,110,.65);border:1px solid rgba(255,80,80,.18)}

/* ===== Toast ===== */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-12px);padding:9px 22px;border-radius:999px;background:rgba(12,9,32,.92);border:1px solid rgba(240,207,130,.3);color:#f0cf82;font-size:.75rem;letter-spacing:.08em;opacity:0;transition:all .28s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== AI 精炼中遮罩 ===== */
#aiLoading{position:fixed;inset:0;background:rgba(3,2,10,.75);z-index:55;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(4px)}
#aiLoading.show{display:flex}
.ai-orb{width:52px;height:52px;border-radius:50%;border:2px solid rgba(240,207,130,.25);border-top-color:#f0cf82;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#aiLoading p{font-size:.78rem;color:rgba(240,207,130,.7);letter-spacing:.15em}

/* ===== 人格分析面板 ===== */
#analysis{position:fixed;inset:0;z-index:52;display:none;flex-direction:column;background:linear-gradient(180deg,rgba(6,4,18,.99),rgba(10,7,26,.99));backdrop-filter:blur(6px)}
#analysis.open{display:flex}
.an-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid rgba(240,207,130,.12);flex:0 0 auto}
.an-head h2{font-size:.92rem;color:#f0cf82;letter-spacing:.22em;font-weight:400;text-shadow:0 0 16px rgba(240,207,130,.35)}
.an-head .an-sub{font-size:.58rem;color:rgba(240,207,130,.45);letter-spacing:.14em;margin-top:4px}
.an-close{width:34px;height:34px;border-radius:50%;border:1px solid rgba(240,207,130,.2);background:transparent;color:rgba(242,237,224,.7);font-size:1rem;cursor:pointer}
.an-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 20px calc(24px + env(safe-area-inset-bottom));user-select:text}
.an-body::-webkit-scrollbar{width:3px}
.an-body::-webkit-scrollbar-thumb{background:rgba(240,207,130,.25);border-radius:3px}
.an-body h3{font-size:.86rem;color:#f0cf82;letter-spacing:.12em;margin:22px 0 9px;padding-left:11px;border-left:2px solid rgba(240,207,130,.55);font-weight:400}
.an-body h3:first-child{margin-top:0}
.an-body p{font-size:.84rem;line-height:1.95;color:rgba(242,237,224,.88);margin-bottom:9px;letter-spacing:.02em}
.an-body li{font-size:.84rem;line-height:1.9;color:rgba(242,237,224,.85);margin:0 0 6px 18px;list-style:none;position:relative}
.an-body li:before{content:'✦';position:absolute;left:-16px;color:rgba(240,207,130,.55);font-size:.62rem;top:.28em}
.an-body strong{color:#f0cf82;font-weight:600}
.an-body em{color:#a79ade;font-style:normal}
.an-foot{display:flex;gap:10px;padding:12px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid rgba(240,207,130,.12);flex:0 0 auto;background:rgba(6,4,18,.9)}
.an-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;height:70%;text-align:center}
.an-loading .an-orb{width:64px;height:64px;border-radius:50%;border:2px solid rgba(240,207,130,.2);border-top-color:#f0cf82;animation:spin 1s linear infinite}
.an-loading p{font-size:.76rem;color:rgba(240,207,130,.65);letter-spacing:.16em;line-height:2}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div id="app">
  <div class="header">
    <button class="icon-btn" id="btnBack">⌂</button>
    <h1>✦ 记忆网络</h1>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="btnImport" title="导入">⇩</button>
      <button class="icon-btn" id="btnClearAll" title="清空全部记忆">🗑</button>
      <button class="icon-btn" id="btnStats">∞</button>
    </div>
  </div>
  <div id="stage"><div id="world"></div></div>
  <div id="centerHint"></div>
  <div id="emptyHint" style="display:none">这里还没有记忆<br>点击下方 ＋ 埋下第一颗星</div>
  <button id="sumBtn">✦ 总结记忆</button>
  <button id="addBtn">+</button>
</div>

<!-- 类型选择 -->
<div class="sheet-mask" id="typeMask"></div>
<div class="sheet" id="typeSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">埋下一颗新的记忆</div>
  <div class="type-grid" id="typeGrid"></div>
</div>

<!-- 编辑面板 -->
<div id="panel">
  <div class="panel-head">
    <h2 id="panelTitle">编辑</h2>
    <button class="p-btn-close" id="panelClose">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
  <div class="panel-foot">
    <button class="btn btn-danger" id="btnDelete" style="flex:0 0 84px">删除</button>
    <button class="btn btn-ghost" id="btnCancel" style="flex:0 0 84px">取消</button>
    <button class="btn btn-primary" id="btnSave">保存</button>
  </div>
</div>

<!-- AI 精炼中 -->
<div id="aiLoading"><div class="ai-orb"></div><p>月光正在凝练这段记忆……</p></div>

<!-- 人格分析面板 -->
<div id="analysis">
  <div class="an-head">
    <div>
      <h2>◈ 你的人格星图</h2>
      <div class="an-sub">由全部记忆推演 · AI 深度解读</div>
    </div>
    <button class="an-close" id="anClose">✕</button>
  </div>
  <div class="an-body" id="anBody"></div>
  <div class="an-foot">
    <button class="btn btn-ghost" id="anCopy" style="flex:0 0 96px">复制</button>
    <button class="btn btn-primary" id="anRedo">重新分析</button>
  </div>
</div>

<!-- 导入面板 -->
<div id="importPanel" style="position:fixed;inset:0;z-index:48;display:none;align-items:flex-end;background:rgba(3,2,10,.6);backdrop-filter:blur(3px)" onclick="if(event.target===this)this.style.display='none'">
  <div style="width:100%;background:linear-gradient(to top,rgba(8,5,20,.99),rgba(8,5,20,.93));backdrop-filter:blur(20px);border-top:1px solid rgba(240,207,130,.2);border-radius:24px 24px 0 0;padding:18px 18px calc(28px + env(safe-area-inset-bottom))">
    <div style="font-size:.85rem;color:#f0cf82;text-align:center;letter-spacing:.25em;margin-bottom:14px">⇩ 导入记忆</div>
    <textarea id="importText" class="form-input" style="min-height:120px;user-select:text" placeholder="粘贴从塔罗/星座/配对/合盘页复制的内容…"></textarea>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn btn-ghost" id="importCancel" style="flex:0 0 84px">取消</button>
      <button class="btn btn-primary" id="importGo">一键点亮</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ================= AI 配置 ================= */
const API_BASE='https://apihub.agnes-ai.cn/v1';
const API_KEY='sk-bnT8gvJweewxMFO2oOnzNof2qpqazpKYq1spx5EulZ11vfyZ';
const MODEL='agnes-2.5-flash';

/* ================= 数据层（自包含，不依赖 memory.js） ================= */
const STORE_KEY='sleepy_space_memory_v2';
function dbLoad(){
  try{const d=JSON.parse(localStorage.getItem(STORE_KEY));if(d&&d.items)return d;}catch(e){}
  return{items:[]};
}
function dbSave(db){localStorage.setItem(STORE_KEY,JSON.stringify(db));}
function dbAdd(item){const db=dbLoad();item.id=Date.now()+''+Math.floor(Math.random()*1000);db.items.unshift(item);dbSave(db);return item;}
function dbUpdate(id,patch){const db=dbLoad();const it=db.items.find(i=>i.id===id);if(it){Object.assign(it,patch);dbSave(db);}return db;}
function dbDelete(id){const db=dbLoad();db.items=db.items.filter(i=>i.id!==id);dbSave(db);}

/* ================= 类型定义 ================= */
const TYPES={
  core:{label:'核心记忆',icon:'🌙',color:'#ffd97a',desc:'AI 总结的你'},
  yijing:{label:'问卦',icon:'☯',color:'#c9b0e8',desc:'易经六爻'},
  birthday:{label:'生日',icon:'🎂',color:'#f0cf82',desc:'重要的日子'},
  traits:{label:'性格',icon:'◈',color:'#a79ade',desc:'我是什么样的'},
  story:{label:'故事',icon:'📖',color:'#e8b48f',desc:'一段难忘经历'},
  free:{label:'自定义',icon:'✦',color:'#8fc7e8',desc:'无模板自由记录'}
};

/* ================= 星空背景 ================= */
const cv=document.getElementById('stars'),ctx=cv.getContext('2d');
let starsArr=[],meteors=[];
function resizeStars(){
  cv.width=innerWidth;cv.height=innerHeight;starsArr=[];
  const n=Math.floor(cv.width*cv.height/13000);
  for(let i=0;i<n;i++)starsArr.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.3+.25,a:Math.random()*.5+.08,sp:Math.random()*.0028+.0008,ph:Math.random()*7});
}
function drawStars(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(const s of starsArr){
    s.ph+=s.sp;
    ctx.globalAlpha=s.a*(.55+.45*Math.sin(s.ph*1000));
    ctx.fillStyle=s.hue||(s.hue=Math.random()<.1?'#bcd7ff':'#fff7e0');
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
  }
  if(Math.random()<.0025&&meteors.length<2)meteors.push({x:Math.random()*cv.width,y:Math.random()*cv.height*.35,vx:-(4+Math.random()*4),vy:2+Math.random()*2.5,life:1});
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];m.x+=m.vx;m.y+=m.vy;m.life-=.014;
    if(m.life<=0){meteors.splice(i,1);continue;}
    const g=ctx.createLinearGradient(m.x,m.y,m.x-m.vx*45,m.y-m.vy*45);
    g.addColorStop(0,'rgba(240,207,130,'+m.life+')');g.addColorStop(1,'rgba(240,207,130,0)');
    ctx.globalAlpha=m.life*.7;ctx.strokeStyle=g;ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*45,m.y-m.vy*45);ctx.stroke();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(drawStars);
}
addEventListener('resize',resizeStars);resizeStars();requestAnimationFrame(drawStars);

/* ================= 神经元网络渲染 ================= */
const stage=document.getElementById('stage'),world=document.getElementById('world');
let nodes=[],cam={x:0,y:0,z:1},dragging=false,dragMoved=false,downPt=null,camStart=null;

function buildNodes(){
  const db=dbLoad();
  nodes=[{id:'center',label:'我',type:'center',x:0,y:0,z:1,size:52,data:null}];
  db.items.forEach((it,idx)=>{
    const T=TYPES[it.type]||TYPES.free;
    const ang=(idx/Math.max(db.items.length,4))*Math.PI*2- Math.PI/2;
    const dist=130+Math.random()*70;
    var _lb = it.title || ((it.data && it.data.note) ? String(it.data.note).split('\n')[0].slice(0,14) : T.label);
    nodes.push({id:it.id,label:_lb,type:it.type,x:Math.cos(ang)*dist,y:Math.sin(ang)*dist,z:.55+Math.random()*.4,size:36,data:it});
  });
  document.getElementById('emptyHint').style.display=db.items.length?'none':'block';
  const cnt=src=>db.items.filter(i=>i.source===src).length;
  const parts=[];
  if(cnt('tarot'))parts.push('☽塔罗'+cnt('tarot'));
  if(cnt('horoscope'))parts.push('✦星座'+cnt('horoscope'));
  if(cnt('pair'))parts.push('⌘配对'+cnt('pair'));
  if(cnt('synastry'))parts.push('∞合盘'+cnt('synastry'));
  if(cnt('yijing'))parts.push('☯问卦'+cnt('yijing'));
  if(cnt('personal')||cnt('birthday'))parts.push('◈档案');
  const other=db.items.length-cnt('tarot')-cnt('horoscope')-cnt('pair')-cnt('synastry')-cnt('yijing')-cnt('personal')-cnt('birthday')-cnt('core');
  if(other>0)parts.push('✎其他'+other);
  const ch=document.getElementById('centerHint');
  ch.textContent=parts.length?('已收录 '+db.items.length+' 条 · '+parts.join(' · ')):'';
  ch.style.display=parts.length?'block':'none';
  document.getElementById('sumBtn').style.display=db.items.length?'block':'none';
  render();
}

function proj(n){
  const s=cam.z*n.z;
  return{x:(n.x-cam.x)*s+innerWidth/2,y:(n.y-cam.y)*s+innerHeight/2,s};
}

function render(){
  world.innerHTML='';
  /* SVG 连线 */
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('style','position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none');
  let svgHtml='';
  nodes.forEach(n=>{
    if(n.id==='center')return;
    const c=proj(nodes[0]),p=proj(n);
    const w=Math.max(.5,c.s*p.s*.9).toFixed(1);
    const mx=(c.x+p.x)/2+(p.y-c.y)*.08,my=(c.y+p.y)/2-(p.x-c.x)*.08;
    svgHtml+='<path d="M'+c.x.toFixed(1)+' '+c.y.toFixed(1)+' Q'+mx.toFixed(1)+' '+my.toFixed(1)+' '+p.x.toFixed(1)+' '+p.y.toFixed(1)+'" fill="none" stroke="rgba(240,207,130,.14)" stroke-width="'+w+'"/>';
    svgHtml+='<circle r="1.6" fill="rgba(240,207,130,.5)"><animateMotion dur="'+(3+Math.random()*3).toFixed(1)+'s" repeatCount="indefinite" path="M'+c.x.toFixed(1)+' '+c.y.toFixed(1)+' Q'+mx.toFixed(1)+' '+my.toFixed(1)+' '+p.x.toFixed(1)+' '+p.y.toFixed(1)+'"/></circle>';
  });
  svg.innerHTML=svgHtml;
  world.appendChild(svg);

  /* 节点（按 z 从远到近画） */
  nodes.slice().sort((a,b)=>a.z-b.z).forEach(n=>{
    const T=n.type==='center'?{icon:'◈',color:'#f0cf82'}:TYPES[n.type]||TYPES.free;
    const p=proj(n);
    const el=document.createElement('div');
    el.className='node';

/* ================= 平移缩放 ================= */
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.node'))return;
  dragging=true;dragMoved=false;downPt={x:e.clientX,y:e.clientY};camStart={...cam};
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-downPt.x,dy=e.clientY-downPt.y;
  if(Math.abs(dx)+Math.abs(dy)>6)dragMoved=true;
  cam.x=camStart.x-dx/cam.z;cam.y=camStart.y-dy/cam.z;
  render();
});
stage.addEventListener('pointerup',()=>{dragging=false;setTimeout(()=>dragMoved=false,50);});
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  cam.z=Math.max(.35,Math.min(2.6,cam.z*(e.deltaY>0?.92:1.08)));
  render();
},{passive:false});
/* 双指缩放 */
let pinch=null;
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch={d:dist2(e),z:cam.z};dragging=false;}},{passive:true});
stage.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){cam.z=Math.max(.35,Math.min(2.6,pinch.z*dist2(e)/pinch.d));render();}},{passive:true});
stage.addEventListener('touchend',()=>{pinch=null;},{passive:true});
function dist2(e){const a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}

async function aiRefine(payload){
  const sys='你是「月下记忆」的守护者。用户记录了一段个人记忆，请你：1) 为它提炼一个不超过12字、诗意而克制的标题；2) 写一句不超过30字的"星语"点评，温柔但不说教。只输出JSON：{"title":"...","whisper":"..."}，不要其他内容。';
  try{
    const j=await window.AIRelay.complete({
      temperature:.8,max_tokens:300,
      messages:[{role:'system',content:sys},{role:'user',content:JSON.stringify(payload)}],
      onRetry:()=>{}});
    if(j.choices&&j.choices[0]){
      let txt=j.choices[0].message.content.trim().replace(/^```json?|```$/g,'').trim();
      const m=txt.match(/\{[\s\S]*\}/);
      if(m){const o=JSON.parse(m[0]);return{title:(o.title||'').slice(0,20),whisper:(o.whisper||'').slice(0,60)};}
    }
  }catch(e){}
  return null;
}

function buildAnalysisMaterial(){
  const db=dbLoad();
  const items=db.items||[];
  const notSrc=['personal','birthday','tarot','horoscope','pair','synastry','yijing'];
  const line=i=>'- '+(i.title||'')+(i.data&&i.data.note?('：'+String(i.data.note).replace(/\n+/g,' / ')):'');
  const sec=(name,arr)=>arr&&arr.length?('【'+name+'】（'+arr.length+'条）\n'+arr.map(line).join('\n')+'\n\n'):'';
  const pick=f=>items.filter(f);
  let s='';
  s+=sec('个人档案与生日',pick(i=>i.source==='personal'||i.source==='birthday'));
  s+=sec('塔罗占卜记录',pick(i=>i.source==='tarot'));
  s+=sec('星座运势',pick(i=>i.source==='horoscope'));
  s+=sec('星座配对',pick(i=>i.source==='pair'));
  s+=sec('星座合盘',pick(i=>i.source==='synastry'));
  s+=sec('易经问卦',pick(i=>i.source==='yijing'));
  s+=sec('其他故事与自定义记录',pick(i=>notSrc.indexOf(i.source)<0));
  return {text:s.trim(),count:items.length};
}

function mdToHtml(md){
  const inline=t=>escapeHtml(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*]+?)\*/g,'$1<em>$2</em>');
  const lines=String(md||'').split('\n');
  let html='',inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false;}};
  for(let raw of lines){
    const line=raw.replace(/\s+$/,'');
    if(!line.trim()){closeList();continue;}
    let m;
    if((m=line.match(/^\s*#{1,6}\s*(.+)$/))){closeList();html+='<h3>'+inline(m[1])+'</h3>';continue;}
    if((m=line.match(/^\s*[-*•]\s+(.+)$/))){if(!inList){html+='<ul>';inList=true;}html+='<li>'+inline(m[1])+'</li>';continue;}
    closeList();
    html+='<p>'+inline(line)+'</p>';
  }
  closeList();
  return html;
}

    '3. 用 Markdown 输出，只用 ## 标题和 - 列表，不要用表格，不要用代码块。\n'+
    '4. 必须包含以下六个部分，标题照抄：\n'+
    '## 一、核心性格底色\n'+
    '## 二、情感模式与喜欢的人\n'+
    '（重点：TA 在感情里的真实需求；容易心动与退缩的点；暗恋对象/喜欢的人的可能画像与性格特征；TA 表达喜欢的方式；容易被什么打动或劝退）\n'+
    '## 三、事业与学业倾向\n'+
    '## 四、内心需求与软肋\n'+
    '## 五、最近的状态（从占卜与运势记录推断）\n'+
    '## 六、给 TA 的三句话\n'+
    '5. 每个部分至少 3 条具体内容，尽量引用素材里的具体问题或事件。';
  let txt='';
  try{
    const j=await window.AIRelay.complete({
      temperature:.85,max_tokens:4000,
      messages:[{role:'system',content:sys},{role:'user',content:'这是我全部的记录：\n\n'+mat.text}],
      onRetry:()=>{}});
    if(j.choices&&j.choices[0])txt=j.choices[0].message.content.trim();

  saveCore(txt);

}

/* 内容指纹：与已有节点比对，避免重复导入 */
function noteHash(t,n){let h=5381,s=String(t||'')+'\u0000'+String(n||'');for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}return h.toString(36);}

document.getElementById('importGo').onclick=()=>{
  const raw=document.getElementById('importText').value.trim();
  if(!raw){toast('先粘贴内容吧');return;}
  const db=dbLoad();
  let added=0,dups=0;
  function pushItem(type,title,note,createdAt){
    note=String(note||'').trim();
    title=String(title||'').trim();
    if(!title&&!note)return;
    if(!title)title=note.split('\n')[0].slice(0,20)||'✦ 导入的记忆';
    const sig='imp|'+noteHash(title,note);
    /* 双保险去重：①同 sig ②同标题+同内容（跨来源也去重） */
    const hh=noteHash(title,note);
    if(db.items.some(i=>i.sig===sig||noteHash(i.title,i.data&&i.data.note)===hh)){dups++;return;}
    db.items.unshift({id:Date.now()+''+Math.floor(Math.random()*100000),type:type||'story',title:title,data:{title:title,note:note},createdAt:createdAt||Date.now(),source:'import',sig:sig});
    added++;
  }
  /* 先尝试当作 JSON 解析（从任意位置提取） */
  let jsonTxt=null;
  try{JSON.parse(raw);jsonTxt=raw;}catch(e){
    const m=raw.match(/[\{\[][\s\S]*[\}\]]/);
    if(m){try{JSON.parse(m[0]);jsonTxt=m[0];}catch(e2){}}
  }
  const looksJson=/^[\s\uFEFF]*[\{\[]/.test(raw)||raw.indexOf('moon_import')>=0;
  if(jsonTxt){
    try{
      const j=JSON.parse(jsonTxt);
      const recs=(j&&j.moon_import&&Array.isArray(j.records))?j.records:(Array.isArray(j)?j:(Array.isArray(j&&j.items)?j.items:[]));
      recs.forEach(r=>{
        if(!r||typeof r!=='object')return;
        const note=String(r.note!=null?r.note:((r.data&&r.data.note)||r.text||r.result||''));
        pushItem(r.type||'story',r.title||(r.data&&r.data.title),note,r.createdAt);
      });
    }catch(e){}
  }
  /* 只有确认不是 JSON 时，才走纯文本分块回退 */
  if(!added&&!looksJson){
    const blocks=raw.split(/\n{2,}|(?=☽ 塔罗|✦ 观星|⌘ 配对|∞ 合盘|🎂 生日|◈ 个人档案)/).map(b=>b.trim()).filter(Boolean);
    blocks.forEach(b=>{
      const first=b.split('\n')[0].replace(/^#+\s*/,'').slice(0,24);
      pushItem('free',first||'✦ 导入',b);
    });
  }
  if(added)dbSave(db);
  importPanel.style.display='none';document.getElementById('importText').value='';
  buildNodes();
  if(added)toast('已点亮 '+added+' 颗星 ✦'+(dups?(' ('+dups+' 条已存在)'):''));
  else if(dups)toast('没有新记录，'+dups+' 条已存在');
  else if(looksJson)toast('内容格式不对，请重新复制一次');
  else toast('没有可导入的内容');
};

/* ================= 旧数据迁移 ================= */
function migrateOldData(){
  try{
  var NL=String.fromCharCode(10);
    var raw=localStorage.getItem('sleepy_space_memory');
    var old={};
    if(raw){try{old=JSON.parse(raw)||{};}catch(e){old={};}}
    const db=dbLoad();
    let added=0;
    const ensure=(obj)=>{
      // 去重：①同 source+sig ②同标题+同内容（与导入/自动同步的记录也去重）
      if(!obj.sig)return false;
      if(db.items.some(i=>i.source===obj.source&&i.sig===obj.sig))return false;
      var _h=noteHash(obj.title,obj.data&&obj.data.note);
      if(db.items.some(i=>noteHash(i.title,i.data&&i.data.note)===_h))return false;
      db.items.unshift(obj);added++;return true;
    };
    /* 用户信息 */
    if(old.user){
      const u=old.user,p=[];
      if(u.name)p.push('名字：'+u.name);
      if(u.gender)p.push('性别：'+u.gender);
      if(u.birthday)p.push('生日：'+u.birthday);
      if(u.zodiac)p.push('星座：'+u.zodiac);
      if(p.length)ensure({type:'traits',title:'◈ 个人档案',data:{note:p.join('；')},createdAt:u.createdAt||Date.now(),source:'personal',sig:'personal'});
      if(u.birthday&&!db.items.some(i=>i.source==='birthday'))
        ensure({type:'birthday',title:'🎂 生日',data:{note:String(u.birthday)},createdAt:u.createdAt||Date.now(),source:'birthday',sig:'birthday'});
    }
    /* 观星 / 配对 / 合盘 历史键 */
    try{
      const ah=JSON.parse(localStorage.getItem('astro_hist_v1')||'[]');
      if(Array.isArray(ah))ah.forEach(r=>ensure({type:'story',title:r.title||('✦ 观星 · '+(r.sign||'')),data:{note:(r.date?'日期：'+r.date+NL:'')+(r.result||'')},createdAt:Date.now(),source:'horoscope',sig:'ah|'+(r.date||'')+'|'+(r.sign||'')}));
    }catch(e){}
    try{
      const ph=JSON.parse(localStorage.getItem('pair_hist_v1')||'[]');
      if(Array.isArray(ph))ph.forEach(r=>ensure({type:'story',title:r.title||('⌘ 配对 · '+(r.a||'')+' × '+(r.b||'')),data:{note:(r.date?'日期：'+r.date+NL:'')+(r.score?'契合度：'+r.score+NL:'')+(r.result||'')},createdAt:Date.now(),source:'pair',sig:'ph|'+(r.date||'')+'|'+(r.a||'')+'|'+(r.b||'')}));
    }catch(e){}
    try{
      const sh=JSON.parse(localStorage.getItem('syn_hist_v1')||'[]');
      if(Array.isArray(sh))sh.forEach(r=>ensure({type:'story',title:r.title||('∞ 合盘 · '+(r.a||'')+' × '+(r.b||'')),data:{note:(r.rel?'关系：'+r.rel+NL:'')+(r.result||'')},createdAt:Date.now(),source:'synastry',sig:'sh|'+(r.date||'')+'|'+(r.a||'')+'|'+(r.b||'')+'|'+(r.rel||'')}));
    }catch(e){}
    /* 问卦（易经六爻 yijing_hist_v1） */
    try{
      const yh=JSON.parse(localStorage.getItem('yijing_hist_v1')||'[]');
      if(Array.isArray(yh))yh.forEach(r=>{
        var _b=r.benName||'',_bi=r.bianName||'';
        var _t='☯ 问卦 · '+_b+((_bi&&_bi!==_b)?(' → '+_bi):'');
        var _n='问题：'+(r.question||'无')+NL+'本卦：'+_b+(r.benDetail?('（'+r.benDetail+'）'):'');
        if(r.moving&&r.moving.length)_n+=NL+'动爻：'+r.moving.join('、')+(r.movingText?('　'+r.movingText):'');
        if(_bi&&_bi!==_b)_n+=NL+'变卦：'+_bi+(r.bianDetail?('（'+r.bianDetail+'）'):'');
        _n+=NL+'解读：'+(r.result||'');
        ensure({type:'yijing',title:_t,data:{title:_t,note:_n},createdAt:Date.now(),source:'yijing',sig:'yh|'+(r.id||(r.date+r.time))});
      });
    }catch(e){}
    /* 塔罗（旧版独立存储 tarot_hist_v1） */
    try{
      const th=JSON.parse(localStorage.getItem('tarot_hist_v1')||'[]');
      if(Array.isArray(th))th.forEach(r=>ensure({type:'story',title:'☽ 塔罗 · '+((r.q||'').replace(/\s+/g,' ').slice(0,12)||r.spread||'占卜'),data:{note:'时间：'+(r.time||'')+'\n问题：'+(r.q||'无')+'\n牌面：'+(r.cards||'')+'\n解读：'+(r.text||'')},createdAt:Date.now(),source:'tarot',sig:'taroth|'+(r.time||'')+'|'+(r.q||'')}));
    }catch(e){}
    /* 塔罗（memory.js 里的，若有） */
    (old.tarot||[]).forEach(r=>ensure({type:'story',title:'☽ 塔罗 · '+(r.spread||'占卜'),data:{note:'问题：'+(r.question||'无')+'\n牌面：'+(Array.isArray(r.cards)?r.cards.join(' / '):(r.cards||''))+'\n解读：'+(r.result||'')},createdAt:Date.now(),source:'tarot',sig:'tarot|'+(r.id||r.date+r.time)}));
    /* 星座运势 */
    (old.horoscope||[]).forEach(r=>ensure({type:'story',title:'✦ 观星 · '+(r.sign||''),data:{note:(r.date||'')+'\n'+(r.result||'')},createdAt:Date.now(),source:'horoscope',sig:'horoscope|'+(r.id||r.date)}));
    /* 配对 */
    (old.pair||[]).forEach(r=>ensure({type:'story',title:'⌘ 配对 · '+(r.a||'')+' × '+(r.b||''),data:{note:'契合度：'+(r.score||'?')+'\n'+(r.result||'')},createdAt:Date.now(),source:'pair',sig:'pair|'+(r.id||r.date)}));
    /* 合盘 */
    (old.synastry||[]).forEach(r=>ensure({type:'story',title:'∞ 合盘 · '+(r.a||'')+' × '+(r.b||''),data:{note:(r.rel?'关系：'+r.rel+'\n':'')+(r.result||'')},createdAt:Date.now(),source:'synastry',sig:'synastry|'+(r.id||r.date)}));
    if(added)dbSave(db);
    return added;
  }catch(e){console.warn('迁移失败',e);return 0;}
}

/* ================= 启动 ================= */
const migrated=migrateOldData();
buildNodes();
if(migrated)setTimeout(()=>toast('已点亮 '+migrated+' 颗旧记忆的星 ✦'),600);
</script>
