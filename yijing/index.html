<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>问卦 · 有点困</title>
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&display=swap">
<style>
:root{
  --gold:#f0cf82;--gold-rgb:240,207,130;--gold-dim:#a9956a;
  --ivory:#f2ede0;--muted:#b5abd8;--purple:#c9b0e8;--purple-rgb:201,176,232;
  --glass-rgb:255,255,255;
}
/* ===== 昼夜主题（跟随时间） ===== */
body[data-phase="day"]{
  --gold:#8a6a2e;--gold-rgb:138,106,46;--gold-dim:#9c8a68;
  --ivory:#2c2a36;--muted:#6b6480;--purple:#7a5a9a;--purple-rgb:122,90,154;
  --glass-rgb:70,58,44;
}
body[data-phase="dusk"]{
  --gold:#a85f2c;--gold-rgb:168,95,44;--gold-dim:#a08560;
  --ivory:#38282a;--muted:#8a7068;--purple:#8a5a72;--purple-rgb:138,90,114;
  --glass-rgb:80,50,38;
}
body[data-phase="day"],body[data-phase="dusk"]{background:#efe8d8}
body[data-phase="day"] .hbtn,body[data-phase="dusk"] .hbtn{color:var(--ivory)}
body[data-phase="day"] #toast,body[data-phase="dusk"] #toast{color:var(--gold)}
body[data-phase="day"] .reading,body[data-phase="dusk"] .reading,
body[data-phase="day"] .txtBox,body[data-phase="dusk"] .txtBox{color:var(--ivory)}
body[data-phase="day"] .mbtn,body[data-phase="dusk"] .mbtn{color:rgba(var(--glass-rgb),.72)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#05030f}
body{font-family:"Ma Shan Zheng","Xingkai SC","STXingkai","Kaiti SC","STKaiti","KaiTi","楷体",serif;color:var(--ivory);overflow-x:hidden;user-select:none}
canvas#stars{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;align-items:center;
  padding:calc(20px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));gap:16px}
.head{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between}
.head .kick{font-size:.62rem;letter-spacing:.4em;text-indent:.4em;color:var(--gold-dim)}
.head h1{font-size:1.35rem;letter-spacing:.28em;text-indent:.28em;color:var(--gold);font-weight:600;
  text-shadow:0 0 22px rgba(var(--gold-rgb),.35)}
.hbtn{background:linear-gradient(155deg,rgba(var(--glass-rgb),.14),rgba(var(--glass-rgb),.04));
  backdrop-filter:blur(18px);border:1px solid rgba(var(--glass-rgb),.22);color:var(--ivory);border-radius:999px;
  padding:8px 16px;font-size:.74rem;letter-spacing:.1em;cursor:pointer;font-family:inherit;transition:.25s;white-space:nowrap}
.hbtn:active{transform:scale(.94)}
.sub{font-size:.72rem;color:var(--muted);letter-spacing:.12em;text-align:center;line-height:1.9}
.qwrap{width:100%;max-width:520px}
.qwrap label{display:block;font-size:.64rem;color:rgba(var(--gold-rgb),.55);letter-spacing:.14em;margin-bottom:7px}
.qwrap textarea{width:100%;min-height:76px;resize:vertical;background:rgba(var(--glass-rgb),.045);
  border:1px solid rgba(var(--gold-rgb),.16);border-radius:12px;padding:11px 13px;color:var(--ivory);
  font-family:inherit;font-size:.9rem;outline:none;user-select:text;line-height:1.7}
.qwrap textarea:focus{border-color:rgba(var(--gold-rgb),.45);background:rgba(var(--gold-rgb),.04)}

.castBtn{width:100%;max-width:520px;padding:15px;border-radius:14px;border:1px solid rgba(var(--gold-rgb),.42);
  background:linear-gradient(135deg,rgba(var(--gold-rgb),.22),rgba(var(--gold-rgb),.05));color:var(--gold);
  font-family:inherit;font-size:.95rem;letter-spacing:.3em;text-indent:.3em;cursor:pointer;
  box-shadow:0 0 26px rgba(var(--gold-rgb),.18);transition:.25s}
.castBtn:active{transform:scale(.97)}
.castBtn:disabled{opacity:.45}

/* ===== 卦象区 ===== */
.result{width:100%;max-width:520px;display:none;flex-direction:column;gap:14px}
.result.show{display:flex}
.guaRow{display:flex;gap:12px;justify-content:center}
.guaBox{flex:1;max-width:230px;background:rgba(var(--glass-rgb),.028);border:1px solid rgba(var(--gold-rgb),.14);
  border-radius:16px;padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.guaBox .g-tag{font-size:.58rem;letter-spacing:.24em;color:rgba(var(--gold-rgb),.5)}
.guaBox .g-name{font-size:1.05rem;letter-spacing:.14em;color:var(--gold);text-shadow:0 0 14px rgba(var(--gold-rgb),.3)}
.guaBox .g-tri{font-size:.6rem;color:var(--muted);letter-spacing:.06em}
.hex{display:flex;flex-direction:column;gap:7px;margin-top:4px;width:78px}
.yao-row{display:flex;align-items:center;justify-content:center;gap:9px;height:11px;position:relative}
.yao-row .bar{display:block;height:9px;border-radius:2px;background:linear-gradient(90deg,rgba(var(--gold-rgb),.85),rgba(var(--gold-rgb),.6));
  box-shadow:0 0 8px rgba(var(--gold-rgb),.3);flex:1}
.yao-row.yin .bar{flex:0 0 40%}
.yao-row.moving .bar{background:linear-gradient(90deg,rgba(var(--purple-rgb),.95),rgba(var(--purple-rgb),.65));
  box-shadow:0 0 12px rgba(var(--purple-rgb),.5)}
.yao-row .chg{position:absolute;right:-16px;font-size:.6rem;color:var(--purple)}
.hex.casting .yao-row .bar{animation:castPulse .5s ease-in-out infinite alternate}
@keyframes castPulse{from{opacity:.3}to{opacity:1}}

.txtBox{width:100%;background:rgba(var(--glass-rgb),.028);border:1px solid rgba(var(--gold-rgb),.12);
  border-radius:14px;padding:13px 15px;font-size:.82rem;line-height:1.95;color:rgba(242,237,224,.88)}
.txtBox .k{color:var(--gold);letter-spacing:.1em}
.txtBox .mv{color:var(--purple)}

.aiBtn{width:100%;padding:13px;border-radius:13px;border:1px solid rgba(var(--gold-rgb),.35);
  background:rgba(var(--glass-rgb),.05);color:var(--gold);font-family:inherit;font-size:.85rem;
  letter-spacing:.2em;cursor:pointer;transition:.25s}
.aiBtn:active{transform:scale(.97)}
.aiBtn:disabled{opacity:.5}

.reading{width:100%;background:rgba(var(--glass-rgb),.03);border:1px solid rgba(var(--gold-rgb),.12);
  border-radius:14px;padding:16px 17px;font-size:.85rem;line-height:1.98;color:rgba(242,237,224,.9);
  user-select:text;display:none}
.reading.show{display:block}
.reading h3{font-size:.88rem;color:var(--gold);letter-spacing:.1em;margin:18px 0 8px;padding-left:10px;
  border-left:2px solid rgba(var(--gold-rgb),.5);font-weight:400}
.reading h3:first-child{margin-top:0}
.reading li{list-style:none;margin:0 0 6px 16px;position:relative}
.reading li:before{content:'·';position:absolute;left:-12px;color:rgba(var(--gold-rgb),.6)}
.reading p{margin-bottom:8px}
.reading strong{color:var(--gold)}

/* ===== 遮罩 / 弹窗 ===== */
.mask{position:fixed;inset:0;z-index:40;background:rgba(3,2,10,.68);backdrop-filter:blur(4px);
  display:none;align-items:flex-end;justify-content:center}
.mask.open{display:flex}
.sheet{width:100%;max-width:560px;max-height:80vh;overflow-y:auto;background:linear-gradient(to top,rgba(8,5,20,.99),rgba(8,5,20,.94));
  border-top:1px solid rgba(var(--gold-rgb),.2);border-radius:24px 24px 0 0;padding:18px 18px calc(26px + env(safe-area-inset-bottom));
  animation:up .3s cubic-bezier(.4,0,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-h .t{font-size:.85rem;color:var(--gold);letter-spacing:.22em}
.sheet-h .x{width:32px;height:32px;border-radius:50%;border:1px solid rgba(var(--gold-rgb),.2);
  background:transparent;color:rgba(242,237,224,.7);font-size:.95rem;cursor:pointer}
.hist-item{padding:11px 12px;border-radius:11px;background:rgba(var(--glass-rgb),.03);
  border:1px solid rgba(var(--gold-rgb),.1);margin-bottom:9px;font-size:.78rem;line-height:1.7}
.hist-item .hi-t{color:var(--gold);letter-spacing:.04em}
.hist-item .hi-d{font-size:.6rem;color:rgba(var(--gold-rgb),.4);margin-top:3px}
.hist-item .hi-p{color:rgba(242,237,224,.7);margin-top:5px;max-height:2.8em;overflow:hidden}
.hist-empty{text-align:center;color:rgba(var(--gold-rgb),.4);font-size:.75rem;padding:30px 0;letter-spacing:.1em}
.sheet-foot{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-family:inherit;font-size:.82rem;letter-spacing:.12em;cursor:pointer}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,rgba(var(--gold-rgb),.3),rgba(200,155,60,.15));color:var(--gold);border:1px solid rgba(var(--gold-rgb),.35)}
.btn-ghost{background:rgba(var(--glass-rgb),.04);color:rgba(var(--gold-rgb),.55);border:1px solid rgba(var(--gold-rgb),.15)}
.btn-danger{background:rgba(255,80,80,.08);color:rgba(255,110,110,.7);border:1px solid rgba(255,80,80,.18)}

#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-12px);padding:9px 22px;
  border-radius:999px;background:rgba(12,9,32,.94);border:1px solid rgba(var(--gold-rgb),.3);color:var(--gold);
  font-size:.74rem;letter-spacing:.08em;opacity:0;transition:all .28s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#loading{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  background:rgba(3,2,10,.78);backdrop-filter:blur(4px)}
#loading.show{display:flex}
#loading .orb{width:52px;height:52px;border-radius:50%;border:2px solid rgba(var(--gold-rgb),.25);
  border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:.76rem;color:rgba(var(--gold-rgb),.7);letter-spacing:.14em}

/* ===== 古风底纹：宣纸颗粒 + 四角暗晕 ===== */
body::before{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,240,200,.035) 1px,transparent 1px);
  background-size:3px 3px}
body::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 46%,rgba(2,2,8,.62) 100%)}
body[data-phase="day"]::after,body[data-phase="dusk"]::after{
  background:radial-gradient(ellipse at 50% 42%,transparent 54%,rgba(96,74,48,.3) 100%)}

/* ===== 起卦方式 ===== */
.methods{width:100%;max-width:520px;display:flex;gap:7px}
.mbtn{flex:1;padding:9px 3px;border-radius:12px;border:1px solid rgba(var(--gold-rgb),.16);
  background:rgba(var(--glass-rgb),.03);color:rgba(242,237,224,.6);font-family:inherit;font-size:.7rem;
  letter-spacing:.08em;cursor:pointer;transition:.25s;display:flex;flex-direction:column;align-items:center;gap:3px}
.mbtn .mi{font-size:1.05rem;line-height:1;filter:grayscale(.3)}
.mbtn.on{border-color:rgba(var(--gold-rgb),.62);color:var(--gold);
  background:linear-gradient(135deg,rgba(var(--gold-rgb),.2),rgba(var(--gold-rgb),.04));
  box-shadow:0 0 16px rgba(var(--gold-rgb),.16)}
.mbtn:active{transform:scale(.94)}
.mdesc{width:100%;max-width:520px;font-size:.66rem;color:var(--muted);letter-spacing:.06em;
  text-align:center;line-height:1.75;min-height:2.4em;padding:0 8px}
.numRow{width:100%;max-width:520px;display:none;gap:12px}
.numRow.show{display:flex}
.numRow input{flex:1;min-width:0;background:rgba(var(--glass-rgb),.045);border:1px solid rgba(var(--gold-rgb),.16);
  border-radius:12px;padding:12px 8px;color:var(--ivory);font-family:inherit;font-size:1rem;
  text-align:center;outline:none;user-select:text;letter-spacing:.16em}
.numRow input:focus{border-color:rgba(var(--gold-rgb),.45);background:rgba(var(--gold-rgb),.04)}

/* ===== 液态玻璃（高透明度 · 强模糊 · 玻璃边缘高光） ===== */
.guaBox,.txtBox,.reading,.qwrap textarea,.numRow input,.hbtn,.mbtn{
  background:linear-gradient(150deg,rgba(var(--glass-rgb),.16),rgba(var(--glass-rgb),.05));
  border-color:rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(28px) saturate(190%);
  backdrop-filter:blur(28px) saturate(190%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.36),
             inset 0 -1px 0 rgba(255,255,255,.06),
             0 10px 30px rgba(0,0,0,.14);
}
.castBtn,.aiBtn{
  background:linear-gradient(150deg,rgba(var(--gold-rgb),.28),rgba(var(--gold-rgb),.06));
  border-color:rgba(var(--gold-rgb),.45);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),
             inset 0 -1px 0 rgba(var(--gold-rgb),.12),
             0 8px 26px rgba(0,0,0,.16),
             0 0 24px rgba(var(--gold-rgb),.16);
}
.mbtn.on{
  background:linear-gradient(150deg,rgba(var(--gold-rgb),.3),rgba(var(--gold-rgb),.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.36),0 0 18px rgba(var(--gold-rgb),.2);
}
.sheet{
  background:linear-gradient(to top,rgba(8,5,20,.82),rgba(8,5,20,.68));
  -webkit-backdrop-filter:blur(32px) saturate(170%);
  backdrop-filter:blur(32px) saturate(170%);
  border-top-color:rgba(255,255,255,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="wrap">
  <div class="head">
    <div>
      <div class="kick">I CHING</div>
      <h1>问 卦</h1>
    </div>
    <div style="display:flex;gap:8px">
      <button class="hbtn" id="btnHist">📜 记录</button>
      <button class="hbtn" id="btnBack">◂ 返回</button>
    </div>
  </div>

  <div class="sub">诚心默念所问之事 · 择一起卦之法<br>周易六十四卦 · 动爻变卦 · AI 解卦</div>

  <div class="qwrap">
    <label>所问何事（可留空）</label>
    <textarea id="question" placeholder="如：这段感情还有可能吗 / 这份工作要不要接…"></textarea>
  </div>

  <div class="methods" id="methods">
    <button class="mbtn on" data-m="coin"><span class="mi">🪙</span>铜钱</button>
    <button class="mbtn" data-m="time"><span class="mi">🕰</span>时间</button>
    <button class="mbtn" data-m="num"><span class="mi">🔢</span>数字</button>
    <button class="mbtn" data-m="yarrow"><span class="mi">🌾</span>蓍草</button>
    <button class="mbtn" data-m="heart"><span class="mi">♡</span>心动</button>
  </div>
  <div class="mdesc" id="mdesc">三枚铜钱掷六次 · 老阳老阴为动爻</div>
  <div class="numRow" id="numRow">
    <input id="num1" type="tel" inputmode="numeric" placeholder="上卦数" maxlength="8">
    <input id="num2" type="tel" inputmode="numeric" placeholder="下卦数" maxlength="8">
  </div>

  <button class="castBtn" id="btnCast">摇 卦</button>

  <div class="result" id="result">
    <div class="guaRow">
      <div class="guaBox">
        <div class="g-tag">本 卦</div>
        <div class="g-name" id="benName">—</div>
        <div class="g-tri" id="benTri"></div>
        <div class="hex" id="benHex"></div>
      </div>
      <div class="guaBox">
        <div class="g-tag">变 卦</div>
        <div class="g-name" id="bianName">—</div>
        <div class="g-tri" id="bianTri"></div>
        <div class="hex" id="bianHex"></div>
      </div>
    </div>

    <div class="txtBox" id="guaText"></div>

    <button class="aiBtn" id="btnAI">✦ 请 AI 解卦</button>
    <div class="reading" id="reading"></div>
  </div>
</div>

<!-- 历史记录 -->
<div class="mask" id="histMask">
  <div class="sheet">
    <div class="sheet-h">
      <div class="t">📜 问卦记录</div>
      <button class="x" id="histClose">✕</button>
    </div>
    <div id="histList"></div>
    <div class="sheet-foot">
      <button class="btn btn-danger" id="histClear" style="flex:0 0 84px">清空</button>
      <button class="btn btn-ghost" id="histCopy" style="flex:0 0 100px">☁️ 复制</button>
      <button class="btn btn-primary" id="histCopyMem">☁️ 复制到记忆库</button>
    </div>
  </div>
</div>

<div id="loading"><div class="orb"></div><p>凝神静气，卦象渐显……</p></div>
<div id="toast"></div>

<script src="../memory.js"></script>
<script>
'use strict';
const API_BASE='https://apihub.agnes-ai.cn/v1';
const API_KEY='sk-bnT8gvJweewxMFO2oOnzNof2qpqazpKYq1spx5EulZ11vfyZ';
const MODEL='agnes-2.5-flash';
const HKEY='yijing_hist_v1';

/* 先天八卦：0坤 1震 2坎 3兑 4艮 5离 6巽 7乾 */
const TRIGRAM=['坤','震','坎','兑','艮','离','巽','乾'];
const TRISYM=['☷','☳','☵','☱','☶','☲','☴','☰'];
const YAO_POS=['初','二','三','四','五','上'];

let GUA=null, cur=null;

/* ================= 国画雪梅背景（昼夜跟随时间） ================= */
const cv=document.getElementById('stars'),ctx=cv.getContext('2d');
let snow=[],mist=[],W,H,PHASE='night',branchSegs=[],plumBlossoms=[];

const PHASES={
  night:{
    sky:['#0b0a1a','#101126','#05040d'],
    ink:['rgba(26,30,52,.82)','rgba(15,18,36,.9)','rgba(6,8,18,.97)'],
    orb:{x:.76,y:.19,r:.082,c:'rgba(246,238,212,.92)',glow:'rgba(240,228,185,.32)',glowR:3.4},
    snow:'rgba(255,255,255,.9)',branch:'rgba(22,18,32,.92)',
    plum:['#f0c2d2','#e6a4bb','#f6dbe4'],
    mistRgb:'198,208,230',mistA:.055
  },
  day:{
    sky:['#f8f3e8','#efe7d6','#e5dac2'],
    ink:['rgba(150,158,175,.28)','rgba(118,126,148,.36)','rgba(86,94,116,.48)'],
    orb:{x:.74,y:.2,r:.07,c:'rgba(255,250,238,.95)',glow:'rgba(255,236,188,.55)',glowR:3.8},
    snow:'rgba(158,174,200,.72)',branch:'rgba(72,52,50,.82)',
    plum:['#c0556b','#ad3f57','#d9788c'],
    mistRgb:'255,255,255',mistA:.45
  },
  dusk:{
    sky:['#f5ddc5','#e7ba96','#d0916d'],
    ink:['rgba(152,112,116,.32)','rgba(116,78,92,.4)','rgba(78,52,68,.52)'],
    orb:{x:.72,y:.62,r:.075,c:'rgba(255,238,205,.92)',glow:'rgba(255,188,128,.5)',glowR:4.2},
    snow:'rgba(255,246,236,.85)',branch:'rgba(56,36,40,.86)',
    plum:['#b34a5e','#a33d50','#cf6f80'],
    mistRgb:'255,230,210',mistA:.32
  }
};

function currentPhase(){const h=new Date().getHours();if(h>=6&&h<16)return 'day';if(h>=16&&h<19)return 'dusk';return 'night';}
function applyPhase(){const p=currentPhase();if(p!==PHASE){PHASE=p;document.body.dataset.phase=p;}}
PHASE=currentPhase();
if(document.body)document.body.dataset.phase=PHASE;
setInterval(applyPhase,60000);

function resizeStars(){W=cv.width=innerWidth;H=cv.height=innerHeight;
  /* 落雪 */
  snow=[];const n=Math.max(46,Math.floor(W/5));
  for(let i=0;i<n;i++)snow.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.1+.7,
    vy:Math.random()*.6+.32,vx:(Math.random()-.5)*.42,a:Math.random()*.55+.35,ph:Math.random()*7});
  /* 流雾 */
  mist=[];for(let i=0;i<4;i++)mist.push({x:Math.random()*W,y:(.38+Math.random()*.46)*H,
    w:W*(.55+Math.random()*.7),h:H*(.05+Math.random()*.06),
    v:Math.random()*.1+.03,ph:Math.random()*7});
  buildPlum();
}

/* ---- 梅枝：一次性生成，随屏幕缩放 ---- */
function buildPlum(){
  branchSegs=[];plumBlossoms=[];
  const S=Math.min(W,H);
  /* 主枝：右下角向左上蜿蜒 */
  let pts=[[W*1.03,H*1.02]],x=W*1.03,y=H*1.02,ang=Math.PI*1.16;
  for(let i=0;i<9;i++){
    const len=S*.088*(1-i*.06);
    ang+=(Math.random()-.5)*.5;
    x+=Math.cos(ang)*len;y+=Math.sin(ang)*len;
    pts.push([x,y]);
  }
  branchSegs.push({pts,w:S*.011});
  /* 侧枝 + 枝头梅花 */
  for(let k=2;k<pts.length-1;k++){
    if(Math.random()<.8){
      let[bx,by]=pts[k];
      let bAng=Math.atan2(by-pts[k-1][1],bx-pts[k-1][0])+(Math.random()<.5?.75:-.75);
      let bp=[[bx,by]],cx=bx,cy=by;
      const seg=2+Math.floor(Math.random()*2);
      for(let j=0;j<seg;j++){
        const len=S*.05*(1-j*.22);
        bAng+=(Math.random()-.5)*.6;
        cx+=Math.cos(bAng)*len;cy+=Math.sin(bAng)*len;
        bp.push([cx,cy]);
      }
      branchSegs.push({pts:bp,w:S*.0048});
      plumBlossoms.push({x:cx,y:cy,r:S*.012+Math.random()*2.5,ang:Math.random()*7,
        ph:Math.random()*7});
    }
  }
  const[ex,ey]=pts[pts.length-1];
  plumBlossoms.push({x:ex,y:ey,r:S*.015,ang:Math.random()*7,ph:Math.random()*7});
}

function drawMountain(baseY,peakY,color,seed){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,baseY);
  const step=W/7;
  for(let i=0;i<=7;i++){
    const x=i*step;
    const h=peakY+(Math.sin(i*1.7+seed*3)*.16+Math.cos(i*.9+seed)*.12)*H*.16;
    if(i===0)ctx.lineTo(x,h);
    else{const px=(i-1)*step;const py=peakY+(Math.sin((i-1)*1.7+seed*3)*.16+Math.cos((i-1)*.9+seed)*.12)*H*.16;
      ctx.quadraticCurveTo((px+x)/2,(py+h)/2-H*.03,x,h);}
  }
  ctx.lineTo(W,baseY);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
}

function drawBlossom(b,colors,t){
  const sway=Math.sin(t/1600+b.ph)*.05;
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.ang+sway);
  for(let i=0;i<5;i++){
    ctx.rotate(Math.PI*2/5);
    ctx.fillStyle=colors[i%colors.length];
    ctx.beginPath();ctx.ellipse(0,-b.r*.72,b.r*.55,b.r*.86,0,0,7);ctx.fill();
  }
  ctx.fillStyle='rgba(244,214,150,.9)';
  ctx.beginPath();ctx.arc(0,0,b.r*.28,0,7);ctx.fill();
  ctx.restore();
}

function drawBranch(P){
  ctx.strokeStyle=P.branch;ctx.lineCap='round';ctx.lineJoin='round';
  for(const s of branchSegs){
    ctx.lineWidth=s.w;ctx.beginPath();
    ctx.moveTo(s.pts[0][0],s.pts[0][1]);
    for(let i=1;i<s.pts.length;i++){
      const[x0,y0]=s.pts[i-1],[x1,y1]=s.pts[i];
      ctx.quadraticCurveTo(x0,y0,(x0+x1)/2,(y0+y1)/2);
    }
    const last=s.pts[s.pts.length-1];
    ctx.lineTo(last[0],last[1]);ctx.stroke();
  }
}

function drawScene(t){
  const P=PHASES[PHASE];
  /* 天幕 */
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,P.sky[0]);g.addColorStop(.5,P.sky[1]);g.addColorStop(1,P.sky[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  /* 日月 */
  const o=P.orb,ox=o.x*W,oy=o.y*H,or=Math.min(W,H)*o.r;
  const og=ctx.createRadialGradient(ox,oy,0,ox,oy,or*o.glowR);
  og.addColorStop(0,o.glow);og.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=og;ctx.beginPath();ctx.arc(ox,oy,or*o.glowR,0,7);ctx.fill();
  ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(ox,oy,or,0,7);ctx.fill();
  if(PHASE==='night'){ /* 月海 */
    ctx.fillStyle='rgba(198,188,150,.2)';
    ctx.beginPath();ctx.arc(ox-or*.32,oy-or*.22,or*.17,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(ox+or*.34,oy+or*.16,or*.11,0,7);ctx.fill();
  }
  /* 淡墨远山 */
  drawMountain(H*.58,H*.50,P.ink[0],1);
  drawMountain(H*.72,H*.43,P.ink[1],2);
  drawMountain(H*.87,H*.36,P.ink[2],3);
  /* 流雾 */
  mist.forEach(m=>{m.x-=m.v;if(m.x<-m.w)m.x=W+m.w;
    const cg=ctx.createRadialGradient(m.x+m.w/2,m.y,0,m.x+m.w/2,m.y,m.w/2);
    cg.addColorStop(0,'rgba('+P.mistRgb+','+P.mistA+')');
    cg.addColorStop(1,'rgba('+P.mistRgb+',0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(m.x+m.w/2,m.y,m.w/2,m.h,0,0,7);ctx.fill();});
  /* 梅枝与梅花 */
  drawBranch(P);
  plumBlossoms.forEach(b=>drawBlossom(b,P.plum,t));
  /* 落雪 */
  const wind=Math.sin(t/4200)*.55;
  snow.forEach(s=>{
    s.y+=s.vy;s.x+=s.vx+wind+Math.sin(t/1800+s.ph)*.35;
    if(s.y>H+6){s.y=-6;s.x=Math.random()*W;}
    if(s.x<-6)s.x=W+6;if(s.x>W+6)s.x=-6;
    ctx.globalAlpha=s.a;ctx.fillStyle=P.snow;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
  });
  ctx.globalAlpha=1;
  requestAnimationFrame(drawScene);
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}

/* ================= 起卦 ================= */
function toss(){let s=0;for(let i=0;i<3;i++)s+=(Math.random()<.5?2:3);return s;} /* 6/7/8/9 */
function castSix(){const a=[];for(let i=0;i<6;i++)a.push(toss());return a;}
function findGua(xiang){return GUA.gua.find(g=>g['gua-xiang']===xiang)||null;}
function triIdx(bits){return bits[0]+bits[1]*2+bits[2]*4;} /* bits: 自下而上 */
function yaoLabel(v,i){
  const num=(v===7||v===9)?'九':'六';
  if(i===0)return '初'+num;
  if(i===5)return '上'+num;
  return num+YAO_POS[i];
}
function computeFromLines(lines){
  const ben=lines.map(v=>(v===7||v===9)?1:0);
  const bian=lines.map(v=>{if(v===6)return 1;if(v===9)return 0;return v===7?1:0;});
  const moving=[];
  lines.forEach((v,i)=>{if(v===6||v===9)moving.push(i);});
  return {ben,bian,moving};
}

/* ---- 先天八卦：数 → 自下而上阴阳 bits ---- */
const XIANTIAN_BITS={1:[1,1,1],2:[1,1,0],3:[1,0,1],4:[1,0,0],5:[0,1,1],6:[0,1,0],7:[0,0,1],8:[0,0,0]};
const XIANTIAN_NAME={1:'乾',2:'兑',3:'离',4:'震',5:'巽',6:'坎',7:'艮',8:'坤'};
const SHICHEN=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const CN_NUM={'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function cnToNum(s){
  if(s==null)return NaN;
  s=String(s).trim().replace(/[年月日]/g,'');
  if(!s)return NaN;
  if(/^\d+$/.test(s))return parseInt(s,10);
  if(s==='十')return 10;
  let n=0;
  if(s[0]==='廿'){n=20;s=s.slice(1);}
  else if(s[0]==='卅'){n=30;s=s.slice(1);}
  else if(s[0]==='初'){s=s.slice(1);}
  if(s.includes('十')){const a=s.split('十');n+=(a[0]?CN_NUM[a[0]]:1)*10+(a[1]?(CN_NUM[a[1]]||0):0);return n;}
  for(const ch of s){if(CN_NUM[ch]!=null)n+=CN_NUM[ch];}
  return n||NaN;
}
function yearZhiNum(yName){const z=String(yName||'').slice(-1);const i=SHICHEN.indexOf(z);return i>=0?i+1:0;}
function shichenNum(h){return Math.floor(((h+1)%24)/2)+1;}
function bitsToLines(bits,moving){return bits.map((b,i)=>moving.indexOf(i)>=0?(b?9:6):(b?7:8));}

/* ---- 各起卦法 ---- */
function castByCoin(){return {lines:castSix(),method:'coin',detail:'三枚铜钱掷六次 · 老阳老阴为动爻'};}

function castByTime(){
  const now=new Date();
  let yName='',mStr='',dStr='';
  try{
    const f=new Intl.DateTimeFormat('zh-u-ca-chinese',{year:'numeric',month:'long',day:'numeric'});
    for(const p of f.formatToParts(now)){
      if(p.type==='yearName')yName=p.value;
      else if(p.type==='month')mStr=p.value;
      else if(p.type==='day')dStr=p.value;
    }
  }catch(e){}
  const yz=yearZhiNum(yName)||((now.getFullYear())%12+1);
  let mo=cnToNum(mStr); if(!mo||isNaN(mo))mo=now.getMonth()+1;
  let day=cnToNum(dStr); if(!day||isNaN(day))day=now.getDate();
  const sc=shichenNum(now.getHours());
  const up=((yz+mo+day-1)%8)+1;
  const low=((yz+mo+day+sc-1)%8)+1;
  const mv=((yz+mo+day+sc-1)%6)+1;
  const bits=XIANTIAN_BITS[low].concat(XIANTIAN_BITS[up]);
  return {lines:bitsToLines(bits,[mv-1]),method:'time',
    detail:'时间起卦 · '+((yName||'')+'年')+mStr+dStr+'日 '+SHICHEN[sc-1]+'时　上'+XIANTIAN_NAME[up]+' 下'+XIANTIAN_NAME[low]+' 动'+mv+'爻'};
}

function castByNum(){
  const n1=parseInt($('num1').value,10),n2=parseInt($('num2').value,10);
  if(isNaN(n1)||isNaN(n2)){toast('请先输入两个数字');return null;}
  const up=((n1-1)%8+8)%8+1;
  const low=((n2-1)%8+8)%8+1;
  const mv=((n1+n2-1)%6+6)%6+1;
  const bits=XIANTIAN_BITS[low].concat(XIANTIAN_BITS[up]);
  return {lines:bitsToLines(bits,[mv-1]),method:'num',
    detail:'数字起卦 · '+n1+' / '+n2+'　上'+XIANTIAN_NAME[up]+' 下'+XIANTIAN_NAME[low]+' 动'+mv+'爻'};
}

/* 大衍筮法概率：老阳9=3/16 少阳7=5/16 少阴8=7/16 老阴6=1/16 */
function yarrowToss(){const r=Math.random()*16;if(r<1)return 6;if(r<4)return 9;if(r<11)return 8;return 7;}
function castByYarrow(){
  const a=[];for(let i=0;i<6;i++)a.push(yarrowToss());
  return {lines:a,method:'yarrow',detail:'大衍筮法 · 五十蓍草，其用四十有九'};
}

function castByHeart(){
  const a=[];for(let i=0;i<6;i++)a.push(toss());
  return {lines:a,method:'heart',detail:'心念起卦 · 一念既起，六爻自成'};
}

function castByMethod(m){
  switch(m){
    case 'coin':return castByCoin();
    case 'time':return castByTime();
    case 'num':return castByNum();
    case 'yarrow':return castByYarrow();
    case 'heart':return castByHeart();
    default:return castByCoin();
  }
}

/* ================= 渲染 ================= */
function hexHtml(bits,moving,casting){
  let h='<div class="hex'+(casting?' casting':'')+'">';
  for(let i=5;i>=0;i--){
    const bit=bits[i], mv=moving.indexOf(i)>=0;
    h+='<div class="yao-row '+(bit?'yang':'yin')+(mv?' moving':'')+'">';
    h+= bit ? '<i class="bar"></i>' : '<i class="bar"></i><i class="bar"></i>';
    if(mv)h+='<span class="chg">'+(bit?'○':'✕')+'</span>';
    h+='</div>';
  }
  return h+'</div>';
}
function triText(bits){ /* bits[0..2] 下卦，bits[3..5] 上卦 */
  const lo=triIdx([bits[0],bits[1],bits[2]]), hi=triIdx([bits[3],bits[4],bits[5]]);
  return TRISYM[hi]+TRIGRAM[hi]+' / '+TRISYM[lo]+TRIGRAM[lo];
}

/* ================= 主流程 ================= */
let METHOD='coin';
async function doCast(){
  const btn=$('btnCast');
  const res=castByMethod(METHOD);
  if(!res)return;
  const lines=res.lines, detail=res.detail;
  btn.disabled=true;btn.textContent='起卦中…';
  const {ben,bian,moving}=computeFromLines(lines);
  const benX=ben.join(''), bianX=bian.join('');
  const benG=findGua(benX), bianG=findGua(bianX);

  /* 逐爻揭晓动画 */
  const resultEl=$('result');resultEl.classList.add('show');
  $('benName').textContent='…';$('bianName').textContent='…';
  $('benTri').textContent='';$('bianTri').textContent='';
  const empty=[0,0,0,0,0,0];
  $('benHex').outerHTML=hexHtml(empty,[],true).replace('class="hex','id="benHex" class="hex');
  await sleep(600);

  for(let step=0;step<6;step++){
    const partial=ben.map((b,i)=>i<=step?b:0);
    $('benHex').outerHTML=hexHtml(partial,moving.filter(m=>m<=step),true).replace('class="hex','id="benHex" class="hex');
    await sleep(180);
  }
  $('benHex').outerHTML=hexHtml(ben,moving,false).replace('class="hex','id="benHex" class="hex');
  $('bianHex').outerHTML=hexHtml(bian,[],false).replace('class="hex','id="bianHex" class="hex');

  const benName=benG?benG['gua-name']:'—';
  const bianName=bianG?bianG['gua-name']:'—';
  $('benName').textContent=benName;
  $('bianName').textContent=(bianName===benName&&moving.length===0)?'（无变卦）':bianName;
  $('benTri').textContent=triText(ben);
  $('bianTri').textContent=triText(bian);

  /* 卦辞 / 动爻爻辞 */
  const movingTexts=moving.map(i=>yaoLabel(lines[i],i)+'：'+(benG&&benG['yao-detail']?benG['yao-detail'][i]:''));
  let txt='';
  txt+='<div class="mv" style="margin-bottom:9px;font-size:.74rem;opacity:.85">'+esc(detail)+'</div>';
  txt+='<div><span class="k">本卦</span>　'+esc(benName)+'　'+(benG?esc(benG['gua-detail']):'')+'</div>';
  if(movingTexts.length){
    txt+='<div style="margin-top:8px"><span class="k">动爻</span>　'+moving.map(i=>esc(yaoLabel(lines[i],i))).join('、')+'</div>';
    movingTexts.forEach(m=>{txt+='<div class="mv" style="margin-top:4px">· '+esc(m)+'</div>';});
  }else{
    txt+='<div style="margin-top:8px" class="mv">· 六爻皆静，以本卦卦辞断之</div>';
  }
  if(bianName!==benName){
    txt+='<div style="margin-top:8px"><span class="k">变卦</span>　'+esc(bianName)+'　'+(bianG?esc(bianG['gua-detail']):'')+'</div>';
  }
  $('guaText').innerHTML=txt;

  /* 组装记录并写入记忆库 */
  cur={
    id:Date.now(),
    method:METHOD, methodText:detail,
    question:($('question').value||'').trim(),
    ben:benX, benName:benName, benDetail:benG?benG['gua-detail']:'',
    bian:bianX, bianName:bianName, bianDetail:bianG?bianG['gua-detail']:'',
    moving:moving.map(i=>yaoLabel(lines[i],i)),
    movingText:movingTexts.join('　'),
    lines:lines,
    result:'',
    date:nowStr(), time:nowTime()
  };
  saveRecord();
  toast('卦已成 · 已记入记忆库 ☯');

  $('reading').classList.remove('show');
  $('reading').innerHTML='';
  btn.disabled=false;btn.textContent='再起一卦';
}

function mdToHtml(md){
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const lines=String(md||'').split('\n');
  let html='',inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false;}};
  for(let raw of lines){
    const line=raw.replace(/\s+$/,'');
    if(!line.trim()){closeList();continue;}
    let m;
    if((m=line.match(/^\s*#{1,6}\s*(.+)$/))){closeList();html+='<h3>'+inline(m[1])+'</h3>';continue;}
    if((m=line.match(/^\s*[-*•]\s+(.+)$/))){if(!inList){html+='<ul>';inList=true;}html+='<li>'+inline(m[1])+'</li>';continue;}
    closeList();html+='<p>'+inline(line)+'</p>';
  }
  closeList();return html;
}

    const name=(r.benName||'')+((r.bianName&&r.bianName!==r.benName)?(' → '+r.bianName):'');
    const p=(r.question?('问：'+r.question+'　'):'')+('本卦：'+name)+(r.moving&&r.moving.length?('　动爻：'+r.moving.join('、')):'');
    return '<div class="hist-item"><div class="hi-t">☯ '+esc(name)+'</div>'+
      '<div class="hi-d">'+esc((r.date||'')+' '+(r.time||''))+'</div>'+
      '<div class="hi-p">'+esc(p)+'</div></div>';
  }).join('');
}
function copyHist(){
  const h=loadHist();
  if(!h.length){toast('还没有记录');return null;}
  const payload={moon_import:1,records:h.map(r=>({
    type:'yijing',
    title:'☯ 问卦 · '+(r.benName||'')+((r.bianName&&r.bianName!==r.benName)?(' → '+r.bianName):''),
    note:'问题：'+(r.question||'无')+'\n本卦：'+(r.benName||'')+(r.benDetail?('（'+r.benDetail+'）'):'')
      +(r.moving&&r.moving.length?('\n动爻：'+r.moving.join('、')+(r.movingText?('　'+r.movingText):'')):'')
      +(r.bianName&&r.bianName!==r.benName?('\n变卦：'+r.bianName+(r.bianDetail?('（'+r.bianDetail+'）'):'')):'')
      +'\n解读：'+(r.result||''),
    createdAt:Date.now()
  }))};
  return JSON.stringify(payload);
}
function doCopy(){
  const txt=copyHist();
  if(!txt)return;
  const done=()=>toast('已复制 '+loadHist().length+' 条记录');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>{fallbackCopy(txt);done();});}
  else{fallbackCopy(txt);done();}
}
function fallbackCopy(txt){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}

$('histClear').onclick=async()=>{if(!confirm('清空全部问卦记录吗？'))return;localStorage.removeItem(HKEY);if(typeof window.clearCloudSnapshot==='function'){try{await window.clearCloudSnapshot([HKEY]);}catch(e){}}renderHist();toast('记录已清空');};

$('histCopyMem').onclick=()=>{doCopy();toast('已复制 · 到记忆库点 ⇩ 粘贴导入');};
