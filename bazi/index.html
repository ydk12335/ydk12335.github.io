<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>命盘 · 有点困</title>
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&display=swap">
<style>
:root{--gold:#f0cf82;--gold-rgb:240,207,130;--gold-dim:#a9956a;--ivory:#f2ede0;--muted:#b5abd8;--purple:#c9b0e8;--purple-rgb:201,176,232;--glass-rgb:255,255,255}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#05030f}
body{font-family:"Ma Shan Zheng","Xingkai SC","STXingkai","Kaiti SC","STKaiti","KaiTi","楷体",serif;color:var(--ivory);overflow-x:hidden;user-select:none}
/* ===== 昼夜主题（跟随时间，与问卦页一致） ===== */
body[data-phase="day"]{--gold:#8a6a2e;--gold-rgb:138,106,46;--gold-dim:#9c8a68;--ivory:#2c2a36;--muted:#6b6480;--purple:#7a5a9a;--purple-rgb:122,90,154;--glass-rgb:70,58,44}
body[data-phase="dusk"]{--gold:#a85f2c;--gold-rgb:168,95,44;--gold-dim:#a08560;--ivory:#38282a;--muted:#8a7068;--purple:#8a5a72;--purple-rgb:138,90,114;--glass-rgb:80,50,38}
body[data-phase="day"],body[data-phase="dusk"]{background:#efe8d8}
body[data-phase="day"] .b-label,body[data-phase="dusk"] .b-label{color:var(--muted)}
body[data-phase="day"] .b-input,body[data-phase="dusk"] .b-input,
body[data-phase="day"] .b-select,body[data-phase="dusk"] .b-select{color:var(--ivory);border-color:rgba(0,0,0,.16);background:rgba(255,255,255,.42)}
body[data-phase="day"] .b-select option,body[data-phase="dusk"] .b-select option{background:#efe8d8;color:var(--ivory)}
body[data-phase="day"] .b-gender button,body[data-phase="dusk"] .b-gender button{color:var(--muted);border-color:rgba(0,0,0,.16);background:rgba(255,255,255,.42)}
body[data-phase="day"] .b-gender button.on,body[data-phase="dusk"] .b-gender button.on{color:#14102b}
body[data-phase="day"] .b-card,body[data-phase="dusk"] .b-card{background:rgba(255,255,255,.6);border-color:rgba(0,0,0,.1);color:var(--ivory);box-shadow:0 14px 40px rgba(96,74,48,.18)}
body[data-phase="day"] .b-card table td,body[data-phase="dusk"] .b-card table td{color:var(--ivory);border-bottom-color:rgba(0,0,0,.08)}
body[data-phase="day"] .b-card table td:first-child,body[data-phase="dusk"] .b-card table td:first-child{color:var(--muted)}
body[data-phase="day"] .pan-col,body[data-phase="dusk"] .pan-col{background:rgba(255,255,255,.42);border-color:rgba(0,0,0,.14)}
body[data-phase="day"] .pan-col .pc-label,body[data-phase="dusk"] .pan-col .pc-label{color:var(--muted)}
body[data-phase="day"] .pan-col .pc-gz,body[data-phase="dusk"] .pan-col .pc-gz{color:var(--gold)}
body[data-phase="day"] .b-foot,body[data-phase="dusk"] .b-foot,body[data-phase="day"] .p-foot,body[data-phase="dusk"] .p-foot{color:var(--muted)}
body::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 46%,rgba(2,2,8,.62) 100%)}
body[data-phase="day"]::after,body[data-phase="dusk"]::after{background:radial-gradient(ellipse at 50% 42%,transparent 54%,rgba(96,74,48,.3) 100%)}
canvas#stars{position:fixed;inset:0;z-index:0}
/* ---------- 布局：与首页 portal 一致 ---------- */
.portal{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;
  justify-content:space-evenly;align-items:center;text-align:center;
  padding:clamp(56px,10vh,84px) 20px 22px}
.kicker{font-size:.68rem;letter-spacing:.42em;text-indent:.42em;color:var(--gold-dim)}
.p-title{font-size:clamp(1.7rem,6vw,2.2rem);letter-spacing:.24em;text-indent:.24em;font-weight:600;
  color:var(--gold);text-shadow:0 0 24px rgba(240,207,130,.35);margin-top:6px}
.p-sub{font-size:.78rem;color:#b5abd8;letter-spacing:.14em;margin-top:8px}
.btn-back{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:9;
  background:linear-gradient(155deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  border:1px solid rgba(255,255,255,.22);color:#f2ede0;border-radius:999px;padding:9px 22px;
  font-size:.8rem;letter-spacing:.12em;cursor:pointer;font-family:inherit;transition:.25s;
  box-shadow:0 6px 20px rgba(4,2,18,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.btn-back:active{transform:scale(.94)}
/* ---------- 输入表单 ---------- */
.b-form{width:min(560px,94vw);display:flex;flex-direction:column;gap:14px;margin-top:clamp(12px,2.6vh,24px)}
.b-field{display:flex;flex-direction:column;gap:6px;text-align:left}
.b-label{font-size:.8rem;letter-spacing:.14em;color:#cfc6ea}
.b-input,.b-select{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
  border-radius:12px;padding:12px 14px;font-family:inherit;font-size:.95rem;color:var(--ivory);
  outline:none;transition:border-color .25s;width:100%;-webkit-appearance:none;appearance:none}
.b-input:focus,.b-select:focus{border-color:rgba(240,207,130,.6)}
.b-select option{background:#14102b;color:#f2ede0}
.b-unknown{display:flex;align-items:center;gap:6px;font-size:.68rem;color:#9a90c0;letter-spacing:.05em;margin-top:4px;cursor:pointer;user-select:none}
.b-unknown input{accent-color:var(--gold);width:14px;height:14px;cursor:pointer}
.b-unknown.dim{opacity:.45}
.b-input:disabled,.b-select:disabled{opacity:.4}
.b-row{display:flex;gap:10px}
.b-row .b-field{flex:1}
.b-pickrow{display:flex;gap:8px;align-items:stretch}
.b-pickrow .b-input{flex:1}
.b-pick{flex:0 0 auto;width:46px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);color:var(--ivory);font-size:1.05rem;cursor:pointer;
  transition:border-color .25s,background .25s;display:flex;align-items:center;justify-content:center}
.b-pick:active{transform:scale(.94)}
.b-pick:hover{border-color:rgba(240,207,130,.5)}
.b-field:has(.b-pick:disabled) .b-pick{opacity:.35;pointer-events:none}
/* 性别按钮组 */
.b-gender{display:flex;gap:10px}
.b-gender button{flex:1;cursor:pointer;padding:12px 0;border-radius:12px;font-family:inherit;font-size:.95rem;
  letter-spacing:.14em;color:#cfc6ea;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
  transition:all .25s}
.b-gender button.on{color:#14102b;background:var(--gold);border-color:var(--gold);box-shadow:0 0 18px rgba(240,207,130,.4)}
/* 主按钮 */
.b-go{width:100%;cursor:pointer;padding:15px 0;border-radius:999px;border:1px solid rgba(240,207,130,.5);
  background:linear-gradient(160deg,rgba(240,207,130,.22),rgba(255,255,255,.05));color:#f6ecc9;
  font-family:inherit;font-size:1.05rem;letter-spacing:.3em;text-indent:.3em;transition:all .3s;
  box-shadow:0 8px 24px rgba(4,2,18,.4),inset 0 1px 0 rgba(255,255,255,.15)}
.b-go:active{transform:scale(.97)}
.b-go:disabled{opacity:.5;cursor:default}
/* ---------- 命盘展示 ---------- */
.b-pan{width:min(560px,94vw);text-align:left;display:none}
.b-pan.show{display:block}
.pan-title{text-align:center;color:#f2d488;letter-spacing:.3em;font-size:1.05rem;margin-bottom:14px}
.pan-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.pan-col{background:rgba(255,255,255,.04);border:1px solid rgba(240,207,130,.18);border-radius:12px;padding:10px 6px;text-align:center}
.pan-col .pc-label{font-size:.6rem;color:#9a90c0;letter-spacing:.2em}
.pan-col .pc-gz{font-size:1.15rem;color:#f2d488;margin-top:3px;letter-spacing:.08em}
.pan-col .pc-ten{font-size:.66rem;color:#b5abd8;margin-top:3px}
.pan-col .pc-wx{font-size:.6rem;color:#8f86b8}
.pan-col.hl{border-color:rgba(240,207,130,.55);background:rgba(240,207,130,.08)}
.pan-col.hl .pc-gz{color:#ffe4ab;text-shadow:0 0 10px rgba(240,207,130,.6)}
.b-card{background:rgba(255,255,255,.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:clamp(14px,3vw,22px);
  box-shadow:0 14px 40px rgba(4,2,18,.4);line-height:1.9;font-size:.9rem;color:#e6e0f4}
.b-card h3{color:var(--gold);font-size:.98rem;margin:14px 0 5px;letter-spacing:.08em}
.b-card h3:first-child{margin-top:0}
.b-card p{margin:7px 0}
.b-card strong{color:#ffe4ab;font-weight:600}
.b-card .chip{display:inline-block;margin:2px 4px 2px 0;padding:2px 10px;border-radius:999px;
  background:rgba(240,207,130,.12);border:1px solid rgba(240,207,130,.3);color:#f2d488;font-size:.78rem}
.b-card .five-bar{display:flex;align-items:center;gap:8px;margin:4px 0}
.b-card .five-bar .fb-name{flex:0 0 2em;font-size:.78rem;color:#cfc6ea}
.b-card .five-bar .fb-track{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.b-card .five-bar .fb-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#f0cf82,#e8a85c)}
.b-card .five-bar .fb-val{flex:0 0 3.5em;text-align:right;font-size:.7rem;color:#9a90c0}
.b-card table{width:100%;border-collapse:collapse;font-size:.82rem}
.b-card table td{border-bottom:1px solid rgba(255,255,255,.06);padding:6px 4px;color:#d8d0ef}
.b-card table td:first-child{color:#b5abd8;width:8em}
.b-foot{text-align:center;font-size:.66rem;color:#8f86b8;margin-top:12px;letter-spacing:.05em}
.b-loading{display:flex;align-items:center;justify-content:center;gap:12px;color:#c9c0e8;padding:30px 0}
.b-wait{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#c9c0e8;padding:34px 16px;text-align:center}
.b-wait .bw-tip{font-size:.82rem;color:#d8c9a8;letter-spacing:.05em}
.b-wait .bw-note{font-size:.72rem;color:#9a90c0;line-height:1.7;max-width:300px}
.b-wait .bw-note b{color:#f0cf82;font-weight:600}
.orb-ring{position:relative;width:20px;height:20px;flex:none}
.orb-ring::before{content:"";position:absolute;inset:0;border-radius:50%;
  border:1.5px solid rgba(240,207,130,.25);border-top-color:var(--gold);animation:orbSpin 1.1s linear infinite}
.orb-ring::after{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.5rem;color:var(--gold);animation:orbGlow 2.2s ease-in-out infinite}
@keyframes orbSpin{to{transform:rotate(360deg)}}
@keyframes orbGlow{0%,100%{opacity:.4}50%{opacity:1;text-shadow:0 0 10px rgba(240,207,130,.8)}}
.p-foot{font-size:.72rem;letter-spacing:.3em;text-indent:.3em;color:#6f66a0}
/* ---------- 分享按钮 ---------- */
.b-share{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.share-btn{flex:0 1 auto;min-width:0;opacity:.9;cursor:pointer}
.share-btn:active{transform:scale(.95)}
#shotModal{position:fixed;inset:0;z-index:50;background:rgba(3,1,14,.86);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px}
#shotModal.show{display:flex}
#shotImg{max-width:92vw;max-height:70vh;border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.6)}
.shot-tip{font-size:.75rem;color:#b5abd8;letter-spacing:.1em}
/* ---------- 分享弹窗（对齐问卦页） ---------- */
.mask{position:fixed;inset:0;z-index:99;background:rgba(3,1,14,.86);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:24px}
.mask.show{display:flex}
.sheet{width:min(560px,94vw);background:rgba(18,14,36,.92);border:1px solid rgba(240,207,130,.22);
  border-radius:20px;padding:clamp(14px,3vw,22px);box-shadow:0 18px 60px rgba(0,0,0,.5);
  font-family:inherit;color:var(--ivory)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-h .t{color:var(--gold);letter-spacing:.12em;font-size:.95rem}
.sheet-h .x{background:none;border:none;color:#b5abd8;font-size:1.1rem;cursor:pointer;font-family:inherit;padding:4px 8px}
.btn{border-radius:999px;padding:11px 24px;font-family:inherit;font-size:.85rem;letter-spacing:.08em;cursor:pointer;transition:.25s;border:1px solid transparent}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(160deg,rgba(240,207,130,.25),rgba(255,255,255,.05));border-color:rgba(240,207,130,.55);color:#f6ecc9}
.btn-ghost{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#d8d0ef}
@media(max-width:420px){.b-row{flex-direction:column}.b-row .b-field{flex:auto}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<button class="btn-back" id="btnBack">◂ 返回</button>

<div class="portal">
  <header>
    <div class="kicker">BAZI · 四柱命理</div>
    <h1 class="p-title">命 盘</h1>
    <p class="p-sub">✦ 输入生辰 · 推演八字 ✦</p>
  </header>

  <!-- 输入表单 -->
  <div class="b-form" id="bForm">
    <div class="b-row">
      <div class="b-field">
        <label class="b-label">出生日期</label>
        <div class="b-pickrow">
          <input class="b-input" id="bDate" type="text" inputmode="numeric" value="1998-08-08" placeholder="如 1998-08-08 或 1998/8/8" autocomplete="off">
          <button type="button" class="b-pick" id="btnDatePick" title="用选择器选日期">📅</button>
        </div>
      </div>
    </div>
    <div class="b-row">
      <div class="b-field">
        <label class="b-label">出生时间</label>
        <div class="b-pickrow">
          <input class="b-input" id="bTime" type="text" inputmode="numeric" value="10:00" placeholder="如 10:30 或 1030 或 10点30" autocomplete="off">
          <button type="button" class="b-pick" id="btnTimePick" title="用选择器选时间">⏰</button>
        </div>
        <label class="b-unknown"><input type="checkbox" id="bTimeUnknown"> 时间未知</label>
      </div>
      <div class="b-field">
        <label class="b-label">出生城市（真太阳时）</label>
        <select class="b-select" id="bCity"></select>
        <label class="b-unknown"><input type="checkbox" id="bCityUnknown"> 地点未知</label>
      </div>
    </div>
    <div class="b-field">
      <label class="b-label">性别</label>
      <div class="b-gender" id="bGender">
        <button data-g="男" class="on">男</button>
        <button data-g="女">女</button>
      </div>
    </div>
    <button class="b-go" id="bGo">✦ 起 盘 ✦</button>
  </div>

  <!-- 命盘展示 -->
  <section class="b-pan" id="bPan">
    <div class="pan-title" id="panTitle">命 盘</div>
    <div class="pan-grid" id="panGrid"></div>
    <div class="b-card" id="panBasic"></div>
    <div class="b-card" id="panAI" style="margin-top:12px"></div>
    <div class="b-foot">命盘由传统四柱推演 · 解读由 AI 生成 · 仅供娱乐参考</div>
    <div class="b-share" id="bShare" style="display:none">
      <button class="soon-pill share-btn b-go" id="btnShare" style="flex:0 1 auto;padding:10px 22px">📤 分享命盘</button>
      <button class="soon-pill share-btn b-go" id="btnHole" style="flex:0 1 auto;padding:10px 22px">🕳️ 去树洞聊聊</button>
    </div>
  </section>

  <!-- 八字合盘入口（独立页面，对标星座合盘） -->
  <div class="soon-bar" style="margin-top:26px">
    <a class="soon-pill pair-btn" href="hehun/" style="display:inline-flex;align-items:center;gap:8px;padding:13px 30px;font-size:.95rem;letter-spacing:.12em">
      八字合盘 · 双人推演
    </a>
  </div>

  <footer class="p-foot">‥ 有点困 ‥</footer>
</div>

<!-- 分享弹窗 -->
<div class="mask" id="shotModal" style="z-index:99;align-items:center;justify-content:center">
  <div class="sheet" style="border-radius:20px;max-height:86vh;display:flex;flex-direction:column;gap:12px;align-items:center">
    <div class="sheet-h" style="width:100%"><div class="t">📤 分享这次命盘</div><button class="x" id="shotClose">✕</button></div>
    <img id="shotImg" alt="分享图" style="max-width:92%;max-height:52vh;border-radius:12px;box-shadow:0 14px 46px rgba(0,0,0,.5)">
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="btn btn-primary" id="btnShotImg" style="flex:0 0 auto;padding:11px 24px">🖼 图片分享</button>
      <button class="btn btn-ghost" id="btnShotTxt" style="flex:0 0 auto;padding:11px 24px">📋 文字分享</button>
    </div>
    <div style="font-size:.72rem;color:rgba(var(--gold-rgb),.5);letter-spacing:.08em">也可以长按图片直接保存</div>
  </div>
</div>

<script src="bazi-engine.js"></script>
<script src="../memory.js"></script>
<script src="../ai-prompt-template.js"></script>
<script src="../treehole.js?v=11"></script>
<script src="../ai-relay.js?v=10"></script>
<script src="../agent-tools.js?v=1"></script>
<script>
'use strict';
/* ================= 基础 ================= */
const $=id=>document.getElementById(id);
const esc=t=>{const d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML;};

/* ================= 国画雪梅背景（昼夜跟随时间，与问卦页一致） ================= */
const stars=$('stars'),ctx=stars.getContext('2d');
let snow=[],mist=[],W,H,PHASE='night',branchSegs=[],plumBlossoms=[];
const PHASES={
  night:{
    sky:['#0b0a1a','#101126','#05040d'],
    ink:['rgba(26,30,52,.82)','rgba(15,18,36,.9)','rgba(6,8,18,.97)'],
    orb:{x:.76,y:.19,r:.082,c:'rgba(246,238,212,.92)',glow:'rgba(240,228,185,.32)',glowR:3.4},
    snow:'rgba(255,255,255,.9)',branch:'rgba(22,18,32,.92)',
    plum:['#f0c2d2','#e6a4bb','#f6dbe4'],
    mistRgb:'198,208,230',mistA:.055
  },
  day:{
    sky:['#f8f3e8','#efe7d6','#e5dac2'],
    ink:['rgba(150,158,175,.28)','rgba(118,126,148,.36)','rgba(86,94,116,.48)'],
    orb:{x:.74,y:.2,r:.07,c:'rgba(255,250,238,.95)',glow:'rgba(255,236,188,.55)',glowR:3.8},
    snow:'rgba(158,174,200,.72)',branch:'rgba(72,52,50,.82)',
    plum:['#c0556b','#ad3f57','#d9788c'],
    mistRgb:'255,255,255',mistA:.45
  },
  dusk:{
    sky:['#f5ddc5','#e7ba96','#d0916d'],
    ink:['rgba(152,112,116,.32)','rgba(116,78,92,.4)','rgba(78,52,68,.52)'],
    orb:{x:.72,y:.62,r:.075,c:'rgba(255,238,205,.92)',glow:'rgba(255,188,128,.5)',glowR:4.2},
    snow:'rgba(255,246,236,.85)',branch:'rgba(56,36,40,.86)',
    plum:['#b34a5e','#a33d50','#cf6f80'],
    mistRgb:'255,230,210',mistA:.32
  }
};
function currentPhase(){const h=new Date().getHours();if(h>=6&&h<16)return 'day';if(h>=16&&h<19)return 'dusk';return 'night';}
function applyPhase(){const p=currentPhase();if(p!==PHASE){PHASE=p;document.body.dataset.phase=p;}}
PHASE=currentPhase();
if(document.body)document.body.dataset.phase=PHASE;
setInterval(applyPhase,60000);
function resizeStars(){W=stars.width=innerWidth;H=stars.height=innerHeight;
  snow=[];const n=Math.max(46,Math.floor(W/5));
  for(let i=0;i<n;i++)snow.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.1+.7,
    vy:Math.random()*.6+.32,vx:(Math.random()-.5)*.42,a:Math.random()*.55+.35,ph:Math.random()*7});
  mist=[];for(let i=0;i<4;i++)mist.push({x:Math.random()*W,y:(.38+Math.random()*.46)*H,
    w:W*(.55+Math.random()*.7),h:H*(.05+Math.random()*.06),
    v:Math.random()*.1+.03,ph:Math.random()*7});
  buildPlum();
}
function buildPlum(){
  branchSegs=[];plumBlossoms=[];
  const S=Math.min(W,H);
  let pts=[[W*1.03,H*1.02]],x=W*1.03,y=H*1.02,ang=Math.PI*1.16;
  for(let i=0;i<9;i++){
    const len=S*.088*(1-i*.06);
    ang+=(Math.random()-.5)*.5;
    x+=Math.cos(ang)*len;y+=Math.sin(ang)*len;
    pts.push([x,y]);
  }
  branchSegs.push({pts,w:S*.011});
  for(let k=2;k<pts.length-1;k++){
    if(Math.random()<.8){
      let[bx,by]=pts[k];
      let bAng=Math.atan2(by-pts[k-1][1],bx-pts[k-1][0])+(Math.random()<.5?.75:-.75);
      let bp=[[bx,by]],cx=bx,cy=by;
      const seg=2+Math.floor(Math.random()*2);
      for(let j=0;j<seg;j++){
        const len=S*.05*(1-j*.22);
        bAng+=(Math.random()-.5)*.6;
        cx+=Math.cos(bAng)*len;cy+=Math.sin(bAng)*len;
        bp.push([cx,cy]);
      }
      branchSegs.push({pts:bp,w:S*.0048});
      plumBlossoms.push({x:cx,y:cy,r:S*.012+Math.random()*2.5,ang:Math.random()*7,ph:Math.random()*7});
    }
  }
  const[ex,ey]=pts[pts.length-1];
  plumBlossoms.push({x:ex,y:ey,r:S*.015,ang:Math.random()*7,ph:Math.random()*7});
}
function drawMountain(baseY,peakY,color,seed){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,baseY);
  const step=W/7;
  for(let i=0;i<=7;i++){
    const x=i*step;
    const h=peakY+(Math.sin(i*1.7+seed*3)*.16+Math.cos(i*.9+seed)*.12)*H*.16;
    if(i===0)ctx.lineTo(x,h);
    else{const px=(i-1)*step;const py=peakY+(Math.sin((i-1)*1.7+seed*3)*.16+Math.cos((i-1)*.9+seed)*.12)*H*.16;
      ctx.quadraticCurveTo((px+x)/2,(py+h)/2-H*.03,x,h);}
  }
  ctx.lineTo(W,baseY);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
}
function drawBlossom(b,colors,t){
  const sway=Math.sin(t/1600+b.ph)*.05;
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.ang+sway);
  for(let i=0;i<5;i++){
    ctx.rotate(Math.PI*2/5);
    ctx.fillStyle=colors[i%colors.length];
    ctx.beginPath();ctx.ellipse(0,-b.r*.72,b.r*.55,b.r*.86,0,0,7);ctx.fill();
  }
  ctx.fillStyle='rgba(244,214,150,.9)';
  ctx.beginPath();ctx.arc(0,0,b.r*.28,0,7);ctx.fill();
  ctx.restore();
}
function drawBranch(P){
  ctx.strokeStyle=P.branch;ctx.lineCap='round';ctx.lineJoin='round';
  for(const s of branchSegs){
    ctx.lineWidth=s.w;ctx.beginPath();
    ctx.moveTo(s.pts[0][0],s.pts[0][1]);
    for(let i=1;i<s.pts.length;i++){
      const[x0,y0]=s.pts[i-1],[x1,y1]=s.pts[i];
      ctx.quadraticCurveTo(x0,y0,(x0+x1)/2,(y0+y1)/2);
    }
    const last=s.pts[s.pts.length-1];
    ctx.lineTo(last[0],last[1]);ctx.stroke();
  }
}
function drawScene(t){
  const P=PHASES[PHASE];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,P.sky[0]);g.addColorStop(.5,P.sky[1]);g.addColorStop(1,P.sky[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const o=P.orb,ox=o.x*W,oy=o.y*H,or=Math.min(W,H)*o.r;
  const og=ctx.createRadialGradient(ox,oy,0,ox,oy,or*o.glowR);
  og.addColorStop(0,o.glow);og.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=og;ctx.beginPath();ctx.arc(ox,oy,or*o.glowR,0,7);ctx.fill();
  ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(ox,oy,or,0,7);ctx.fill();
  if(PHASE==='night'){
    ctx.fillStyle='rgba(198,188,150,.2)';
    ctx.beginPath();ctx.arc(ox-or*.32,oy-or*.22,or*.17,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(ox+or*.34,oy+or*.16,or*.11,0,7);ctx.fill();
  }
  drawMountain(H*.58,H*.50,P.ink[0],1);
  drawMountain(H*.72,H*.43,P.ink[1],2);
  drawMountain(H*.87,H*.36,P.ink[2],3);
  mist.forEach(m=>{m.x-=m.v;if(m.x<-m.w)m.x=W+m.w;
    const cg=ctx.createRadialGradient(m.x+m.w/2,m.y,0,m.x+m.w/2,m.y,m.w/2);
    cg.addColorStop(0,'rgba('+P.mistRgb+','+P.mistA+')');
    cg.addColorStop(1,'rgba('+P.mistRgb+',0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(m.x+m.w/2,m.y,m.w/2,m.h,0,0,7);ctx.fill();});
  drawBranch(P);
  plumBlossoms.forEach(b=>drawBlossom(b,P.plum,t));
  const wind=Math.sin(t/4200)*.55;
  snow.forEach(s=>{
    s.y+=s.vy;s.x+=s.vx+wind+Math.sin(t/1800+s.ph)*.35;
    if(s.y>H+6){s.y=-6;s.x=Math.random()*W;}
    if(s.x<-6)s.x=W+6;if(s.x>W+6)s.x=-6;
    ctx.globalAlpha=s.a;ctx.fillStyle=P.snow;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
  });
  ctx.globalAlpha=1;
  requestAnimationFrame(drawScene);
}

/* ---------- 出生日期/时间：自由输入解析（兼容常见写法） ---------- */
function parseDateStr(s){
  s=String(s||'').trim();
  if(!s)return null;
  /* 1) 1998-08-08 / 1998/8/8 / 1998.8.8 / 1998年8月8日 */
  let m=s.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})日?$/);
  /* 2) 19980808 八位连写 */
  if(!m)m=s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(!m)return null;
  const y=+m[1],mo=+m[2],d=+m[3];
  if(y<1895||y>2100||mo<1||mo>12||d<1)return null;
  const dim=[0,31,29,31,30,31,30,31,31,30,31,30,31];
  if(d>dim[mo])return null;
  return {y:y,m:mo,d:d};
}
function parseTimeStr(s){
  s=String(s||'').trim();
  if(!s)return null;
  /* 1) 10:30 / 10：30 / 10.30 / 10点30分 / 10时30分 */
  let m=s.match(/^(\d{1,2})[:：.点时](\d{1,2})(?:分)?$/);
  /* 2) 1030 四位数连写 → 10:30 */
  if(!m)m=s.match(/^(\d{2})(\d{2})$/);
  /* 3) 只有小时：10 / 10点 / 10时 */
  if(!m)m=s.match(/^(\d{1,2})[点时]?$/);
  if(!m)return null;
  const hh=+m[1],mm=m[2]?+m[2]:0;
  if(hh<0||hh>23||mm<0||mm>59)return null;
  return {hh:hh,mm:mm};
}

/* ---------- AI 解读（八字 + 真实经历 + 记忆库联动） ---------- */
/* 读取记忆库里的过往：塔罗/问卦/观星记录 + 用户画像 + 树洞摘要 */
function readMemContext(){
  const parts=[];
  try{
    /* 主记忆库（用户显式资料 + 树洞画像） */
    const m=JSON.parse(localStorage.getItem('sleepy_space_memory')||'{}');
    const u=m.user||{};
    if(u.name) parts.push('【称呼】'+u.name);
    if(u.birthday) parts.push('【出生日期】'+u.birthday);
    if(u.zodiac) parts.push('【星座】'+u.zodiac);
    if(u.birthplace) parts.push('【出生地】'+u.birthplace);
    if(u.occupation) parts.push('【职业】'+u.occupation);
    /* 树洞画像（第二层 · 聊天提取） */
    const tp=JSON.parse(localStorage.getItem('treehole_profile_v1')||'{}');
    if(tp.tags&&tp.tags.length) parts.push('【性格标签】'+tp.tags.join('、'));
    if(tp.state) parts.push('【当前状态】'+tp.state);
    if(tp.emotion) parts.push('【情感模式】'+tp.emotion);
    if(tp.summary) parts.push('【长期记忆摘要】'+tp.summary);
  }catch(e){}
  /* 塔罗历史：最近 3 条（问过什么、抽到什么、解读核心） */
  try{
    const tarot=JSON.parse(localStorage.getItem('tarot_hist_v1')||'[]');
    (Array.isArray(tarot)?tarot:[]).slice(0,3).forEach(r=>{
      const q=String(r.q||r.question||'').slice(0,60);
      const cards=String(r.cards||r.result||'').slice(0,120);
      if(q||cards) parts.push('【近期塔罗】'+(q?('问：「'+q+'」'):'')+(cards?' → '+cards:''));
    });
  }catch(e){}
  /* 问卦历史：最近 2 条 */
  try{
    const yj=JSON.parse(localStorage.getItem('yijing_hist_v1')||'[]');
    (Array.isArray(yj)?yj:[]).slice(0,2).forEach(r=>{
      const q=String(r.q||r.question||'').slice(0,60);
      const res=String(r.gua||r.result||'').slice(0,100);
      if(q||res) parts.push('【近期问卦】'+(q?('问：「'+q+'」'):'')+(res?' → '+res:''));
    });
  }catch(e){}
  return parts.join('\n');
}
async function askAI(p){
  const memCtx=readMemContext();
  /* agent 记忆注入：画像 + 相关记忆（记忆库 v2 + 聊天记录），比本地历史更全 */
  let agentCtx='';
  if(typeof window.MemoryTools !== 'undefined' && window.MemoryTools.buildContext){
    try{ agentCtx=window.MemoryTools.buildContext('命盘 八字 运势'); }catch(e){}
  }
  /* 命理专属要求（只写板块特有的，通用人设/中立/结合经历都在模板里） */
  const BAZI_SPECIALTY='你是一位资深命理先生，承子平遗风，熟读《三命通会》《渊海子平》《滴天髓征义》《穷通宝鉴》《子平真诠评注》等经典，'
    +'人称"子平先生"。你收到的是一套真实的四柱八字排盘结果（含四柱干支、十神、五行、格局、大运、神煞、命宫身宫等）。'
    +'请严格基于给出的命盘数据进行解读，绝不虚构或替换任何一柱一字。'
    +'【必须覆盖的专项内容】\n'
    +'1. 整体格局分析：判断身强身弱（结合得令/得地/得势），分析十神关系（财官印食比劫的配置），体用平衡，综合交叉验证后输出结论；\n'
    +'2. 绘制命盘五行能量分布图：用 ASCII 字符画出五行强弱（如 ██▓▓░░ 或柱状图），直观呈现木火土金水各自的能量；\n'
    +'3. 排出大运和流年，结合命主的历史事件验证推算准确性——若记忆库有真实经历（学业/工作/感情/健康等），要列出并对照大运流年做细节丰富的推演验证；\n'
    +'4. 根据未来五年的大运流年，分别从财运、感情、健康三方面推测运势，并给出具体可操作的指导方针。\n'
    +'【大运算法要求】三天折合一岁；阳年生男/阴年生女顺行，阴年生男/阳年生女逆行；按出生日距上一个节气（逆行）或下一个节气（顺行）的天数计算。'
    +'请核对给出的起运岁数与大运方向是否与此规则一致，若一致就沿用并说明，若明显不符请指出并给出正确算法。';
  const panText=[
    '【命盘数据】',
    '四柱：'+p.pillars.join(' '),
    '十神：'+p.tens.join(' '),
    '日主：'+p.dayMasterFull,
    '身强弱：'+p.strength,
    '格局：'+p.pattern,
    '五行分布：'+JSON.stringify(p.five),
    '喜用神：'+(p.xiYong||[]).join('、'),
    '忌神：'+(p.jiYong||[]).join('、'),
    '大运（虚岁'+Math.round(p.dy.startAge)+'起运）：'+(p.dy.steps||[]).join(' → '),
    '神煞：'+((p.shenSha&&p.shenSha.length)?p.shenSha.map(s=>s.name+'('+s.pos+')').join('、'):'—'),
    (p.timeUnknown?'【注意】出生时间未知，已按午时（正午12:00）近似推演，解读时请说明时辰部分仅供参考':'出生时间：'+p.hh+':'+String(p.mm).padStart(2,'0')),
    (p.cityUnknown?'【注意】出生地点未知，已按东八区默认推演，未做真太阳时校正':'出生地：'+(p.inputCity||'—')),
    '',
    '【真实经历与记忆库过往】',
    memCtx||'（暂无记忆库记录，请只基于命盘分析，不要虚构）'
  ].join('\n');
  /* 用通用模板组装：通用底座 + 命理专属 + 数据 */
  let sys='';
  try{
    sys=window.AIPromptTemplate.buildAIPrompt({
      module:'命盘八字',
      role:BAZI_SPECIALTY,
      data:panText
    });
  }catch(e){ sys='你是资深命理学家，请基于以下命盘数据做深度解析：\n'+panText; }
  /* 页面内思考状态：清掉轮换提示，改为 orb 思考环 + 状态文字（对齐塔罗） */
  const st=$('panAIStatus'),tx=$('panAIText');
  if(st){clearInterval(bwTimer);st.className='b-wait';st.innerHTML=''
    +'<div class="b-loading" style="padding:0"><div class="orb-ring"></div><span class="status-word">子平先生正在凝神推演命盘…</span></div>';}
  if(tx)tx.style.display='block';
  let txt='',shown='';
  const renderEnd='<span class="caret"></span>';
  try{
    txt=await window.AIRelay.stream({
      temperature:.85,max_tokens:2000,
      messages:[{role:'system',content:sys},{role:'user',content:'请为下面这个命盘做深度解析。'+(agentCtx?'\n\n【记忆与画像】\n'+agentCtx:'')}],
      onDelta:(_c,total)=>{ shown=total;if(tx){tx.innerHTML=mdToHtml(shown)+renderEnd;} },
      onReason:(r)=>{
        const w=document.querySelector('#panAIStatus .status-word');
        if(w)w.textContent='子平先生正在凝神推演命盘……（已推理 '+r.length+' 字）';
      },
      onRetry:(tier,n)=>{ const w=document.querySelector('#panAIStatus .status-word'); if(w)w.textContent='🔄 '+tier+'连接中断，正在尝试重连（'+n+'/'+window.AIRelay.RETRY+'）…'; }
    });
    if(!txt)throw new Error('AI 无响应');
  }catch(err){
    if(st){clearInterval(bwTimer);st.style.display='none';}
    if(tx)tx.innerHTML='<strong style="color:#ff9d9d">✕ 命盘在云间迷路了…</strong>'
      +'<p style="color:#cbc0ea;margin-top:8px">原因：'+esc(String(err&&err.message||'未知错误').slice(0,160))+'</p>'
      +'<p style="color:#8a81b8;margin-top:8px">请检查网络后重新点一次「起盘」。</p>';
    throw err;
  }
  /* 完成：清状态、去光标、定型 */
  if(st){clearInterval(bwTimer);st.style.display='none';}
  if(tx)tx.innerHTML=mdToHtml(txt);
  return txt;
}
/* 极简 MD→HTML（复用观星思路；ASCII 五行图用代码块保护） */
function mdToHtml(t){
  /* 先保护 ASCII 代码块（``` 包裹的内容原样输出） */
  const blocks=[];
  t=t.replace(/```([\s\S]*?)```/g,(m,c)=>{blocks.push(c);return '\u0000BLOCK'+(blocks.length-1)+'\u0000';});
  let h=esc(t);
  h=h.replace(/^### (.*)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.*)$/gm,'<h3 style="margin-top:16px">$1</h3>');
  h=h.replace(/^# (.*)$/gm,'<h3>$1</h3>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/^- (.*)$/gm,'<p>· $1</p>');
  h=h.replace(/\n/g,'<br>');
  /* 还原 ASCII 代码块为等宽字体的原样展示 */
  h=h.replace(/\u0000BLOCK(\d+)\u0000/g,(m,i)=>{
    const b=blocks[+i]||'';
    return '<pre style="font-family:ui-monospace,Consolas,monospace;font-size:.78rem;line-height:1.5;'
      +'background:rgba(240,207,130,.06);border:1px solid rgba(240,207,130,.18);border-radius:10px;'
      +'padding:10px 12px;overflow-x:auto;color:#e6e0f4;white-space:pre;margin:8px 0">'+esc(b)+'</pre>';
  });
  return h;
}

$('btnBack').onclick=()=>{if(history.length>1)history.back();else location.href='../';};
$('shotClose').onclick=()=>$('shotModal').classList.remove('show');
$('shotModal').onclick=e=>{if(e.target.id==='shotModal')$('shotModal').classList.remove('show');};
function fb(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
function stripHtml(h){const d=document.createElement('div');d.innerHTML=h;return d.innerText||d.textContent||'';}

/* ---------- 分享命盘（图片 + 文字，对齐问卦页） ---------- */
let shareCtx=null;
function openBaziShare(){
  if(!lastPan){alert('先起盘');return;}
  const p=lastPan;
  shareCtx={
    pillars:p.pillars||[],tens:p.tens||[],
    dayMasterFull:p.dayMasterFull||'',strength:p.strength||'',pattern:p.pattern||'',
    five:p.five||{},xiYong:p.xiYong||[],jiYong:p.jiYong||[],
    dy:p.dy||{},shenSha:p.shenSha||[],
    timeUnknown:!!p.timeUnknown,cityUnknown:!!p.cityUnknown,
    inputCity:p.inputCity||'',
    aiText:stripHtml(lastAI||'').slice(0,300),
    link:'https://ydk12335.github.io/bazi/'
  };
  try{
    const cv=drawBaziCard(shareCtx);
    cv.toBlob(b=>{
      if(b)document.getElementById('shotImg').src=URL.createObjectURL(b);
      const m=document.getElementById('shotModal');if(m)m.classList.add('show');
    },'image/png');
  }catch(e){alert('生成分享图失败：'+String(e&&e.message||e).slice(0,80));}
}
/* 分享图：深空古风长卡（四柱+五行+大运+解读） */
function drawBaziCard(r){
  const W=720,c=document.createElement('canvas');
  c.width=W;c.height=1080;
  const x=c.getContext('2d');
  /* 底色：深空渐变 */
  const g=x.createLinearGradient(0,0,0,1080);
  g.addColorStop(0,'#0b0a1a');g.addColorStop(.55,'#101126');g.addColorStop(1,'#05040d');
  x.fillStyle=g;x.fillRect(0,0,W,1080);
  /* 金色描边框 */
  x.strokeStyle='rgba(240,207,130,.55)';x.lineWidth=2;
  x.strokeRect(22,22,W-44,1036);
  /* 标题 */
  x.fillStyle='#f0cf82';x.font='600 46px "Ma Shan Zheng","Kaiti SC","楷体",serif';x.textAlign='center';
  x.fillText('命 盘 推 演',W/2,92);
  x.fillStyle='rgba(240,207,130,.45)';x.font='20px "Ma Shan Zheng","Kaiti SC","楷体",serif';
  x.fillText('✦ 四柱八字 · 有点困 ✦',W/2,132);
  /* 四柱 */
  x.fillStyle='rgba(245,236,220,.9)';x.font='600 40px "Ma Shan Zheng","Kaiti SC","楷体",serif';
  x.fillText((r.pillars||[]).join('  '),W/2,216);
  x.fillStyle='rgba(181,173,216,.9)';x.font='22px "Ma Shan Zheng","Kaiti SC","楷体",serif';
  x.fillText('十神　'+(r.tens||[]).join('　'),W/2,256);
  x.fillStyle='rgba(240,207,130,.85)';x.font='26px "Ma Shan Zheng","Kaiti SC","楷体",serif';
  x.fillText((r.dayMasterFull||'')+' · '+(r.pattern||'')+' · '+(r.strength||''),W/2,304);
  /* 五行分布条 */
  const wx=['木','火','土','金','水'],colors=['#8fe0c0','#f2a0a0','#f0cf82','#f6ecc9','#8fc7e8'];
  const f=r.five||{};const maxV=Math.max(...wx.map(w=>f[w]||0),1);
  wx.forEach((w,i)=>{
    const v=f[w]||0,barW=Math.round(v/maxV*360);
    x.fillStyle='rgba(255,255,255,.12)';
    x.fillRect(W/2-190,340+i*40,380,18);
    x.fillStyle=colors[i];
    x.fillRect(W/2-190,340+i*40,barW,18);
    x.fillStyle='rgba(245,236,220,.9)';x.font='22px "Ma Shan Zheng","Kaiti SC","楷体",serif';x.textAlign='right';
    x.fillText(w,W/2-206,357+i*40);
    x.textAlign='left';
    x.fillText(v.toFixed(1),W/2+200,357+i*40);
  });
  /* 喜用 / 大运 */
  x.fillStyle='rgba(245,236,220,.85)';x.font='22px "Ma Shan Zheng","Kaiti SC","楷体",serif';
  x.textAlign='center';
  x.fillText('喜用　'+(r.xiYong||[]).join('、')+'　·　忌　'+(r.jiYong||[]).join('、'),W/2,570);
  x.fillText('大运　'+(r.dy&&r.dy.steps?r.dy.steps.join(' → '):''),W/2,606);
  /* 备注（时间/地点未知） */
  let note='';
  if(r.timeUnknown)note+='　时间未知（按午时推演）';
  if(r.cityUnknown)note+='　地点未知（按东八区推演）';
  if(note){x.fillStyle='rgba(181,173,216,.75)';x.font='20px "Ma Shan Zheng","Kaiti SC","楷体",serif';x.fillText(note.trim(),W/2,648);}
  /* 解读摘要 */
  const body=(r.aiText||'').replace(/\s+/g,' ').trim();
  if(body){
    x.fillStyle='rgba(143,134,184,.9)';x.font='22px "Ma Shan Zheng","Kaiti SC","楷体",serif';
    x.fillText('— 命盘解读 —',W/2,700);
    x.fillStyle='rgba(230,224,244,.9)';x.font='20px "Kaiti SC","楷体",serif';
    const lines=[];for(let i=0;i<body.length;i+=22)lines.push(body.slice(i,i+22));
    lines.slice(0,8).forEach((l,i)=>x.fillText(l,W/2,738+i*32));
  }
  /* 落款 */
  x.fillStyle='rgba(240,207,130,.6)';x.font='22px "Ma Shan Zheng","Kaiti SC","楷体",serif';
  x.fillText('—— 来自「有点困 · Sleepy Space」',W/2,1000);
  x.fillStyle='rgba(181,173,216,.6)';x.font='18px "Kaiti SC","楷体",serif';
  x.fillText(r.link||'',W/2,1032);
  return c;
}
async function baziShareImage(){
  if(!shareCtx)return;
  const cv=drawBaziCard(shareCtx);
  const shot=await new Promise(r=>cv.toBlob(r,'image/png'));
  if(!shot)return;
  try{
    if(navigator.canShare&&shot&&navigator.canShare({files:[new File([shot],'bazi.png',{type:'image/png'})]})){
      await navigator.share({title:'我的命盘',files:[new File([shot],'bazi.png',{type:'image/png'})]});
      return;
    }
  }catch(e){}
  /* 降级：保存/新窗口打开 */
  const url=URL.createObjectURL(shot);
  const a=document.createElement('a');a.href=url;a.download='bazi.png';
  if(navigator.userAgent.match(/Android|iPhone/i)){
    const w=window.open(url,'_blank');
    if(w)setTimeout(()=>URL.revokeObjectURL(url),30000);
  }else{a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
}
function baziShareText(){
  if(!shareCtx)return;
  const p=lastPan||{};
  const t='✦ 命盘推演 ✦\n'
    +'四柱：'+(p.pillars||[]).join(' ')+'\n'
    +'十神：'+(p.tens||[]).join(' ')+'\n'
    +'日主：'+(p.dayMasterFull||'')+'（'+(p.strength||'')+'）\n'
    +'格局：'+(p.pattern||'')+'\n'
    +'喜用：'+(p.xiYong||[]).join('、')+' / 忌：'+(p.jiYong||[]).join('、')+'\n'
    +'大运：'+((p.dy&&p.dy.steps)||[]).join(' → ')+'\n'
    +(p.timeUnknown?'（时间未知 · 按午时推演）':'')+(p.cityUnknown?'（地点未知 · 按东八区推演）':'')+'\n\n'
    +stripHtml(lastAI||'').slice(0,400)+'\n\n—— 来自「有点困」\n☯ 在线命盘：https://ydk12335.github.io/bazi/';
  const done=()=>alert('已复制，去分享吧 ✦');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>{fb(t);done();});}
  else{fb(t);done();}
}
$('btnShare').onclick=openBaziShare;
$('btnShotImg').onclick=baziShareImage;
$('btnShotTxt').onclick=baziShareText;

  try{
    if(lastPan){
      const p=lastPan;
      subject='四柱 '+(p.pillars||[]).join(' ');
      summary='我刚刚排了自己的命盘：'+(p.pillars||[]).join(' ')+'，日主'+(p.dayMasterFull||'')+'，'
        +(p.pattern||'')+'格局，'+(p.strength||'')+'。'+(stripHtml(lastAI||'').slice(0,120));
    }
  }catch(e){}

    if(window.TreeHole&&window.TreeHole.setOpening)window.TreeHole.setOpening({scene:'命盘',subject:subject,summary:summary.slice(0,300)});
    else{
      /* 兜底：TreeHole 未加载时直接写 localStorage（树洞侧 peekOpening 读同一 key） */

        scene:'命盘',subject:subject,summary:summary.slice(0,300),at:Date.now()
      }));
    }
  }catch(e){}
  location.href='../treehole/';
};
