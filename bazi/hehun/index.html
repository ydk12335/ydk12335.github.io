<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>八字合盘 · 有点困</title>
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&display=swap">
<style>
:root{--gold:#f0cf82;--gold-rgb:240,207,130;--gold-dim:#a9956a;--ivory:#f2ede0;--muted:#b5abd8;--purple:#c9b0e8;--purple-rgb:201,176,232;--glass-rgb:255,255,255}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#05030f}
body{font-family:"Ma Shan Zheng","Xingkai SC","STXingkai","Kaiti SC","STKaiti","KaiTi","楷体",serif;color:var(--ivory);overflow-x:hidden;user-select:none}
canvas#stars{position:fixed;inset:0;z-index:0}
body[data-phase="day"]{--gold:#8a6a2e;--gold-rgb:138,106,46;--gold-dim:#9c8a68;--ivory:#2c2a36;--muted:#6b6480;--purple:#7a5a9a;--purple-rgb:122,90,154;--glass-rgb:70,58,44}
body[data-phase="dusk"]{--gold:#a85f2c;--gold-rgb:168,95,44;--gold-dim:#a08560;--ivory:#38282a;--muted:#8a7068;--purple:#8a5a72;--purple-rgb:138,90,114;--glass-rgb:80,50,38}
body[data-phase="day"],body[data-phase="dusk"]{background:#efe8d8}
.btn-back{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;z-index:10;
  background:rgba(20,12,44,.55);border:1px solid rgba(240,207,130,.3);color:#e8dcc0;
  border-radius:999px;padding:8px 18px;font-size:.8rem;letter-spacing:.15em;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:inherit}
.portal{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;
  align-items:center;text-align:center;padding:clamp(64px,11vh,96px) 20px 30px}
.kicker{font-size:.68rem;letter-spacing:.42em;text-indent:.42em;color:var(--gold-dim)}
.p-title{font-size:clamp(1.7rem,6.4vw,2.5rem);letter-spacing:.3em;text-indent:.3em;font-weight:600;
  color:var(--ivory);text-shadow:0 0 30px rgba(240,207,130,.25);margin-top:8px}
.p-sub{margin-top:10px;font-size:.8rem;letter-spacing:.22em;color:#e8b48f}
.rel-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:clamp(22px,4vh,34px);width:min(560px,94vw)}
.rel-chip{cursor:pointer;user-select:none;-webkit-user-select:none;padding:8px 16px;border-radius:999px;
  border:1px solid rgba(240,207,130,.24);color:#f0ead8;font-size:.82rem;letter-spacing:.06em;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.012));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.2s}
.rel-chip.on{border-color:rgba(240,207,130,.65);color:var(--gold);background:rgba(240,207,130,.12);
  text-shadow:0 0 10px rgba(240,207,130,.4)}
.b-form{width:min(560px,94vw);margin-top:clamp(18px,3vh,28px);text-align:left;
  background:rgba(255,255,255,.04);border:1px solid rgba(240,207,130,.16);border-radius:18px;
  padding:clamp(14px,3vw,20px);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.b-pair-person{background:rgba(255,255,255,.03);border:1px solid rgba(240,207,130,.14);border-radius:16px;
  padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.b-pair-person:last-child{margin-bottom:0}
.b-pair-tag{font-size:.72rem;color:#9a90c0;letter-spacing:.3em;text-align:center;text-indent:.3em}
.b-row{display:flex;gap:10px}
.b-row .b-field{flex:1;min-width:0}
.b-field{display:flex;flex-direction:column;gap:6px}
.b-label{font-size:.74rem;color:#c9b98a;letter-spacing:.16em;text-indent:.16em}
.b-input,.b-select{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(240,207,130,.22);
  border-radius:10px;padding:9px 12px;color:#f0ead8;font-family:inherit;font-size:.88rem;outline:none;
  color-scheme:dark;transition:.2s}
.b-input:focus,.b-select:focus{border-color:rgba(240,207,130,.6);background:rgba(240,207,130,.06)}
.b-input::placeholder{color:#7d74a8;font-size:.8rem}
.b-pickrow{display:flex;gap:8px}
.b-pick{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid rgba(240,207,130,.3);
  background:rgba(240,207,130,.08);cursor:pointer;font-size:1rem;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:.2s;padding:0;font-family:inherit}
.b-pick:active{background:rgba(240,207,130,.2);transform:scale(.93)}
.b-unknown{display:flex;align-items:center;gap:5px;font-size:.72rem;color:#8f86b8;cursor:pointer;user-select:none;margin-top:2px}
.b-unknown input{accent-color:#f0cf82}
.b-field.dim{opacity:.45}
.b-gender{display:flex;gap:8px}
.b-gender button{flex:1;padding:8px 0;border-radius:10px;border:1px solid rgba(240,207,130,.22);
  background:rgba(255,255,255,.04);color:#cfc6ea;font-family:inherit;font-size:.84rem;cursor:pointer;transition:.2s;letter-spacing:.1em}
.b-gender button.on{color:#14102b;background:var(--gold);border-color:var(--gold);box-shadow:0 0 14px rgba(240,207,130,.35)}
.btn-gold{margin-top:clamp(18px,3vh,26px);cursor:pointer;border-radius:999px;
  padding:14px 44px;font-size:.98rem;letter-spacing:.24em;text-indent:.24em;
  font-family:inherit;font-weight:600;color:#fffbef;position:relative;overflow:hidden;isolation:isolate;
  background:linear-gradient(165deg,rgba(255,238,196,.32),rgba(240,207,130,.08) 44%,rgba(198,150,74,.18)),linear-gradient(#160c33,#160c33);
  border:1px solid rgba(240,207,130,.4);transition:.25s}
.btn-gold:disabled{opacity:.5;cursor:default}
.btn-gold:active{transform:scale(.96)}
.pair-note{font-size:.72rem;color:#8a81b8;min-height:1.5em;margin-top:12px;letter-spacing:.08em}
#pairResult{width:min(580px,94vw);margin-top:clamp(18px,3vh,28px);display:none;text-align:left}
.p-head{display:flex;align-items:center;justify-content:center;gap:12px;
  font-size:1.05rem;color:#e9e3ff;letter-spacing:.1em;margin-bottom:6px}
.p-head .ps{font-size:1.5rem;color:#f2d488;text-shadow:0 0 12px rgba(240,207,130,.5)}
.p-rel{text-align:center;color:#a79ade;font-size:.78rem;letter-spacing:.2em;margin-bottom:12px}
.a-card{background:rgba(255,255,255,.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:clamp(14px,3vw,22px);
  box-shadow:0 14px 40px rgba(4,2,18,.4);line-height:1.9;font-size:.9rem;color:#e6e0f4}
.a-card h3{color:var(--gold);font-size:.95rem;margin:14px 0 6px;letter-spacing:.08em;text-align:center}
.a-card h3:first-child{margin-top:0}
.a-card strong{color:#ffe4ab;font-weight:600}
.a-card p{margin:7px 0}
.a-card .chip{display:inline-block;margin:2px 4px 2px 0;padding:2px 10px;border-radius:999px;
  background:rgba(240,207,130,.12);border:1px solid rgba(240,207,130,.3);color:#f2d488;font-size:.76rem}
.a-card table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:4px}
.a-card table td{border-bottom:1px solid rgba(255,255,255,.06);padding:5px 4px;color:#d8d0ef}
.a-card table td:first-child{color:#b5abd8;width:7em;white-space:nowrap}
.pan-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.pan-col{background:rgba(255,255,255,.04);border:1px solid rgba(240,207,130,.18);border-radius:12px;padding:10px 6px;text-align:center}
.pan-col .pc-label{font-size:.6rem;color:#9a90c0;letter-spacing:.2em}
.pan-col .pc-gz{font-size:1.15rem;color:#f2d488;margin-top:3px;letter-spacing:.08em}
.pan-col .pc-ten{font-size:.66rem;color:#b5abd8;margin-top:3px}
.pan-col .pc-wx{font-size:.6rem;color:#8f86b8}
.pan-col.hl{border-color:rgba(240,207,130,.55);background:rgba(240,207,130,.08)}
.pan-col.hl .pc-gz{color:#ffe4ab;text-shadow:0 0 10px rgba(240,207,130,.6)}
.b-pair-block{background:rgba(255,255,255,.03);border:1px solid rgba(240,207,130,.14);border-radius:16px;
  padding:12px;margin-bottom:12px}
.b-pair-name{text-align:center;color:var(--gold);font-size:.82rem;letter-spacing:.18em;margin-bottom:8px}
.b-pair-sum{text-align:center;font-size:.68rem;color:#9a90c0;letter-spacing:.04em;margin-top:8px}
.p-foot{text-align:center;font-size:.66rem;color:#8f86b8;margin-top:14px;letter-spacing:.05em}
.p-foot2{font-size:.72rem;letter-spacing:.3em;text-indent:.3em;color:#6f66a0;margin-top:auto;padding-top:30px}
.a-loading{display:flex;align-items:center;justify-content:center;gap:12px;color:#c9c0e8;padding:26px 0}
.orb-ring{position:relative;width:20px;height:20px;flex:none}
.orb-ring::before{content:"";position:absolute;inset:0;border-radius:50%;
  border:1.5px solid rgba(240,207,130,.25);border-top-color:var(--gold);animation:orbSpin 1.1s linear infinite}
.orb-ring::after{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.5rem;color:var(--gold);animation:orbGlow 2.2s ease-in-out infinite}
@keyframes orbSpin{to{transform:rotate(360deg)}}
@keyframes orbGlow{0%,100%{opacity:.4}50%{opacity:1;text-shadow:0 0 10px rgba(240,207,130,.8)}}
.pair-share{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.soon-pill{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  padding:10px 20px;border-radius:999px;font-size:.86rem;color:#f0ead8;letter-spacing:.06em;
  border:1px solid rgba(240,207,130,.28);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.012));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:inherit;text-decoration:none;transition:.25s}
.soon-pill:active{transform:scale(.95)}
body[data-phase="day"] .b-form,body[data-phase="dusk"] .b-form{background:rgba(255,255,255,.55);border-color:rgba(0,0,0,.12)}
body[data-phase="day"] .b-input,body[data-phase="dusk"] .b-input,body[data-phase="day"] .b-select,body[data-phase="dusk"] .b-select{background:rgba(255,255,255,.65);color:var(--ivory);border-color:rgba(0,0,0,.14)}
body[data-phase="day"] .a-card,body[data-phase="dusk"] .a-card{background:rgba(255,255,255,.6);border-color:rgba(0,0,0,.1);color:var(--ivory)}
body[data-phase="day"] .a-card table td,body[data-phase="dusk"] .a-card table td{color:var(--ivory);border-bottom-color:rgba(0,0,0,.08)}
body[data-phase="day"] .a-card table td:first-child,body[data-phase="dusk"] .a-card table td:first-child{color:var(--muted)}
body[data-phase="day"] .pan-col,body[data-phase="dusk"] .pan-col{background:rgba(255,255,255,.42);border-color:rgba(0,0,0,.14)}
body[data-phase="day"] .pan-col .pc-gz,body[data-phase="dusk"] .pan-col .pc-gz{color:var(--gold)}
.rel-desc{text-align:center;font-size:.72rem;color:#a79ade;letter-spacing:.08em;margin-top:10px;min-height:1.6em}
.rel-custom{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px;width:min(560px,94vw)}
.rel-custom .b-input{flex:1;max-width:340px}
body[data-phase="day"] .rel-desc,body[data-phase="dusk"] .rel-desc{color:var(--muted)}
@media(max-width:420px){.b-row{flex-direction:column}.b-row .b-field{flex:auto}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<button class="btn-back" id="btnBack">◂ 返回</button>

<div class="portal">
  <header>
    <div class="kicker">BAZI SYNASTRY</div>
    <h1 class="p-title">八 字 合 盘</h1>
    <p class="p-sub">✦ 两盘四柱重叠之处，藏着关系的密码 ✦</p>
  </header>

  <div class="rel-bar" id="relBar">
    <span class="rel-chip on" data-rel="恋人" data-desc="彼此心动、正在交往或想要确定关系的人">❤ 恋人</span>
    <span class="rel-chip" data-rel="夫妻" data-desc="已结婚或打算共度一生的伴侣">💍 夫妻</span>
    <span class="rel-chip" data-rel="暧昧" data-desc="互有好感却还没说破的拉扯">💘 暧昧</span>
    <span class="rel-chip" data-rel="暗恋" data-desc="心里偷偷喜欢，对方或许还不知道">🌙 暗恋</span>
    <span class="rel-chip" data-rel="前任" data-desc="曾经爱过、已经分开的故人">💔 前任</span>
    <span class="rel-chip" data-rel="朋友" data-desc="相处舒服、无话不谈的知己">☘ 朋友</span>
    <span class="rel-chip" data-rel="闺蜜" data-desc="掏心窝子的好姐妹">👭 闺蜜</span>
    <span class="rel-chip" data-rel="兄弟" data-desc="过命交情的好哥们">🤝 兄弟</span>
    <span class="rel-chip" data-rel="家人" data-desc="血脉相连或胜似亲人的羁绊">⌂ 家人</span>
    <span class="rel-chip" data-rel="亲子" data-desc="父母与子女之间的缘分">👨‍👩‍👧 亲子</span>
    <span class="rel-chip" data-rel="自定义" data-desc="写下你们的关系，如「我暗恋她」">✎ 自定义</span>
  </div>
  <div class="rel-desc" id="relDesc">彼此心动、正在交往或想要确定关系的人</div>
  <div class="rel-custom" id="relCustom" style="display:none">
    <input class="b-input" id="relCustomInput" type="text" maxlength="14" placeholder="写下你们的关系，如：我暗恋她" autocomplete="off">
    <button type="button" class="b-pick" id="relCustomOk" style="flex:none;width:auto;padding:0 16px;height:38px">确认</button>
  </div>
  <div class="rel-now" id="relNowWrap">
    <label class="b-label" style="text-align:center;display:block;margin-top:16px">现在你们是什么关系？（选填）</label>
    <input class="b-input" id="relNow" type="text" maxlength="30" placeholder="如：我暗恋她 / 异地三年 / 刚在一起 / 冷战了两个月…" autocomplete="off" style="margin-top:8px">
  </div>

  <div class="b-form" id="bForm">
    <div class="b-pair-person">
      <div class="b-pair-tag">第一位</div>
      <div class="b-field">
        <label class="b-label">称呼 / 名字（选填）</label>
        <input class="b-input" id="pNameA" type="text" maxlength="10" placeholder="如：小星">
      </div>
      <div class="b-row">
        <div class="b-field">
          <label class="b-label">出生日期</label>
          <div class="b-pickrow">
            <input class="b-input" id="pDateA" type="text" inputmode="numeric" value="1998-08-08" placeholder="如 1998-08-08" autocomplete="off">
            <button type="button" class="b-pick" data-pick="pDateA">📅</button>
          </div>
        </div>
      </div>
      <div class="b-row">
        <div class="b-field">
          <label class="b-label">出生时间</label>
          <div class="b-pickrow">
            <input class="b-input" id="pTimeA" type="text" inputmode="numeric" value="10:00" placeholder="如 10:30 或 1030" autocomplete="off">
            <button type="button" class="b-pick" data-pick="pTimeA">⏰</button>
          </div>
          <label class="b-unknown"><input type="checkbox" data-unknowntime="pTimeA"> 时间未知</label>
        </div>
        <div class="b-field">
          <label class="b-label">城市</label>
          <select class="b-select" data-city="A"></select>
          <label class="b-unknown"><input type="checkbox" data-unknowncity="A"> 地点未知</label>
        </div>
      </div>
      <div class="b-field">
        <label class="b-label">性别</label>
        <div class="b-gender" data-gender="A">
          <button data-g="男" class="on">男</button>
          <button data-g="女">女</button>
        </div>
      </div>
    </div>

    <div class="b-pair-person">
      <div class="b-pair-tag">第二位</div>
      <div class="b-field">
        <label class="b-label">称呼 / 名字（选填）</label>
        <input class="b-input" id="pNameB" type="text" maxlength="10" placeholder="如：阿月">
      </div>
      <div class="b-row">
        <div class="b-field">
          <label class="b-label">出生日期</label>
          <div class="b-pickrow">
            <input class="b-input" id="pDateB" type="text" inputmode="numeric" value="1999-12-03" placeholder="如 1999-12-03" autocomplete="off">
            <button type="button" class="b-pick" data-pick="pDateB">📅</button>
          </div>
        </div>
      </div>
      <div class="b-row">
        <div class="b-field">
          <label class="b-label">出生时间</label>
          <div class="b-pickrow">
            <input class="b-input" id="pTimeB" type="text" inputmode="numeric" value="14:30" placeholder="如 14:30 或 1430" autocomplete="off">
            <button type="button" class="b-pick" data-pick="pTimeB">⏰</button>
          </div>
          <label class="b-unknown"><input type="checkbox" data-unknowntime="pTimeB"> 时间未知</label>
        </div>
        <div class="b-field">
          <label class="b-label">城市</label>
          <select class="b-select" data-city="B"></select>
          <label class="b-unknown"><input type="checkbox" data-unknowncity="B"> 地点未知</label>
        </div>
      </div>
      <div class="b-field">
        <label class="b-label">性别</label>
        <div class="b-gender" data-gender="B">
          <button data-g="女" class="on">女</button>
          <button data-g="男">男</button>
        </div>
      </div>
    </div>
  </div>

  <button class="btn-gold" id="btnGo">✦ 合 盘 推 演 ✦</button>
  <div class="pair-note" id="pairNote"></div>

  <div id="pairResult">
    <div class="p-head"><span class="ps">✦</span><span id="pTitle">八字合盘</span><span class="ps">✦</span></div>
    <div class="p-rel" id="pRel"></div>
    <div class="a-card" id="pText"></div>
    <div class="pair-share">
      <button class="soon-pill" id="btnPairCopy">📋 文字分享</button>
      <button class="soon-pill" id="btnHole">🕳️ 去树洞聊聊</button>
    </div>
  </div>

  <div class="p-foot">合盘由传统四柱推演 · 解读由 AI 生成 · 仅供娱乐参考</div>
  <footer class="p-foot2">‥ 有点困 ‥</footer>
</div>

<script src="../bazi-engine.js"></script>
<script src="../../memory.js"></script>
<script src="../../ai-prompt-template.js"></script>
<script src="../../treehole.js?v=11"></script>
<script src="../../ai-relay.js?v=10"></script>
<script src="../../agent-tools.js?v=1"></script>
<script>
'use strict';
/* ================= 基础 ================= */
const $=id=>document.getElementById(id);
const esc=t=>{const d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML;};

/* ================= 国画雪梅背景（昼夜跟随，与八字页一致） ================= */
const cv=document.getElementById('stars'),ctx=cv.getContext('2d');
let snow=[],mist=[],W,H,PHASE='night',branchSegs=[],plumBlossoms=[];
const PHASES={
  night:{sky:['#0b0a1a','#101126','#05040d'],ink:['rgba(26,30,52,.82)','rgba(15,18,36,.9)','rgba(6,8,18,.97)'],orb:{x:.76,y:.19,r:.082,c:'rgba(246,238,212,.92)',glow:'rgba(240,228,185,.32)',glowR:3.4},snow:'rgba(255,255,255,.9)',branch:'rgba(22,18,32,.92)',plum:['#f0c2d2','#e6a4bb','#f6dbe4'],mistRgb:'198,208,230',mistA:.055},
  day:{sky:['#f8f3e8','#efe7d6','#e5dac2'],ink:['rgba(150,158,175,.28)','rgba(118,126,148,.36)','rgba(86,94,116,.48)'],orb:{x:.74,y:.2,r:.07,c:'rgba(255,250,238,.95)',glow:'rgba(255,236,188,.55)',glowR:3.8},snow:'rgba(158,174,200,.72)',branch:'rgba(72,52,50,.82)',plum:['#c0556b','#ad3f57','#d9788c'],mistRgb:'255,255,255',mistA:.45},
  dusk:{sky:['#f5ddc5','#e7ba96','#d0916d'],ink:['rgba(152,112,116,.32)','rgba(116,78,92,.4)','rgba(78,52,68,.52)'],orb:{x:.72,y:.62,r:.075,c:'rgba(255,238,205,.92)',glow:'rgba(255,188,128,.5)',glowR:4.2},snow:'rgba(255,246,236,.85)',branch:'rgba(56,36,40,.86)',plum:['#b34a5e','#a33d50','#cf6f80'],mistRgb:'255,230,210',mistA:.32}
};
function currentPhase(){const h=new Date().getHours();if(h>=6&&h<16)return 'day';if(h>=16&&h<19)return 'dusk';return 'night';}

/* ================= 雪梅背景动画 ================= */
function resizeStars(){W=cv.width=innerWidth;H=cv.height=innerHeight;
  snow=[];const n=Math.max(46,Math.floor(W/5));
  for(let i=0;i<n;i++)snow.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.1+.7,vy:Math.random()*.6+.32,vx:(Math.random()-.5)*.42,a:Math.random()*.55+.35,ph:Math.random()*7});
  mist=[];for(let i=0;i<4;i++)mist.push({x:Math.random()*W,y:(.38+Math.random()*.46)*H,w:W*(.55+Math.random()*.7),h:H*(.05+Math.random()*.06),v:Math.random()*.1+.03,ph:Math.random()*7});
  buildPlum();}
function buildPlum(){branchSegs=[];plumBlossoms=[];
  const S=Math.min(W,H);let pts=[[W*1.03,H*1.02]],x=W*1.03,y=H*1.02,ang=Math.PI*1.16;
  for(let i=0;i<9;i++){const len=S*.088*(1-i*.06);ang+=(Math.random()-.5)*.5;x+=Math.cos(ang)*len;y+=Math.sin(ang)*len;pts.push([x,y]);}
  branchSegs.push({pts,w:S*.011});
  for(let k=2;k<pts.length-1;k++){if(Math.random()<.8){let[bx,by]=pts[k];let bAng=Math.atan2(by-pts[k-1][1],bx-pts[k-1][0])+(Math.random()<.5?.75:-.75);let bp=[[bx,by]],cx=bx,cy=by;const seg=2+Math.floor(Math.random()*2);for(let j=0;j<seg;j++){const len=S*.05*(1-j*.22);bAng+=(Math.random()-.5)*.6;cx+=Math.cos(bAng)*len;cy+=Math.sin(bAng)*len;bp.push([cx,cy]);}branchSegs.push({pts:bp,w:S*.0048});plumBlossoms.push({x:cx,y:cy,r:S*.012+Math.random()*2.5,ang:Math.random()*7,ph:Math.random()*7});}}
  const[ex,ey]=pts[pts.length-1];plumBlossoms.push({x:ex,y:ey,r:S*.015,ang:Math.random()*7,ph:Math.random()*7});}
function drawMountain(baseY,peakY,color,seed){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,baseY);const step=W/7;for(let i=0;i<=7;i++){const x=i*step;const h=peakY+(Math.sin(i*1.7+seed*3)*.16+Math.cos(i*.9+seed)*.12)*H*.16;if(i===0)ctx.lineTo(x,h);else{const px=(i-1)*step;const py=peakY+(Math.sin((i-1)*1.7+seed*3)*.16+Math.cos((i-1)*.9+seed)*.12)*H*.16;ctx.quadraticCurveTo((px+x)/2,(py+h)/2-H*.03,x,h);}}ctx.lineTo(W,baseY);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();}
function drawBlossom(b,colors,t){const sway=Math.sin(t/1600+b.ph)*.05;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.ang+sway);for(let i=0;i<5;i++){ctx.rotate(Math.PI*2/5);ctx.fillStyle=colors[i%colors.length];ctx.beginPath();ctx.ellipse(0,-b.r*.72,b.r*.55,b.r*.86,0,0,7);ctx.fill();}ctx.fillStyle='rgba(244,214,150,.9)';ctx.beginPath();ctx.arc(0,0,b.r*.28,0,7);ctx.fill();ctx.restore();}
function drawBranch(P){ctx.strokeStyle=P.branch;ctx.lineCap='round';ctx.lineJoin='round';for(const s of branchSegs){ctx.lineWidth=s.w;ctx.beginPath();ctx.moveTo(s.pts[0][0],s.pts[0][1]);for(let i=1;i<s.pts.length;i++){const[x0,y0]=s.pts[i-1],[x1,y1]=s.pts[i];ctx.quadraticCurveTo(x0,y0,(x0+x1)/2,(y0+y1)/2);}const last=s.pts[s.pts.length-1];ctx.lineTo(last[0],last[1]);ctx.stroke();}}
function drawScene(t){const P=PHASES[PHASE];const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,P.sky[0]);g.addColorStop(.5,P.sky[1]);g.addColorStop(1,P.sky[2]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const o=P.orb,ox=o.x*W,oy=o.y*H,or=Math.min(W,H)*o.r;const og=ctx.createRadialGradient(ox,oy,0,ox,oy,or*o.glowR);og.addColorStop(0,o.glow);og.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=og;ctx.beginPath();ctx.arc(ox,oy,or*o.glowR,0,7);ctx.fill();ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(ox,oy,or,0,7);ctx.fill();if(PHASE==='night'){ctx.fillStyle='rgba(198,188,150,.2)';ctx.beginPath();ctx.arc(ox-or*.32,oy-or*.22,or*.17,0,7);ctx.fill();ctx.beginPath();ctx.arc(ox+or*.34,oy+or*.16,or*.11,0,7);ctx.fill();}drawMountain(H*.58,H*.50,P.ink[0],1);drawMountain(H*.72,H*.43,P.ink[1],2);drawMountain(H*.87,H*.36,P.ink[2],3);mist.forEach(m=>{m.x-=m.v;if(m.x<-m.w)m.x=W+m.w;const cg=ctx.createRadialGradient(m.x+m.w/2,m.y,0,m.x+m.w/2,m.y,m.w/2);cg.addColorStop(0,'rgba('+P.mistRgb+','+P.mistA+')');cg.addColorStop(1,'rgba('+P.mistRgb+',0)');ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(m.x+m.w/2,m.y,m.w/2,m.h,0,0,7);ctx.fill();});drawBranch(P);plumBlossoms.forEach(b=>drawBlossom(b,P.plum,t));const wind=Math.sin(t/4200)*.55;snow.forEach(s=>{s.y+=s.vy;s.x+=s.vx+wind+Math.sin(t/1800+s.ph)*.35;if(s.y>H+6){s.y=-6;s.x=Math.random()*W;}if(s.x<-6)s.x=W+6;if(s.x>W+6)s.x=-6;ctx.globalAlpha=s.a;ctx.fillStyle=P.snow;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(drawScene);}

/* ================= 日期/时间解析 ================= */
function parseDateStr(s){
  s=String(s||'').trim();if(!s)return null;
  let m=s.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})日?$/);
  if(!m)m=s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(!m)return null;
  const y=+m[1],mo=+m[2],d=+m[3];
  if(y<1895||y>2100||mo<1||mo>12||d<1)return null;
  const dim=[0,31,29,31,30,31,30,31,31,30,31,30,31];
  if(d>dim[mo])return null;
  return {y,m:mo,d};
}
function parseTimeStr(s){
  s=String(s||'').trim();if(!s)return null;
  let m=s.match(/^(\d{1,2})[:：.点时](\d{1,2})(?:分)?$/);
  if(!m)m=s.match(/^(\d{2})(\d{2})$/);
  if(!m)m=s.match(/^(\d{1,2})[点时]?$/);
  if(!m)return null;
  const hh=+m[1],mm=m[2]?+m[2]:0;
  if(hh<0||hh>23||mm<0||mm>59)return null;
  return {hh,mm};
}

/* ================= 读取一位信息 ================= */
function readOne(s){
  const name=$('pName'+s).value.trim();
  const pd=parseDateStr($('pDate'+s).value);
  if(!pd)throw new Error('第'+(s==='A'?'一':'二')+'位出生日期格式不对');
  const rawTime=$('pTime'+s).value;
  const citySel=document.querySelector('select[data-city="'+s+'"]');
  const city=citySel?citySel.value:'';
  const tmUnk=!!(document.querySelector('input[data-unknowntime="pTime'+s+'"]')||{}).checked;
  const ctUnk=!!(document.querySelector('input[data-unknowncity="'+s+'"]')||{}).checked;
  const genEl=document.querySelector('.b-gender[data-gender="'+s+'"]');
  const gen=(genEl&&genEl.querySelector('button.on'))?genEl.querySelector('button.on').dataset.g:'男';
  let hh=12,mm=0;
  if(!tmUnk&&String(rawTime||'').trim()){
    const pt=parseTimeStr(rawTime);
    if(!pt)throw new Error('第'+(s==='A'?'一':'二')+'位出生时间格式不对');
    hh=pt.hh;mm=pt.mm;
  }
  const p=window.BaziEngine.paipan(name||('命主'+s),gen,pd.y,pd.m,pd.d,tmUnk?12:hh,tmUnk?0:mm,ctUnk?'':city,false);
  p.timeUnknown=tmUnk;p.cityUnknown=ctUnk;p.inputTime=rawTime;p.inputCity=ctUnk?'':city;p.gender=gen;p.name=name||('第'+(s==='A'?'一':'二')+'位');
  return p;
}

/* ================= 传统合婚计算 ================= */
function calcHeHun(pa,pb){
  const E=window.BaziEngine||{};
  const out={dims:[],score:0,maxScore:0,notes:[]};
  const aGan=pa.pillars[2][0],aZhi=pa.pillars[2][1];
  const bGan=pb.pillars[2][0],bZhi=pb.pillars[2][1];
  const wxSk=E.WX_SK||{};
  let score=0,max=0;
  /* 1) 日主五行互补 */
  const axml=E.GAN_WX[aGan]||'',bxml=E.GAN_WX[bGan]||'';
  if(axml&&bxml){
    max++;
    const sheng=wxSk[axml]&&wxSk[axml].生===bxml;
    const ke=wxSk[axml]&&wxSk[axml].克===bxml;
    const tong=axml===bxml;
    if(tong){out.dims.push(axml+'与'+bxml+'·日主同气');score+=.7;out.notes.push('两盘日主同为'+axml+'，同气相求，心思容易想到一处，但也可能都吃同一套亏。');}
    else if(sheng){out.dims.push(axml+'生'+bxml+'·相生');score+=1;out.notes.push('你（日主'+axml+'）生TA（日主'+bxml+'），有天然的照顾欲，TA也容易依赖你。');}
    else if(ke){out.dims.push(axml+'克'+bxml+'·相克');score+=.3;out.notes.push('你（日主'+axml+'）克TA（日主'+bxml+'），强势中带点摩擦，注意别把TA管太死。');}
    else{out.dims.push(axml+'·'+bxml+'·比和');score+=.8;out.notes.push('五行不相生不相克，各守本分，相处平稳但有潜力变得平淡。');}
  }
  /* 2) 日柱天干五合 */
  if(E.WU_HE&&E.WU_HE[aGan]===bGan){out.dims.push(aGan+bGan+'·天干五合');score+=1;max+=1;out.notes.push('日柱天干'+aGan+bGan+'相合，是八字合婚里最讨喜的配置之一，天然有吸引力和默契。');}
  else{max+=1;}
  /* 3) 地支六合 / 六冲 */
  const hePair=(E.LIUHE||[]).find(pr=>pr.includes(aZhi)&&pr.includes(bZhi));
  if(hePair){out.dims.push(aZhi+bZhi+'·地支六合');score+=1;max+=1;out.notes.push('日支'+aZhi+bZhi+'六合，亲密感强，相处黏得起来。');}
  else{max+=1;}
  const chong=(E.CHONG||{})[aZhi]===bZhi;
  if(chong){out.dims.push(aZhi+bZhi+'·地支六冲');max+=1;out.notes.push('日支'+aZhi+bZhi+'六冲，方向感相反，磨合期容易顶牛，需要刻意找共同节奏。');}
  else{max+=1;}
  /* 4) 年柱纳音 */
  const nA=pa.pillars[0],nB=pb.pillars[0];
  const nayinA=E.NAYIN?E.NAYIN[nA]:'';
  const nayinB=E.NAYIN?E.NAYIN[nB]:'';
  if(nayinA&&nayinB){
    out.dims.push(nayinA+'·'+nayinB+'·纳音');max+=1;
    const naWx=E.NAYIN_WX||{};
    const wa=naWx[nA]||'',wb=naWx[nB]||'';
    if(wa&&wb){
      if(wa===wb){score+=.8;out.notes.push('年柱纳音同为'+wa+'，两家根基同气息，大环境上比较对味。');}
      else if(wxSk[wa]&&wxSk[wa].生===wb){score+=.7;out.notes.push('年纳音'+wa+'生'+wb+'，先天缘分不错，长辈层面看着也顺眼。');}
      else if(wxSk[wb]&&wxSk[wb].生===wa){score+=.7;out.notes.push('年纳音'+wb+'生'+wa+'，TA的家族气场滋养你这边。');}
      else if(wxSk[wa]&&wxSk[wa].克===wb){score+=.3;out.notes.push('年纳音'+wa+'克'+wb+'，两家风格有点冲，但在小家庭里不见得是坏事。');}
      else{score+=.5;}
    }
  }
  /* 5) 喜用神互补 */
  const needA=pa.xiYong||[],needB=pb.xiYong||[];
  if(needA.length&&needB.length&&needB.some(w=>needA.includes(w))){out.dims.push('喜用互补');score+=.9;max+=1;out.notes.push('两人命里缺的元素正好能互相补，长线看是互相托底的那种。');}
  else if(needA.length&&needB.length){max+=1;out.notes.push('喜用神没有直接重叠，各自要补的不是同一个元素，好在也不算相冲。');}
  out.score=Math.round(score/max*100);
  return out;
}

/* ================= 合婚数据 + 双盘档案 ================= */
function renderHeHun(pa,pb,he){
  const score=he.score||0;
  const grade=score>=80?'上等 · 两心相契':score>=60?'中上 · 能处出默契':score>=45?'中等 · 需用心经营':'磨合是重点 · 缘在人为';
  let html='<h3>✦ 传统合婚 · '+esc(pairRel)+' ✦</h3>'
    +'<div style="text-align:center;padding:6px 0 2px">'
    +'<span style="font-size:2.2rem;color:#f0cf82;font-weight:600">'+score+'</span>'
    +'<span style="font-size:.82rem;color:#cfc6ea;letter-spacing:.12em;margin-left:8px">分 · '+esc(grade)+'</span></div>';
  if(he.dims&&he.dims.length){
    html+='<div style="text-align:center;margin:8px 0">'+he.dims.map(d=>'<span class="chip">'+esc(d)+'</span>').join('')+'</div>';
  }
  if(he.notes&&he.notes.length){
    html+='<div style="font-size:.82rem;line-height:1.95;margin-top:8px">'+he.notes.map(n=>'✧ '+esc(n)).join('<br>')+'</div>';
  }
  html+='<h3>双盘档案</h3>';
  html+=pairArchiveOne(pa,'第一位')+pairArchiveOne(pb,'第二位');
  return html;
}
function pairArchiveOne(p,lbl){
  const timeTxt=p.timeUnknown?'未知（按午时推演）':(''+p.hh+':'+String(p.mm).padStart(2,'0'));
  const rows=[
    [lbl+(p.name?' · '+p.name:''),''],
    ['公历',''+p.y+'年'+p.m+'月'+p.d+'日 '+timeTxt],
    ['出生地',p.cityUnknown?'未知（按东八区推演）':(p.inputCity||p.place||'—')],
    ['四柱',p.pillars.join(' ')],
    ['日主',p.dayMasterFull+'（'+(p.dmWx||'')+'）'],
    ['身强弱',p.strength],
    ['格局',p.pattern],
    ['喜用神',(p.xiYong||[]).join('、')],
    ['忌神',(p.jiYong||[]).join('、')],
    ['大运','虚岁'+Math.round((p.dy&&p.dy.startAge)||0)+'起运：'+((p.dy&&p.dy.steps)||[]).join(' → ')]
  ];
  return '<table>'+rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>').join('')+'</table>';
}

/* ================= 极简 MD→HTML ================= */
function mdToHtml(t){
  const blocks=[];
  t=t.replace(/```([\s\S]*?)```/g,(m,c)=>{blocks.push(c);return '\u0000BLOCK'+(blocks.length-1)+'\u0000';});
  let h=esc(t);
  h=h.replace(/^### (.*)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.*)$/gm,'<h3 style="margin-top:16px">$1</h3>');
  h=h.replace(/^# (.*)$/gm,'<h3>$1</h3>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/^- (.*)$/gm,'<p>· $1</p>');
  h=h.replace(/\n/g,'<br>');
  h=h.replace(/\u0000BLOCK(\d+)\u0000/g,(m,i)=>{
    const b=blocks[+i]||'';
    return '<pre style="font-family:ui-monospace,Consolas,monospace;font-size:.78rem;line-height:1.5;'
      +'background:rgba(240,207,130,.06);border:1px solid rgba(240,207,130,.18);border-radius:10px;'
      +'padding:10px 12px;overflow-x:auto;color:#e6e0f4;white-space:pre;margin:8px 0">'+esc(b)+'</pre>';
  });
  return h;
}

/* ================= 主流程：合盘推演 ================= */
let lastPair=null,pairBusy=false;
$('btnGo').onclick=async function(){
  if(pairBusy)return;
  const btn=this;
  let pa=null,pb=null,he=null;
  try{
    pairBusy=true;btn.disabled=true;btn.textContent='✦ 推 演 中 ✦';
    $('pairResult').style.display='none';
    pa=readOne('A');pb=readOne('B');
    he=calcHeHun(pa,pb);
    lastPair={a:pa,b:pb,he:he,rel:pairRel,now:(($('relNow')&&$('relNow').value.trim())||''),text:''};
    $('pairResult').style.display='block';
    $('pRel').textContent='『 '+pairRel+' 』';
    $('pText').innerHTML=''
      +renderPairGrid(pa,pb)
      +renderHeHun(pa,pb,he)
      +'<h3>✦ AI 合盘解读 · '+esc(pairRel)+' ✦</h3>'
      +'<div class="a-loading" id="pairAIWait"><span class="orb-ring"></span><span class="status-word">合婚先生正在推演两盘交集…</span></div>'
      +'<div id="pairAIText" style="display:none"></div>';
    $('pairNote').textContent='';
    const ai=await askPairAI(pa,pb,he);
    lastPair.text=ai||'';
    /* 善后存库 + 画像提取（与渲染分离，失败不覆盖正文） */
    autoSavePair(pa,pb,he,lastPair.text);
    $('pairNote').textContent='✦ 合盘完成 · 已自动存入记忆库';
  }catch(e){
    const t=$('pairAIText')||$('pText');
    if(t)t.innerHTML='<p style="color:#e87a7a">合盘推演失败：'+esc(String(e&&e.message||e).slice(0,120))+'</p>';
  }finally{
    pairBusy=false;btn.disabled=false;btn.textContent='✦ 合 盘 推 演 ✦';
  }
};

/* ================= AI 合盘解读 ================= */
function pairArchiveText(p){
  const timeTxt=p.timeUnknown?'未知（按午时推演）':(''+p.hh+':'+String(p.mm).padStart(2,'0'));
  return [
    '【'+p.name+' · '+(p.gender||'')+'】',
    '公历：'+p.y+'年'+p.m+'月'+p.d+'日 '+timeTxt,
    '出生地：'+(p.cityUnknown?'未知（按东八区）':(p.inputCity||'—')),
    '四柱：'+p.pillars.join(' '),
    '十神：'+p.tens.join(' '),
    '日主：'+p.dayMasterFull+'（'+(p.dmWx||'')+'）',
    '身强弱：'+p.strength,
    '格局：'+p.pattern,
    '喜用神：'+(p.xiYong||[]).join('、'),
    '忌神：'+(p.jiYong||[]).join('、'),
    '大运：虚岁'+Math.round((p.dy&&p.dy.startAge)||0)+'起运：'+((p.dy&&p.dy.steps)||[]).join(' → ')
  ].join('\n');
}
async function askPairAI(pa,pb,he){
  /* agent 记忆注入：画像 + 相关记忆（记忆库 v2 + 聊天记录） */
  let agentCtx='';
  if(typeof window.MemoryTools !== 'undefined' && window.MemoryTools.buildContext){
    try{ agentCtx=window.MemoryTools.buildContext((pa.name||'')+' 与 '+(pb.name||'')+' 的'+pairRel+'关系 八字合盘'); }catch(e){}
  }
  const relNow=(($('relNow')&&$('relNow').value.trim())||'');
  const HE_SPECIALTY='你是一位资深合婚先生，精通传统八字合婚（日主五行互补、天干五合、地支六合六冲、年柱纳音、喜用神互补），'
    +'人称"合婚先生"。你收到的是两位命主真实排盘的四柱八字（含十神、五行、格局、大运等）以及一份传统合婚的结构化评分。'
    +'请严格基于给出的命盘与合婚数据进行解读，绝不虚构或替换任何一柱一字。'
    +'【公正原则 · 最重要】合婚结果有好有坏，你必须完全按盘说话、不偏不倚：'
    +'盘面确实相合的地方（相生、六合、喜用互补、分数高），要大方、具体地肯定这段关系的好；'
    +'盘面确实有问题的地方（相克、六冲、喜用不互补、分数低），才直接、明确地指出问题与"没有好未来"的可能，甚至可以给出"缘分不强、宜止损"的结论。'
    +'绝对不要为了显得敢说而故意唱衰，也不要为了安慰用户而美化凶象。'
    +'好坏都要有具体命盘依据，该夸就夸，该泼冷水才泼冷水。'
    +'【必须覆盖的专项内容】\n'
    +'1. 缘起：结合两人日主五行关系与合婚评分，说清这段关系"为什么是TA"；\n'
    +'2. 相处模式：结合日支六合/六冲、十神配置，指出两人相处中最真实的化学反应与摩擦点；\n'
    +'3. 相处建议：给出 3~5 条具体可操作的相处建议（要贴合这对命盘的具体配置，不要万能套话）；\n'
    +'4. 关心点：若存在六冲、相克或喜用不互补，要直说这段关系最容易出问题的方向；\n'
    +'5. 可追问的问题：最后给出 2~3 个可以拿去问树洞或自己思考的问题。';
  const dataText=[
    '【第一位 · '+(pa.name||'')+'】',
    pairArchiveText(pa),
    '',
    '【第二位 · '+(pb.name||'')+'】',
    pairArchiveText(pb),
    '',
    '【传统合婚结果 · '+pairRel+'】',
    '合婚评分：'+he.score+'/100',
    '命中组合：'+((he.dims||[]).join('、')||'无'),
    '备注：'+((he.notes||[]).join('；')||'—'),
    '',
    '【关系类型】'+pairRel,
    (relNow?'【现在你们的关系（用户自述，请重点结合）】\n'+relNow:'')
  ].join('\n');
  /* 用通用模板组装：通用底座 + 合婚专属 + 数据 */
  let sys='';
  try{
    sys=window.AIPromptTemplate.buildAIPrompt({
      module:'八字合盘',
      role:HE_SPECIALTY,
      data:dataText
    });
  }catch(e){ sys='你是资深合婚先生，请基于以下双人命盘与传统合婚结果做深度解读：\n'+dataText; }
  /* 页面内思考状态：orb 思考环 + 状态文字 */
  const st=$('pairAIWait'),tx=$('pairAIText');
  if(st){st.className='a-loading';st.innerHTML=''
    +'<span class="orb-ring"></span><span class="status-word">合婚先生正在推演两盘交集…</span>';}
  if(tx)tx.style.display='block';
  let txt='',shown='';
  const renderEnd='<span class="caret"></span>';
  try{
    txt=await window.AIRelay.stream({
      temperature:.85,max_tokens:2200,
      messages:[{role:'system',content:sys},{role:'user',content:'请为「'+(pa.name||'')+'」与「'+(pb.name||'')+'」的「'+pairRel+'」关系做合盘深度解读。'
        +(relNow?'\n两人现在的真实状态是：'+relNow+'。请把这个现状当作最重要的现实线索，判断这段关系命盘上有没有"好未来"，该泼冷水就泼冷水。':'')
        +(agentCtx?'\n\n【记忆与画像】\n'+agentCtx:'')}],
      onDelta:(_c,total)=>{ shown=total;if(tx){tx.innerHTML=mdToHtml(shown)+renderEnd;} },
      onReason:(r)=>{
        const w=document.querySelector('#pairAIWait .status-word');
        if(w)w.textContent='合婚先生正在推演两盘交集……（已推理 '+r.length+' 字）';
      },
      onRetry:(tier,n)=>{ const w=document.querySelector('#pairAIWait .status-word'); if(w)w.textContent='🔄 '+tier+'连接中断，正在尝试重连（'+n+'/'+window.AIRelay.RETRY+'）…'; }
    });
    if(!txt)throw new Error('AI 无响应');
  }catch(err){
    if(st)st.style.display='none';
    if(tx)tx.innerHTML='<strong style="color:#ff9d9d">✕ 合盘解读在云间迷路了…</strong>'
      +'<p style="color:#cbc0ea;margin-top:8px">原因：'+esc(String(err&&err.message||'未知错误').slice(0,160))+'</p>'
      +'<p style="color:#8a81b8;margin-top:8px">请检查网络后重新点一次「合盘推演」。</p>';
    throw err;
  }
  /* 完成：清状态、去光标、定型 */
  if(st)st.style.display='none';
  if(tx)tx.innerHTML=mdToHtml(txt);
  return txt;
}

/* ================= 善后：自动存库 + 画像提取 ================= */
function autoSavePair(pa,pb,he,aiText){
  try{
    if(typeof HistoryManager !== 'undefined'&&typeof HistoryManager.saveSynastry==='function'){
      HistoryManager.saveSynastry({
        a:pa.name||'',
        b:pb.name||'',
        rel:pairRel,
        score:he.score||'',
        result:(aiText||'').slice(0,400)
      });
    }
  }catch(e){console.warn('合盘存库失败',e);}
  try{
    if(typeof window.TreeHole!=='undefined'&&window.TreeHole.extractProfileSilent){
      setTimeout(()=>{
        try{
          const relNow=(($('relNow')&&$('relNow').value.trim())||'');
          window.TreeHole.extractProfileSilent('想看「'+(pa.name||'')+'」与「'+(pb.name||'')+'」的「'+pairRel+'」八字合盘'+(relNow?'（'+relNow+'）':''), aiText||'');
        }catch(e){}
      },400);
    }
  }catch(e){console.warn('合盘画像提取失败',e);}
}

/* ================= 分享 / 去树洞 ================= */
function stripHtml(h){const d=document.createElement('div');d.innerHTML=h;return d.innerText||d.textContent||'';}
function fb(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
$('btnPairCopy').onclick=()=>{
  if(!lastPair||!lastPair.text){alert('先推演一次合盘');return;}
  const na=lastPair.a.name||'第一位',nb=lastPair.b.name||'第二位';
  const txt='【八字合盘 · '+lastPair.rel+'】\n'
    +(lastPair.now?'现在：'+lastPair.now+'\n':'')
    +na+' 四柱：'+lastPair.a.pillars.join(' ')+'\n'
    +nb+' 四柱：'+lastPair.b.pillars.join(' ')+'\n'
    +'合婚：'+lastPair.he.score+'分 · '+((lastPair.he.dims||[]).join('、')||'')+'\n\n'
    +stripHtml(lastPair.text).slice(0,600)+'\n\n—— 来自「有点困」八字合盘';
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>{alert('已复制合盘文字');}).catch(()=>{fb(txt);alert('已复制合盘文字');});
  }else{fb(txt);alert('已复制合盘文字');}
};
/* 去树洞聊聊：把本次合盘带入树洞，让它自然开场 */
$('btnHole').onclick=()=>{
  let subject='',summary='';
  try{
    if(lastPair){
      const na=lastPair.a.name||'',nb=lastPair.b.name||'';
      subject=(na||'')+' 与 '+(nb||'')+' 的「'+(lastPair.rel||'关系')+'」八字合盘';
      summary=lastPair.text||'';
    }
  }catch(e){}
  try{
    if(window.TreeHole&&window.TreeHole.setOpening)window.TreeHole.setOpening({scene:'八字合盘',subject:subject,summary:summary.slice(0,300)});
  }catch(e){}
  location.href='../../treehole/';
};
