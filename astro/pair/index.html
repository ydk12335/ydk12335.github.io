<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星座配对 · 有点困</title>
<style>
:root{--gold:#f0cf82;--gold-dim:#a9956a;--ivory:#f2ede0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Songti SC","Noto Serif SC",serif;color:var(--ivory);background:#05030f;overflow-x:hidden}
canvas#stars{position:fixed;inset:0;z-index:0}
.btn-back{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;z-index:10;
  background:rgba(20,12,44,.55);border:1px solid rgba(240,207,130,.3);color:#e8dcc0;
  border-radius:999px;padding:8px 18px;font-size:.8rem;letter-spacing:.15em;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:inherit}
.portal{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;
  align-items:center;text-align:center;padding:clamp(64px,11vh,96px) 20px 30px}
.kicker{font-size:.68rem;letter-spacing:.42em;text-indent:.42em;color:var(--gold-dim)}
.p-title{font-size:clamp(1.7rem,6.4vw,2.5rem);letter-spacing:.3em;text-indent:.3em;font-weight:600;
  color:var(--ivory);text-shadow:0 0 30px rgba(240,207,130,.25);margin-top:8px}
.p-sub{margin-top:10px;font-size:.8rem;letter-spacing:.22em;color:#e8b48f}
/* 双人选择（自定义宫格选择器，兼容所有手机浏览器） */
.pair-sel{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:clamp(26px,5vh,44px);
  width:min(520px,94vw)}
.p-sel{flex:1;cursor:pointer;user-select:none;-webkit-user-select:none;
  background:rgba(255,255,255,.04);color:#f0ead8;
  border:1px solid rgba(240,207,130,.35);border-radius:999px;padding:13px 10px;
  font-family:inherit;font-size:.92rem;text-align:center;transition:.2s}
.p-sel:active{border-color:rgba(240,207,130,.7);background:rgba(240,207,130,.08)}
.p-sel .sel-sym{font-size:1.15rem;color:#f2d488;margin-right:6px;text-shadow:0 0 10px rgba(240,207,130,.4)}
.pair-sel .px{color:var(--gold);font-size:1.3rem;text-shadow:0 0 12px rgba(240,207,130,.5);flex:none}
/* 星座宫格弹层 */
#signGrid{position:fixed;inset:0;z-index:70;background:rgba(3,1,14,.82);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:20px}
#signGrid.open{display:flex}
.sg-card{width:min(420px,94%);background:linear-gradient(155deg,rgba(255,255,255,.08),rgba(255,255,255,.025));
  border:1px solid rgba(240,207,130,.28);border-radius:20px;padding:22px 16px;
  box-shadow:0 22px 56px rgba(4,2,18,.5);text-align:center}
.sg-card h3{color:var(--gold);letter-spacing:.24em;text-indent:.24em;font-size:.92rem;margin-bottom:14px}
.sg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sg-it{cursor:pointer;border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:11px 4px;
  background:rgba(255,255,255,.03);transition:.2s}
.sg-it .s-sym{font-size:1.3rem;color:#f2d488;display:block;text-shadow:0 0 10px rgba(240,207,130,.4)}
.sg-it .s-name{font-size:.74rem;color:#e9e3ff;letter-spacing:.05em}
.sg-it:active{border-color:rgba(240,207,130,.6);background:rgba(240,207,130,.08);transform:scale(.95)}
.sg-cancel{margin-top:14px;font-size:.74rem;color:#8a81b8;cursor:pointer;letter-spacing:.15em}
.btn-gold{margin-top:clamp(24px,4.5vh,38px);cursor:pointer;border-radius:999px;
  padding:14px 46px;font-size:.98rem;letter-spacing:.3em;text-indent:.3em;
  font-family:inherit;font-weight:600;color:#fffbef;position:relative;overflow:hidden;isolation:isolate;
  background:linear-gradient(165deg,rgba(255,238,196,.32),rgba(240,207,130,.08) 44%,rgba(198,150,74,.18)),linear-gradient(#160c33,#160c33);
  border:1px solid rgba(240,207,130,.4);transition:.25s}
.btn-gold:disabled{opacity:.5;cursor:default}
.btn-gold:active{transform:scale(.96)}
.pair-note{font-size:.72rem;color:#8a81b8;min-height:1.5em;margin-top:14px;letter-spacing:.08em}
/* 结果 */
#pairResult{width:min(560px,94vw);margin-top:clamp(22px,4vh,36px);display:none}
.p-head{display:flex;align-items:center;justify-content:center;gap:12px;
  font-size:1.1rem;color:#e9e3ff;letter-spacing:.1em;margin-bottom:8px}
.p-head .ps{font-size:1.6rem;color:#f2d488;text-shadow:0 0 12px rgba(240,207,130,.5)}
.p-score{text-align:center;color:var(--gold);font-size:.98rem;letter-spacing:.16em;margin-bottom:14px;
  text-shadow:0 0 14px rgba(240,207,130,.3)}
.a-card{background:rgba(255,255,255,.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:clamp(14px,3vw,22px);
  box-shadow:0 14px 40px rgba(4,2,18,.4);line-height:1.95;font-size:.9rem;color:#e6e0f4;text-align:left}
.a-card strong{color:#ffe4ab;font-weight:600}
.p-foot{text-align:center;font-size:.66rem;color:#8f86b8;margin-top:12px;letter-spacing:.05em}
.pair-share{display:flex;gap:10px;justify-content:center;margin-top:14px}
.soon-pill{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  padding:11px 22px;border-radius:999px;font-size:.82rem;color:#f0ead8;letter-spacing:.08em;
  border:1px solid rgba(240,207,130,.28);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.012));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:inherit;text-decoration:none;transition:.25s}
.soon-pill:active{transform:scale(.95)}
#shotModal{position:fixed;inset:0;z-index:50;background:rgba(3,1,14,.86);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px}
#shotModal.show{display:flex}
#shotImg{max-width:92vw;max-height:70vh;border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.6)}
.shot-tip{font-size:.75rem;color:#b5abd8;letter-spacing:.1em}
/* 人物信息卡（选填） */
.info-card{width:min(520px,94vw);margin:18px auto 0;background:rgba(255,255,255,.04);
  border:1px dashed rgba(240,207,130,.3);border-radius:18px;padding:14px 16px 16px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-align:left}
.info-card .ic-title{font-size:.72rem;color:#c9b98a;letter-spacing:.2em;text-align:center;margin-bottom:10px}
.info-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.info-row .who{flex:none;width:58px;font-size:.78rem;color:#f2d488;letter-spacing:.08em;text-align:right}
.info-row input{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid rgba(240,207,130,.22);
  border-radius:10px;padding:9px 12px;color:#f0ead8;font-family:inherit;font-size:.88rem;outline:none;
  color-scheme:dark;transition:.2s}
.info-row input:focus{border-color:rgba(240,207,130,.6);background:rgba(240,207,130,.06)}
.info-row input::placeholder{color:#7d74a8;font-size:.8rem}
.info-row input[type=date]{max-width:46%}
.dp-btn{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid rgba(240,207,130,.3);
  background:rgba(240,207,130,.08);cursor:pointer;font-size:1rem;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:.2s;padding:0}
.dp-btn:active{background:rgba(240,207,130,.2);transform:scale(.93)}
/* 隐私开关 */
.privacy-bar{width:min(520px,94vw);margin:12px auto 0;display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:.76rem;color:#a99dd6;user-select:none;-webkit-user-select:none}
.privacy-bar .pv-chip{cursor:pointer;padding:7px 16px;border-radius:999px;
  border:1px solid rgba(190,170,255,.28);transition:.2s;letter-spacing:.06em}
.privacy-bar .pv-chip.on{border-color:rgba(240,207,130,.6);color:#f2d488;background:rgba(240,207,130,.1);
  text-shadow:0 0 8px rgba(240,207,130,.3)}
.a-loading{display:flex;align-items:center;justify-content:center;gap:12px;color:#c9c0e8;padding:26px 0}
.orb-ring{position:relative;width:20px;height:20px;flex:none}
.orb-ring::before{content:"";position:absolute;inset:0;border-radius:50%;
  border:1.5px solid rgba(240,207,130,.25);border-top-color:var(--gold);animation:orbSpin 1.1s linear infinite}
.orb-ring::after{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.5rem;color:var(--gold);animation:orbGlow 2.2s ease-in-out infinite}
@keyframes orbSpin{to{transform:rotate(360deg)}}
@keyframes orbGlow{0%,100%{opacity:.4}50%{opacity:1;text-shadow:0 0 10px rgba(240,207,130,.8)}}
.p-foot{font-size:.72rem;letter-spacing:.3em;text-indent:.3em;color:#6f66a0;margin-top:auto;padding-top:30px}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<button class="btn-back" id="btnBack">⌂ 首页</button>

<div class="portal">
  <header>
    <div class="kicker">SYNASTRY</div>
    <h1 class="p-title">星 座 配 对</h1>
    <p class="p-sub">✦ 两颗星辰的相遇，自有它的轨迹 ✦</p>
  </header>

  <div class="pair-sel">
    <div class="p-sel" id="selA"><span class="sel-sym"></span><span class="sel-name">选择星座</span></div>
    <span class="px">✕</span>
    <div class="p-sel" id="selB"><span class="sel-sym"></span><span class="sel-name">选择星座</span></div>
  </div>

  <div class="info-card">
    <div class="ic-title">✧ 补充信息 · 选填 ✧</div>
    <div class="info-row">
      <span class="who">TA的名字</span>
      <input id="nameA" type="text" maxlength="12" placeholder="称呼即可，如：小星">
    </div>
    <div class="info-row">
      <span class="who">TA的生日</span>
      <input id="birthA" type="text" inputmode="numeric" maxlength="10" placeholder="可手动输入，如 2001-08-16">
      <button type="button" class="dp-btn" id="dpA" title="选择日期">📅</button>
      <input type="date" id="birthApick" style="display:none" max="2025-12-31">
    </div>
    <div class="info-row">
      <span class="who">TA的名字</span>
      <input id="nameB" type="text" maxlength="12" placeholder="称呼即可，如：阿月">
    </div>
    <div class="info-row">
      <span class="who">TA的生日</span>
      <input id="birthB" type="text" inputmode="numeric" maxlength="10" placeholder="可手动输入，如 1999-12-03">
      <button type="button" class="dp-btn" id="dpB" title="选择日期">📅</button>
      <input type="date" id="birthBpick" style="display:none" max="2025-12-31">
    </div>
  </div>

  <button class="btn-gold" id="btnGo">开始配对</button>
  <div class="pair-note" id="pairNote">选择两个星座，由观星师推演你们的星座关系</div>

  <section id="pairResult">
    <div class="p-head" id="pHead"></div>
    <div class="p-score" id="pScore"></div>
    <div class="a-card" id="pText"></div>
    <div class="p-foot">配对由 AI 观星师即兴推演 · 仅供娱乐参考</div>
    <div class="pair-share">
      <button class="soon-pill" id="btnPairCopy">📋 文字分享</button>
      <button class="soon-pill" id="btnPairShot">📸 生成分享图</button>
    </div>
    <div class="privacy-bar" id="privacyBar">
      <span class="pv-chip" id="pvName">🙈 隐藏姓名</span>
    </div>
  </section>

  <footer class="p-foot">‥ 有点困 ‥</footer>
</div>

<div id="signGrid">
  <div class="sg-card">
    <h3 id="sgTitle">✦ 选择星座 ✦</h3>
    <div class="sg-grid" id="sgGrid"></div>
    <div class="sg-cancel" id="sgCancel">—— 取消 ——</div>
  </div>
</div>

<div id="shotModal">
  <img id="shotImg" alt="分享图">
  <div class="shot-tip">长按图片保存 / 分享</div>
  <button class="soon-pill" id="shotClose" style="padding:10px 30px">关 闭</button>
</div>

<script>
/* ================= 基础配置 ================= */
const API_BASE='https://apihub.agnes-ai.cn/v1';
const API_KEY='sk-bnT8gvJweewxMFO2oOnzNof2qpqazpKYq1spx5EulZ11vfyZ';
const MODEL='agnes-2.5-flash';
const SIGNS=[
  ['白羊座','♈','火象 · 守护火星','行动力强、热情直率、敢于争先'],
  ['金牛座','♉','土象 · 守护金星','踏实稳健、重质感、审美与耐心俱佳'],
  ['双子座','♊','风象 · 守护水星','思维敏捷、好奇善沟通、点子多'],
  ['巨蟹座','♋','水象 · 守护月亮','情感细腻、念家重情、直觉敏锐'],
  ['狮子座','♌','火象 · 守护太阳','自信热情、重面子、有领导魅力'],
  ['处女座','♍','土象 · 守护水星','细致追求完美、条理清晰、注重健康'],
  ['天秤座','♎','风象 · 守护金星','重视平衡美感、善于协调、待人温和'],
  ['天蝎座','♏','水象 · 守护冥王星','深沉有洞察力、专注执着、爱憎分明'],
  ['射手座','♐','火象 · 守护木星','乐观爱自由、爱探索、讲求信念'],
  ['摩羯座','♑','土象 · 守护土星','坚韧务实、目标感强、可靠有担当'],
  ['水瓶座','♒','风象 · 守护天王星','独立创新、思维超前、重视友情'],
  ['双鱼座','♓','水象 · 守护海王星','感性浪漫、想象力丰富、富同理心']
];
const $=id=>document.getElementById(id);
/* 自定义星座选择器：点选择框弹 12 宫格 */
let selState={selA:0,selB:7},gridTarget=null;
function renderSel(id){
  const s=SIGNS[selState[id]];
  $(id).querySelector('.sel-sym').textContent=s[1];
  $(id).querySelector('.sel-name').textContent=s[0];
}
['selA','selB'].forEach(id=>{
  renderSel(id);
  $(id).onclick=()=>{
    gridTarget=id;
    $('sgTitle').textContent=id==='selA'?'✦ 选择第一位 ✦':'✦ 选择第二位 ✦';
    $('signGrid').classList.add('open');
  };
});
/* 生成宫格 */
SIGNS.forEach((s,i)=>{
  const d=document.createElement('div');d.className='sg-it';
  d.innerHTML='<span class="s-sym">'+s[1]+'</span><span class="s-name">'+s[0]+'</span>';
  d.onclick=()=>{
    selState[gridTarget]=i;renderSel(gridTarget);
    $('signGrid').classList.remove('open');
  };
  $('sgGrid').appendChild(d);
});
$('sgCancel').onclick=()=>$('signGrid').classList.remove('open');
$('signGrid').onclick=e=>{if(e.target.id==='signGrid')$('signGrid').classList.remove('open');};

/* ================= 动态粒子星盘背景（与观星页一致） ================= */
const cv=document.getElementById('stars'),cx=cv.getContext('2d');
const CHART_NAMES=['天鹅座','天琴座','仙后座','猎户座','飞马座','天龙座','南十字','大熊座','仙女座','天鹰座','波江座','长蛇座'];
let chart=null;
function buildChart(){
  const DPR=Math.min(devicePixelRatio||1,2);
  cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;
  const R=Math.min(cv.width,cv.height)*.42;
  const cx0=cv.width/2,cy0=cv.height/2;
  const n=7+Math.floor(Math.random()*4);
  const nodes=[],links=[];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*R*.88;
    nodes.push({x:Math.cos(a)*r,y:Math.sin(a)*r,r:(2.4+Math.random()*2)*DPR,p:Math.random()*7});
  }
  for(let i=1;i<n;i++)links.push([i-1,i]);
  for(let i=2;i<n;i++)if(Math.random()<.6)links.push([Math.floor(Math.random()*(i-1)),i]);
  chart={cx:cx0,cy:cy0,R,nodes,links,
    name:CHART_NAMES[Math.floor(Math.random()*CHART_NAMES.length)],
    rot:0,rotV:.00025+Math.random()*.0002,
    starsBg:Array.from({length:130},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,
      r:(Math.random()*1.1+.25)*DPR,p:Math.random()*7,s:.3+Math.random()*.8})),
    dust:Array.from({length:24},()=>({li:Math.floor(Math.random()*links.length),t:Math.random(),v:.0012+Math.random()*.002}))};
}
buildChart();addEventListener('resize',buildChart);
const DPR=Math.min(devicePixelRatio||1,2);
function tick(t){
  cx.clearRect(0,0,cv.width,cv.height);
  for(const s of chart.starsBg){
    cx.globalAlpha=.3+.35*Math.abs(Math.sin(t*.001*s.s+s.p));
    cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill();
  }
  chart.rot+=chart.rotV;
  cx.save();cx.translate(chart.cx,chart.cy);cx.rotate(chart.rot);
  cx.globalAlpha=.10;cx.strokeStyle='rgba(240,207,130,.9)';cx.lineWidth=1;
  cx.beginPath();cx.arc(0,0,chart.R,0,7);cx.stroke();
  cx.globalAlpha=.05;cx.beginPath();cx.arc(0,0,chart.R*.82,0,7);cx.stroke();
  cx.globalAlpha=.5;
  cx.strokeStyle='rgba(190,170,255,.35)';cx.lineWidth=1*DPR;
  for(const[a,b]of chart.links){cx.beginPath();cx.moveTo(chart.nodes[a].x,chart.nodes[a].y);cx.lineTo(chart.nodes[b].x,chart.nodes[b].y);cx.stroke();}
  for(const nd of chart.nodes){
    cx.globalAlpha=.55+.35*Math.sin(t*.0016+nd.p);
    cx.fillStyle='#fdf6e0';cx.beginPath();cx.arc(nd.x,nd.y,nd.r,0,7);cx.fill();
    cx.globalAlpha=.12+.1*Math.sin(t*.002+nd.p);
    cx.beginPath();cx.arc(nd.x,nd.y,nd.r*3,0,7);cx.fill();
  }
  cx.globalAlpha=.35;cx.fillStyle='#e8dcc0';cx.font=(10*Math.min(devicePixelRatio||1,2))+'px serif';
  cx.textAlign='center';cx.fillText('✦ '+chart.name+' ✦',0,-chart.R-14*Math.min(devicePixelRatio||1,2));
  cx.restore();
  /* 星尘沿连线漂移 */
  for(const d of chart.dust){
    const[a,b]=chart.links[d.li];d.t+=d.v;if(d.t>1)d.t=0;
    const A=chart.nodes[a],B=chart.nodes[b];
    const x=A.x+(B.x-A.x)*d.t,y=A.y+(B.y-A.y)*d.t;
    cx.globalAlpha=.5*Math.sin(d.t*Math.PI);cx.fillStyle='#ffe9b8';
    cx.beginPath();cx.arc(x,y,1.2*Math.min(devicePixelRatio||1,2),0,7);cx.fill();
  }
  cx.globalAlpha=1;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ================= AI 配对推演 ================= */
const PAIR_SYS='你是一位资深华人占星师「月下观星师」，擅长从古典占星与元素互动的角度推演两个星座之间的关系。请结合两个星座各自的【元素】【守护星】【核心性格特质】进行有温度、有洞察的配对解读，避免任何星座都能套用的万能文案。'+
  '输出格式（使用简体中文，总长450~650字）：\n'+
  '第一行单独输出匹配指数，格式严格为：匹配指数：NN%（NN为60~98之间的整数）\n'+
  '然后用小标题分节：\n'+
  '## 星辰引力\n（两人之间的天然吸引与契合点，2~3句）\n'+
  '## 月有阴晴\n（可能的摩擦与需要磨合之处，2~3句，语气温和不说教）\n'+
  '## 相处建议\n（给两人具体可行的相处提示，2~3条）\n'+
  '最后另起一行给一句「星语」——一句只属于这对组合的诗意短句（不超过28字），格式为：> 星语：……';
function miniMD(t){
  t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return t
    .replace(/^> ?星语：(.*)$/gm,'<p style="text-align:center;color:#f2d488;letter-spacing:.06em;margin-top:12px">✦ $1 ✦</p>')
    .replace(/\n/g,'<br>');
}
/* 日期选择按钮：点 📅 弹原生日期选择 */
  for(const s of ['A','B']){
    const pick=$('birth'+s+'pick'),btn=$('dp'+s),txt=$('birth'+s);
    btn.onclick=()=>{if(pick.showPicker)pick.showPicker();else pick.click();};
    pick.onchange=()=>{if(pick.value)txt.value=pick.value;};
  }
  /* 手输日期宽松解析：接受 2001-08-16 / 2001.8.16 / 2001/8/16 / 20010816 等 */
  function parseDate(str){
    const m=(str||'').trim().match(/^(\d{4})[年./\-\/]?(\d{1,2})[月./\-\/]?(\d{1,2})日?$/);
    if(!m)return null;
    const y=+m[1],mo=+m[2],d=+m[3];
    if(mo<1||mo>12||d<1||d>31||y<1900||y>2025)return null;
    return {y,mo,d};
  }
  /* 读取选填信息 */
  function readInfo(suffix){
    const n=($('name'+suffix).value||'').trim();
    const dt=parseDate($('birth'+suffix).value);
    let part='';
    if(n)part+='，名字/称呼：「'+n+'」';
    if(dt)part+='，生日：'+dt.y+'年'+dt.mo+'月'+dt.d+'日（'+dt.y+'年生，现约'+(new Date().getFullYear()-dt.y)+'岁）';
    return part;
  }
  /* 隐私开关 */
  let hideName=false;
  $('pvName').onclick=()=>{
    hideName=!hideName;
    $('pvName').classList.toggle('on',hideName);
    $('pvName').textContent=hideName?'🐵 显示姓名':'🙈 隐藏姓名';
  };
  function dispName(name,fallback){return hideName?(fallback+'座'):(name||fallback);}
let pairBusy=false,lastPair=null;
$('btnGo').onclick=async()=>{
  if(pairBusy)return;
  const a=SIGNS[selState.selA],b=SIGNS[selState.selB];
  const nameA=($('nameA').value||'').trim(),nameB=($('nameB').value||'').trim();
  pairBusy=true;$('btnGo').disabled=true;
  $('pairNote').textContent='🌙 观星师正在推演两颗星辰的轨迹……';
  $('pairResult').style.display='block';
    $('pHead').innerHTML='<span class="ps">'+a[1]+'</span><b>'+(nameA||a[0])+'</b><span style="color:var(--gold)">✕</span><b>'+(nameB||b[0])+'</b><span class="ps">'+b[1]+'</span>';
  $('pScore').textContent='';
  $('pText').innerHTML='<div class="a-loading"><span class="orb-ring"></span><span>✦ 两颗星辰正在相互靠近……</span></div>';
  try{
    const d=new Date(),wk=['日','一','二','三','四','五','六'][d.getDay()];
    const res=await fetch(API_BASE+'/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
      body:JSON.stringify({model:MODEL,messages:[{role:'system',content:PAIR_SYS},
        {role:'user',content:'请推演「'+a[0]+'」（'+a[2]+'，核心性格特质：'+a[3]+'）与「'+b[0]+'」（'+b[2]+'，核心性格特质：'+b[3]+'）之间的星座关系（爱情/友情/搭档均可涵盖，以感情关系为主）。今天日期：'+d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 周'+wk+'。请严格贴合两个星座各自的特质，避免通用套话。'}],temperature:.8,max_tokens:1500})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const j=await res.json();
    const raw=(j.choices[0].message.content||'').trim();
    const m=raw.match(/匹配指数[：:]\s*(\d{1,3})\s*%/);
    $('pScore').textContent=m?('✦ 匹配指数 '+m[1]+'% ✦'):'';
    $('pText').innerHTML=miniMD(raw.replace(/^匹配指数[：:].*$/m,'').trim());
    lastPair={a:a[0],as:a[1],b:b[0],bs:b[1],na:nameA,nb:nameB,score:m?m[1]+'%':'',text:raw,date:d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wk};
    $('pairNote').textContent='✦ 推演完成，可分享这份星辰缘分';
  }catch(e){
    $('pText').innerHTML='<strong style="color:#ff9d9d">✕ 观星信号中断了…</strong><br><span style="font-size:.85rem;color:#b5abd8">请检查网络后再试一次</span>';
    $('pairNote').textContent='';
  }
  pairBusy=false;$('btnGo').disabled=false;
};

/* ================= 分享 ================= */
$('btnPairCopy').onclick=async()=>{
  if(!lastPair)return;
  const txt='✦ 星座配对 · 月下观星 ✦\n'+lastPair.as+' '+dispName(lastPair.na,lastPair.a)+' ✕ '+lastPair.b+' '+dispName(lastPair.nb,lastPair.b)+
    (lastPair.score?'\n匹配指数：'+lastPair.score:'')+'\n\n'+lastPair.text.replace(/^匹配指数[：:].*$/m,'').replace(/^#+\s*/gm,'').replace(/\*\*/g,'')+
    '\n\n—— 来自「有点困」\n🌙 在线配对：https://ydk12335.github.io/astro/pair/';
  try{
    if(navigator.share){await navigator.share({title:'星座配对 · '+dispName(lastPair.na,lastPair.a)+'✕'+dispName(lastPair.nb,lastPair.b),text:txt});return;}
    await navigator.clipboard.writeText(txt);
    $('btnPairCopy').textContent='✓ 已复制，去粘贴吧';
    setTimeout(()=>$('btnPairCopy').textContent='📋 文字分享',2000);
  }catch(e){}
};
function drawPairCard(){
  const W=720,H=1080,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');
  const bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0620');bg.addColorStop(.55,'#0d0a26');bg.addColorStop(1,'#1a0f2e');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  for(let i=0;i<130;i++){
    g.globalAlpha=.25+Math.random()*.55;g.fillStyle='#fff';
    g.beginPath();g.arc(Math.random()*W,Math.random()*H,Math.random()*1.4+.3,0,7);g.fill();
  }
  g.globalAlpha=1;
  /* 中央双环相扣 */
  g.strokeStyle='rgba(240,207,130,.4)';g.lineWidth=1.5;
  g.beginPath();g.arc(W/2-52,220,96,0,7);g.stroke();
  g.beginPath();g.arc(W/2+52,220,96,0,7);g.stroke();
  g.strokeStyle='rgba(240,207,130,.2)';
  g.beginPath();g.arc(W/2-52,220,74,0,7);g.stroke();
  g.beginPath();g.arc(W/2+52,220,74,0,7);g.stroke();
  /* 标题 */
  g.textAlign='center';
  g.fillStyle='#a9956a';g.font='22px serif';g.fillText('· 星 座 配 对 ·',W/2,78);
  g.fillStyle='#f0cf82';g.font='600 46px "Songti SC","Noto Serif SC",serif';
  g.fillText(lastPair.as+' '+dispName(lastPair.na,lastPair.a)+' ✕ '+lastPair.b,W/2,400);
  g.fillStyle='#8f86b8';g.font='22px serif';g.fillText(lastPair.date,W/2,442);
  if(lastPair.score){g.fillStyle='#f2d488';g.font='600 34px serif';g.fillText('✦ 匹配指数 '+lastPair.score+' ✦',W/2,492);}
  /* 正文摘要 */
  const lines=lastPair.text.replace(/^匹配指数[：:].*$/m,'').replace(/^#+.*$/gm,'').replace(/\*\*/g,'').split('\n')
    .map(s=>s.trim()).filter(Boolean).slice(0,9);
  g.font='24px "Songti SC","Noto Serif SC",serif';g.fillStyle='#e6e0f4';
  let y=560;
  for(const ln of lines){
    let s=ln;if(s.length>20)s=s.slice(0,19)+'…';
    g.fillText(s,W/2,y);y+=40;
  }
  const star=lastPair.text.match(/星语[：:]\s*(.+)/);
  if(star){
    g.fillStyle='#f2d488';g.font='italic 26px serif';
    let s=star[1].trim();if(s.length>18)s=s.slice(0,17)+'…';
    g.fillText('✦ '+s+' ✦',W/2,H-190);
  }
  g.fillStyle='#6f66a0';g.font='20px serif';
  g.fillText('‥ 有点困 · AI 观星即兴推演 ‥',W/2,H-96);
  return c;
}
$('btnPairShot').onclick=()=>{
  if(!lastPair)return;
  $('shotImg').src=drawPairCard().toDataURL('image/png');
  $('shotModal').classList.add('show');
};
$('shotClose').onclick=()=>$('shotModal').classList.remove('show');
$('shotModal').onclick=e=>{if(e.target.id==='shotModal')$('shotModal').classList.remove('show');};
$('btnBack').onclick=()=>location.href='../';
</script>
