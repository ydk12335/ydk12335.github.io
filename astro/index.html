<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>观星 · 有点困</title>
<style>
:root{--gold:#f0cf82;--gold-dim:#a9956a;--ivory:#f2ede0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Songti SC","Noto Serif SC",serif;color:var(--ivory);
  background:#05030f;overflow-x:hidden}
canvas#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.aurora i{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none}
.aurora i:nth-child(1){width:48vmax;height:48vmax;left:-14%;top:-18%;
  background:radial-gradient(circle,rgba(120,96,220,.13),transparent 60%);animation:drift1 37s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:40vmax;height:40vmax;right:-12%;top:32%;
  background:radial-gradient(circle,rgba(60,140,200,.10),transparent 58%);animation:drift2 45s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:44vmax;height:44vmax;left:18%;bottom:-30%;
  background:radial-gradient(circle,rgba(255,188,118,.06),transparent 58%);animation:drift3 39s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(9vw,7vh,0) scale(1.13) rotate(24deg)}}
@keyframes drift2{to{transform:translate3d(-8vw,-6vh,0) scale(1.08) rotate(-18deg)}}
@keyframes drift3{to{transform:translate3d(6vw,-5vh,0) scale(1.14)}}
.astro-view{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;
  justify-content:space-evenly;max-width:600px;margin:0 auto;padding:clamp(18px,4vh,36px) 20px;text-align:center}
.astro-top{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:5}
.btn-back{background:rgba(255,255,255,.07);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.14);color:#d8d0ef;border-radius:999px;padding:8px 18px;
  font-size:.82rem;letter-spacing:.1em;cursor:pointer;font-family:inherit;transition:.25s}
.btn-back:active{transform:scale(.95)}
.kicker{font-size:.68rem;letter-spacing:.42em;text-indent:.42em;color:var(--gold-dim)}
.a-title{font-size:clamp(1.7rem,6vw,2.3rem);letter-spacing:.24em;text-indent:.24em;font-weight:600;
  color:var(--gold);text-shadow:0 0 24px rgba(240,207,130,.35);margin-top:6px}
.a-sub{font-size:.78rem;color:#b5abd8;letter-spacing:.14em;margin-top:8px}
.a-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.a-cell{cursor:pointer;position:relative;overflow:hidden;border-radius:18px;padding:16px 4px 12px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:linear-gradient(155deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .3s,border-color .3s,box-shadow .3s}
.a-cell::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 0%,rgba(240,207,130,.18),transparent 70%);opacity:0;transition:opacity .35s}
.a-cell:hover{transform:translateY(-3px) scale(1.03);border-color:rgba(240,207,130,.55);box-shadow:0 12px 30px rgba(240,207,130,.14)}
.a-cell:hover::before{opacity:1}
.a-cell:active{transform:translateY(0) scale(.96)}
.a-cell.on{border-color:rgba(240,207,130,.7);box-shadow:0 10px 28px rgba(240,207,130,.16)}
.a-cell .h-sym{font-size:2rem;line-height:1;color:#f2d488;text-shadow:0 0 14px rgba(240,207,130,.45),0 1px 3px rgba(0,0,0,.5)}
.a-cell .h-name{font-size:.82rem;letter-spacing:.05em}
.a-cell .h-range{font-size:.6rem;color:#8f86b8;letter-spacing:.02em}
.a-result{margin-top:4px;text-align:left}
.a-now{display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.1rem;letter-spacing:.12em;color:#e9e3ff;margin-bottom:12px}
.a-now .h-now-sym{font-size:1.5rem;color:#f2d488;text-shadow:0 0 12px rgba(240,207,130,.5)}
.a-now .h-now-range{font-size:.78rem;color:#8f86b8;letter-spacing:.04em}
.a-card{background:rgba(255,255,255,.06);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:clamp(16px,3vw,24px);
  box-shadow:0 14px 40px rgba(4,2,18,.4),inset 0 1px 0 rgba(255,255,255,.08);line-height:1.95;font-size:.93rem;color:#e6e0f4}
.a-card h3{color:var(--gold);font-size:1.02rem;margin:16px 0 6px;letter-spacing:.08em}
.a-card h3:first-child{margin-top:0}
.a-card p{margin:8px 0}
.a-card ul{margin:6px 0;padding-left:20px}
.a-card li{margin:3px 0}
.a-card strong{color:#ffe4ab;font-weight:600}
.a-foot{text-align:center;font-size:.7rem;color:#8f86b8;margin-top:14px;letter-spacing:.05em;text-align:center}
.a-loading{display:flex;align-items:center;justify-content:center;gap:12px;color:#c9c0e8}
.orb-ring{position:relative;width:20px;height:20px;flex:none}
.orb-ring::before{content:"";position:absolute;inset:0;border-radius:50%;
  border:1.5px solid rgba(240,207,130,.25);border-top-color:var(--gold);animation:orbSpin 1.1s linear infinite}
.orb-ring::after{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.5rem;color:var(--gold);animation:orbGlow 2.2s ease-in-out infinite}
@keyframes orbSpin{to{transform:rotate(360deg)}}
@keyframes orbGlow{0%,100%{opacity:.4;text-shadow:0 0 4px rgba(240,207,130,.3)}50%{opacity:1;text-shadow:0 0 10px rgba(240,207,130,.8)}}
.caret{display:inline-block;width:9px;height:1.05em;background:var(--gold);vertical-align:-2px;margin-left:4px;
  box-shadow:0 0 10px rgba(240,207,130,.85);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.a-foot-page{font-size:.72rem;letter-spacing:.3em;color:#6f66a0}
@media(max-width:420px){.a-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="aurora"><i></i><i></i><i></i></div>

<div class="astro-top"><button class="btn-back" id="btnBack">← 返回</button></div>

<div class="astro-view">
  <header>
    <div class="kicker">ASTROLOGY</div>
    <h1 class="a-title">观 星</h1>
    <div class="a-sub" id="aDate"></div>
  </header>

  <div class="a-grid" id="aGrid"></div>

  <section class="a-result" id="aResult" style="display:none">
    <div class="a-now" id="aNow"></div>
    <div class="a-card" id="aText"></div>
    <div class="a-foot">运势由 AI 占星师即兴推演 · 仅供娱乐参考</div>
  </section>

  <footer class="a-foot-page">‥ 有点困 ‥</footer>
</div>

<script>
/* ================= 基础配置 ================= */
const API_BASE='https://apihub.agnes-ai.cn/v1';
const API_KEY='sk-bnT8gvJweewxMFO2oOnzNof2qpqazpKYq1spx5EulZ11vfyZ';
const MODEL='agnes-2.5-flash';

const SIGNS=[
  ['白羊座','♈','3.21-4.19','火象 · 守护火星','行动力强、热情直率、敢于争先'],
  ['金牛座','♉','4.20-5.20','土象 · 守护金星','踏实稳健、重质感、审美与耐心俱佳'],
  ['双子座','♊','5.21-6.21','风象 · 守护水星','思维敏捷、好奇善沟通、点子多'],
  ['巨蟹座','♋','6.22-7.22','水象 · 守护月亮','情感细腻、念家重情、直觉敏锐'],
  ['狮子座','♌','7.23-8.22','火象 · 守护太阳','自信热情、重面子、有领导魅力'],
  ['处女座','♍','8.23-9.22','土象 · 守护水星','细致追求完美、条理清晰、注重健康'],
  ['天秤座','♎','9.23-10.23','风象 · 守护金星','重视平衡美感、善于协调、待人温和'],
  ['天蝎座','♏','10.24-11.22','水象 · 守护冥王星','深沉有洞察力、专注执着、爱憎分明'],
  ['射手座','♐','11.23-12.21','火象 · 守护木星','乐观爱自由、爱探索、讲求信念'],
  ['摩羯座','♑','12.22-1.19','土象 · 守护土星','坚韧务实、目标感强、可靠有担当'],
  ['水瓶座','♒','1.20-2.18','风象 · 守护天王星','独立创新、思维超前、重视友情'],
  ['双鱼座','♓','2.19-3.20','水象 · 守护海王星','感性浪漫、想象力丰富、富同理心']
];

/* ================= 星空背景 ================= */
const cv=document.getElementById('stars'),cx=cv.getContext('2d');
let starsA=[],shooting=[];
function resizeStars(){
  const DPR=Math.min(devicePixelRatio||1,2);
  cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;
  starsA=Array.from({length:150},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,
    r:(Math.random()*1.3+.3)*DPR,p:Math.random()*7,s:.3+Math.random()*.9}));
}
resizeStars();addEventListener('resize',resizeStars);
function starTick(t){
  cx.clearRect(0,0,cv.width,cv.height);
  for(const s of starsA){
    const tw=.45+.55*Math.abs(Math.sin(t*.001*s.s+s.p));
    cx.globalAlpha=tw;cx.fillStyle='#fff';
    cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill();
  }
  cx.globalAlpha=1;
  requestAnimationFrame(starTick);
}
requestAnimationFrame(starTick);

/* ================= 星座格子 ================= */
const $=id=>document.getElementById(id);
const grid=$('aGrid');
SIGNS.forEach((s,i)=>{
  const b=document.createElement('div');b.className='a-cell';b.dataset.i=i;
  b.innerHTML='<span class="h-sym">'+s[1]+'</span><span class="h-name">'+s[0]+'</span><span class="h-range">'+s[2]+'</span>';
  b.onclick=()=>pick(i);grid.appendChild(b);
});
const d=new Date(),wk='日一二三四五六'.charAt(d.getDay());
$('aDate').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · 星期'+wk+' · 点一个星座，看看今天';

/* ================= AI 推演 ================= */
const HORO_SYS='你是一位资深华人占星师「月下观星师」，擅长基于古典占星推演精准而有温度的「今日星座运势」。请严格结合用户所选星座的【元素】【守护星】【核心性格特质】，以及当前日期的季节与节气能量来推演，让运势真正贴合该星座，而不是任何星座都能套用的万能文案。\n'+
  '输出要求（直接输出正文，不要客套开场）：\n'+
  '## 综合运势\n（2~3句，点出今日整体基调与关键行动建议）\n'+
  '## 爱情\n（1~2句）\n## 事业学业\n（1~2句）\n## 财运\n（1~2句）\n## 健康\n（1句）\n'+
  '## 幸运指引\n（一行：幸运色 / 幸运数字 / 幸运时段）\n'+
  '最后另起一行给一句「今日星语」——一句只属于这个星座今天的、诗意而克制的短句（不超过30字），格式为：> 今日星语：……';
function miniMD(t){
  t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return t
    .replace(/^> ?今日星语：(.*)$/gm,'<p style="text-align:center;color:#f2d488;letter-spacing:.06em;margin-top:14px">✦ $1 ✦</p>')
    .replace(/^## (.*)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n{2,}/g,'<p>')
    .replace(/\n/g,'<br>');
}
let horoSeq=0;
async function pick(i){
  const my=++horoSeq;
  [...grid.children].forEach((c,ci)=>c.classList.toggle('on',ci===i));
  const [name,sym,range,astro,trait]=SIGNS[i];
  $('aResult').style.display='block';
  $('aNow').innerHTML='<span class="h-now-sym">'+sym+'</span><b>'+name+'</b><span class="h-now-range">'+range+'</span>';
  $('aText').innerHTML='<div class="a-loading"><span class="orb-ring"></span><span>🌙 正在为你观星推演……</span></div>';
  $('aResult').scrollIntoView({behavior:'smooth',block:'start'});
  try{
    const res=await fetch(API_BASE+'/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
      body:JSON.stringify({model:MODEL,messages:[{role:'system',content:HORO_SYS},
        {role:'user',content:'请为「'+name+'」（日期区间'+range+'，属'+astro+'，核心性格特质：'+trait+'）推演今日（'+d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日，周'+'日一二三四五六'.charAt(d.getDay())+'）的运势。请严格贴合该星座特质，避免通用套话。'}],temperature:.8,max_tokens:1500})});
    if(my!==horoSeq)return;
    if(!res.ok)throw new Error('HTTP '+res.status);
    const j=await res.json();
    if(my!==horoSeq)return;
    $('aText').innerHTML=miniMD((j.choices[0].message.content||'').trim());
  }catch(e){
    if(my!==horoSeq)return;
    $('aText').innerHTML='<strong style="color:#ff9d9d">✕ 观星信号中断了…</strong><br><span style="font-size:.85rem;color:#b5abd8">请检查网络后再点一次星座试试</span>';
  }
}
$('btnBack').onclick=()=>location.href='../';
</script>
</body>
</html>
