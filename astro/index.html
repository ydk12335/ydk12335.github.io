<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>观星 · 有点困</title>
<style>
:root{--gold:#f0cf82;--gold-dim:#a9956a;--ivory:#f2ede0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Songti SC","Noto Serif SC",serif;color:var(--ivory);background:#05030f;overflow-x:hidden}
canvas#stars{position:fixed;inset:0;z-index:0}
/* ---------- 布局：与首页 portal 一致 ---------- */
.portal{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;
  justify-content:space-evenly;align-items:center;text-align:center;
  padding:clamp(20px,5vh,44px) 20px 22px}
.kicker{font-size:.68rem;letter-spacing:.42em;text-indent:.42em;color:var(--gold-dim)}
.p-title{font-size:clamp(1.7rem,6vw,2.2rem);letter-spacing:.24em;text-indent:.24em;font-weight:600;
  color:var(--gold);text-shadow:0 0 24px rgba(240,207,130,.35);margin-top:6px}
.p-sub{font-size:.78rem;color:#b5abd8;letter-spacing:.14em;margin-top:8px}
.btn-back{position:fixed;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:9;
  background:rgba(255,255,255,.07);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.14);color:#d8d0ef;border-radius:999px;padding:7px 16px;
  font-size:.78rem;letter-spacing:.1em;cursor:pointer;font-family:inherit;transition:.25s}
.btn-back:active{transform:scale(.94)}
/* ---------- 小卡片网格 ---------- */
.a-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(480px,94vw)}
.a-cell{cursor:pointer;position:relative;border-radius:14px;padding:10px 2px 8px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  transition:transform .28s,border-color .28s,background .28s}
.a-cell:hover{transform:translateY(-2px);border-color:rgba(240,207,130,.5);background:rgba(255,255,255,.07)}
.a-cell:active{transform:scale(.95)}
.a-cell.on{border-color:rgba(240,207,130,.75);background:rgba(240,207,130,.10)}
.a-cell .h-sym{font-size:1.35rem;line-height:1;color:#f2d488;text-shadow:0 0 10px rgba(240,207,130,.45)}
.a-cell .h-name{font-size:.7rem;letter-spacing:.05em}
.a-cell .h-range{font-size:.52rem;color:#8f86b8}
.a-cell.soon{cursor:default;opacity:.55}
.a-cell.soon .h-sym{color:#9a90c0;text-shadow:none}
/* ---------- 运势结果 ---------- */
.a-result{width:min(560px,94vw);text-align:left;display:none}
.a-now{display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.05rem;letter-spacing:.12em;color:#e9e3ff;margin-bottom:10px}
.a-now .h-now-sym{font-size:1.4rem;color:#f2d488;text-shadow:0 0 12px rgba(240,207,130,.5)}
.a-now .h-now-range{font-size:.74rem;color:#8f86b8}
.a-card{background:rgba(255,255,255,.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:clamp(14px,3vw,22px);
  box-shadow:0 14px 40px rgba(4,2,18,.4);line-height:1.9;font-size:.9rem;color:#e6e0f4}
.a-card h3{color:var(--gold);font-size:.98rem;margin:14px 0 5px;letter-spacing:.08em}
.a-card h3:first-child{margin-top:0}
.a-card p{margin:7px 0}
.a-card strong{color:#ffe4ab;font-weight:600}
.a-foot{text-align:center;font-size:.66rem;color:#8f86b8;margin-top:12px;letter-spacing:.05em}
.a-loading{display:flex;align-items:center;justify-content:center;gap:12px;color:#c9c0e8;padding:30px 0}
.orb-ring{position:relative;width:20px;height:20px;flex:none}
.orb-ring::before{content:"";position:absolute;inset:0;border-radius:50%;
  border:1.5px solid rgba(240,207,130,.25);border-top-color:var(--gold);animation:orbSpin 1.1s linear infinite}
.orb-ring::after{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.5rem;color:var(--gold);animation:orbGlow 2.2s ease-in-out infinite}
@keyframes orbSpin{to{transform:rotate(360deg)}}
@keyframes orbGlow{0%,100%{opacity:.4}50%{opacity:1;text-shadow:0 0 10px rgba(240,207,130,.8)}}
.p-foot{font-size:.72rem;letter-spacing:.3em;text-indent:.3em;color:#6f66a0}
@media(max-width:400px){.a-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<button class="btn-back" id="btnBack">← 返回</button>

<div class="portal">
  <header>
    <div class="kicker" id="aDate">ASTROLOGY</div>
    <h1 class="p-title">观 星</h1>
    <p class="p-sub">点一个星座，看看今天</p>
  </header>

  <div class="a-grid" id="aGrid"></div>

  <section class="a-result" id="aResult">
    <div class="a-now" id="aNow"></div>
    <div class="a-card" id="aText"></div>
    <div class="a-foot">运势由 AI 占星师即兴推演 · 仅供娱乐参考</div>
  </section>

  <footer class="p-foot">‥ 有点困 ‥</footer>
</div>

<script>
/* ================= 基础配置 ================= */
const API_BASE='https://apihub.agnes-ai.cn/v1';
const API_KEY='sk-bnT8gvJweewxMFO2oOnzNof2qpqazpKYq1spx5EulZ11vfyZ';
const MODEL='agnes-2.5-flash';

const SIGNS=[
  ['白羊座','♈','3.21-4.19','火象 · 守护火星','行动力强、热情直率、敢于争先'],
  ['金牛座','♉','4.20-5.20','土象 · 守护金星','踏实稳健、重质感、审美与耐心俱佳'],
  ['双子座','♊','5.21-6.21','风象 · 守护水星','思维敏捷、好奇善沟通、点子多'],
  ['巨蟹座','♋','6.22-7.22','水象 · 守护月亮','情感细腻、念家重情、直觉敏锐'],
  ['狮子座','♌','7.23-8.22','火象 · 守护太阳','自信热情、重面子、有领导魅力'],
  ['处女座','♍','8.23-9.22','土象 · 守护水星','细致追求完美、条理清晰、注重健康'],
  ['天秤座','♎','9.23-10.23','风象 · 守护金星','重视平衡美感、善于协调、待人温和'],
  ['天蝎座','♏','10.24-11.22','水象 · 守护冥王星','深沉有洞察力、专注执着、爱憎分明'],
  ['射手座','♐','11.23-12.21','火象 · 守护木星','乐观爱自由、爱探索、讲求信念'],
  ['摩羯座','♑','12.22-1.19','土象 · 守护土星','坚韧务实、目标感强、可靠有担当'],
  ['水瓶座','♒','1.20-2.18','风象 · 守护天王星','独立创新、思维超前、重视友情'],
  ['双鱼座','♓','2.19-3.20','水象 · 守护海王星','感性浪漫、想象力丰富、富同理心']
];

/* ================= 动态粒子星座背景（每次打开随机生成一副星盘） ================= */
const cv=document.getElementById('stars'),cx=cv.getContext('2d');
let nodes=[],links=[],starsBg=[];
function buildConstellation(){
  const DPR=Math.min(devicePixelRatio||1,2);
  cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;
  /* 随机星座：5~7 个主星，按链路+分支连线 */
  const n=5+Math.floor(Math.random()*3);
  nodes=[];links=[];
  const cx0=cv.width*(.25+Math.random()*.5),cy0=cv.height*(.2+Math.random()*.35);
  let px=cx0,py=cy0;
  for(let i=0;i<n;i++){
    nodes.push({x:px,y:py,r:(1.6+Math.random()*1.6)*DPR,p:Math.random()*7});
    if(i>0)links.push([i-1,i]);
    if(i>1&&Math.random()<.5){const j=Math.floor(Math.random()*(i-1));links.push([j,i]);}
    px+=(Math.random()-.5)*cv.width*.22;
    py+=(Math.random()-.45)*cv.height*.14;
    px=Math.max(cv.width*.08,Math.min(cv.width*.92,px));
    py=Math.max(cv.height*.08,Math.min(cv.height*.6,py));
  }
  starsBg=Array.from({length:130},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,
    r:(Math.random()*1.1+.25)*DPR,p:Math.random()*7,s:.3+Math.random()*.8}));
  nodes.dust=Array.from({length:26},()=>({li:Math.floor(Math.random()*links.length),t:Math.random(),v:.0012+Math.random()*.002}));
}
buildConstellation();addEventListener('resize',buildConstellation);
function tick(t){
  cx.clearRect(0,0,cv.width,cv.height);
  for(const s of starsBg){
    cx.globalAlpha=.35+.4*Math.abs(Math.sin(t*.001*s.s+s.p));
    cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill();
  }
  const breathe=.5+.25*Math.sin(t*.0006);
  cx.globalAlpha=.35*breathe;cx.strokeStyle='rgba(240,207,140,.8)';cx.lineWidth=1;
  for(const [a,b] of links){
    cx.beginPath();cx.moveTo(nodes[a].x,nodes[a].y);cx.lineTo(nodes[b].x,nodes[b].y);cx.stroke();
  }
  cx.fillStyle='rgba(255,240,200,.9)';
  for(const du of nodes.dust){
    du.t+=du.v;if(du.t>1){du.t=0;du.li=Math.floor(Math.random()*links.length);}
    const [a,b]=links[du.li];
    const x=nodes[a].x+(nodes[b].x-nodes[a].x)*du.t,y=nodes[a].y+(nodes[b].y-nodes[a].y)*du.t;
    cx.globalAlpha=.8*Math.sin(du.t*Math.PI);
    cx.beginPath();cx.arc(x,y,1.1,0,7);cx.fill();
  }
  for(const nd of nodes){
    const tw=.7+.3*Math.sin(t*.0012+nd.p);
    cx.globalAlpha=tw;
    cx.fillStyle='#fdf6e0';cx.beginPath();cx.arc(nd.x,nd.y,nd.r,0,7);cx.fill();
    cx.globalAlpha=tw*.25;
    cx.beginPath();cx.arc(nd.x,nd.y,nd.r*3.2,0,7);cx.fill();
  }
  cx.globalAlpha=1;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ================= 日期 ================= */
const d=new Date(),wk='日一二三四五六'.charAt(d.getDay());
document.getElementById('aDate').textContent=
  d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · 星期'+wk+' · ASTROLOGY';

/* ================= 网格（12星座 + 敬请期待） ================= */
const $=id=>document.getElementById(id);
const grid=$('aGrid');
SIGNS.forEach((s,i)=>{
  const b=document.createElement('div');b.className='a-cell';
  b.innerHTML='<span class="h-sym">'+s[1]+'</span><span class="h-name">'+s[0]+'</span><span class="h-range">'+s[2]+'</span>';
  b.onclick=()=>pick(i);grid.appendChild(b);
});
[["☽"],["☾"],["✧"],["∞"]].forEach(([sym])=>{
  const b=document.createElement('div');b.className='a-cell soon';
  b.innerHTML='<span class="h-sym">'+sym+'</span><span class="h-name">敬请期待</span><span class="h-range">酝酿中</span>';
  grid.appendChild(b);
});

/* ================= AI 推演 ================= */
const HORO_SYS='你是一位资深华人占星师「月下观星师」，擅长基于古典占星推演精准而有温度的「今日星座运势」。请严格结合用户所选星座的【元素】【守护星】【核心性格特质】，以及当前日期的季节与节气能量来推演，让运势真正贴合该星座，而不是任何星座都能套用的万能文案。\n'+
  '输出要求（直接输出正文，不要客套开场）：\n'+
  '## 综合运势\n（2~3句，点出今日整体基调与关键行动建议）\n'+
  '## 爱情\n（1~2句）\n## 事业学业\n（1~2句）\n## 财运\n（1~2句）\n## 健康\n（1句）\n'+
  '## 幸运指引\n（一行：幸运色 / 幸运数字 / 幸运时段）\n'+
  '最后另起一行给一句「今日星语」——一句只属于这个星座今天的、诗意而克制的短句（不超过30字），格式为：> 今日星语：……';
function miniMD(t){
  t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return t
    .replace(/^> ?今日星语：(.*)$/gm,'<p style="text-align:center;color:#f2d488;letter-spacing:.06em;margin-top:12px">✦ $1 ✦</p>')
    .replace(/^## (.*)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n{2,}/g,'<p>')
    .replace(/\n/g,'<br>');
}
let horoSeq=0;
async function pick(i){
  const my=++horoSeq;
  [...grid.querySelectorAll('.a-cell:not(.soon)')].forEach((c,ci)=>c.classList.toggle('on',ci===i));
  const [name,sym,range,astro,trait]=SIGNS[i];
  $('aResult').style.display='block';
  $('aNow').innerHTML='<span class="h-now-sym">'+sym+'</span><b>'+name+'</b><span class="h-now-range">'+range+'</span>';
  $('aText').innerHTML='<div class="a-loading"><span class="orb-ring"></span><span>🌙 正在为你观星推演……</span></div>';
  try{
    const res=await fetch(API_BASE+'/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
      body:JSON.stringify({model:MODEL,messages:[{role:'system',content:HORO_SYS},
        {role:'user',content:'请为「'+name+'」（日期区间'+range+'，属'+astro+'，核心性格特质：'+trait+'）推演今日（'+d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日，周'+wk+'）的运势。请严格贴合该星座特质，避免通用套话。'}],temperature:.8,max_tokens:1500})});
    if(my!==horoSeq)return;
    if(!res.ok)throw new Error('HTTP '+res.status);
    const j=await res.json();
    if(my!==horoSeq)return;
    $('aText').innerHTML=miniMD((j.choices[0].message.content||'').trim());
  }catch(e){
    if(my!==horoSeq)return;
    $('aText').innerHTML='<strong style="color:#ff9d9d">✕ 观星信号中断了…</strong><br><span style="font-size:.85rem;color:#b5abd8">请检查网络后再点一次星座试试</span>';
  }
}
$('btnBack').onclick=()=>location.href='../';
</script>
</body>
</html>
