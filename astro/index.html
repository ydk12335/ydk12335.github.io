<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>观星 · 有点困</title>
<style>
:root{--gold:#f0cf82;--gold-dim:#a9956a;--ivory:#f2ede0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Songti SC","Noto Serif SC",serif;color:var(--ivory);background:#05030f;overflow-x:hidden}
canvas#stars{position:fixed;inset:0;z-index:0}
/* ---------- 布局：与首页 portal 一致 ---------- */
.portal{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;
  justify-content:space-evenly;align-items:center;text-align:center;
  padding:clamp(56px,10vh,84px) 20px 22px}
.kicker{font-size:.68rem;letter-spacing:.42em;text-indent:.42em;color:var(--gold-dim)}
.p-title{font-size:clamp(1.7rem,6vw,2.2rem);letter-spacing:.24em;text-indent:.24em;font-weight:600;
  color:var(--gold);text-shadow:0 0 24px rgba(240,207,130,.35);margin-top:6px}
.p-sub{font-size:.78rem;color:#b5abd8;letter-spacing:.14em;margin-top:8px}
.btn-back{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:9;
  background:linear-gradient(155deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  border:1px solid rgba(255,255,255,.22);color:#f2ede0;border-radius:999px;padding:9px 22px;
  font-size:.8rem;letter-spacing:.12em;cursor:pointer;font-family:inherit;transition:.25s;
  box-shadow:0 6px 20px rgba(4,2,18,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.btn-back:active{transform:scale(.94)}
/* ---------- 小卡片网格 ---------- */
.a-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(480px,94vw)}
.a-cell{cursor:pointer;position:relative;border-radius:14px;padding:13px 2px 10px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.05);
  transition:transform .28s,border-color .28s,background .28s}
.a-cell:hover{border-color:rgba(240,207,130,.5);background:rgba(255,255,255,.04)}
.a-cell:active{transform:scale(.95)}
.a-cell.on{border-color:rgba(240,207,130,.7);background:rgba(240,207,130,.08)}
.a-cell .h-sym{font-size:1.4rem;line-height:1;color:#f2d488;text-shadow:0 0 10px rgba(240,207,130,.5)}
.a-cell .h-name{font-size:.72rem;letter-spacing:.05em;color:#efe9ff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.a-cell .h-range{font-size:.52rem;color:#9a90c0}
/* ---------- 敬请期待胶囊按钮 ---------- */
.soon-bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:min(560px,94vw);
  margin-top:clamp(16px,3.4vh,32px)}
.soon-pill{flex:1;min-width:170px;cursor:default;text-align:center;
  padding:13px 24px;border-radius:999px;font-size:.82rem;letter-spacing:.12em;color:#cfc6ea;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:.75}
/* ---------- 运势结果 ---------- */
.a-result{width:min(560px,94vw);text-align:left;display:none}
.a-now{display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.05rem;letter-spacing:.12em;color:#e9e3ff;margin-bottom:10px}
.a-now .h-now-sym{font-size:1.4rem;color:#f2d488;text-shadow:0 0 12px rgba(240,207,130,.5)}
.a-now .h-now-range{font-size:.74rem;color:#8f86b8}
.a-card{background:rgba(255,255,255,.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:clamp(14px,3vw,22px);
  box-shadow:0 14px 40px rgba(4,2,18,.4);line-height:1.9;font-size:.9rem;color:#e6e0f4}
.a-card h3{color:var(--gold);font-size:.98rem;margin:14px 0 5px;letter-spacing:.08em}
.a-card h3:first-child{margin-top:0}
.a-card p{margin:7px 0}
.a-card strong{color:#ffe4ab;font-weight:600}
.a-foot{text-align:center;font-size:.66rem;color:#8f86b8;margin-top:12px;letter-spacing:.05em}
.a-loading{display:flex;align-items:center;justify-content:center;gap:12px;color:#c9c0e8;padding:30px 0}
.orb-ring{position:relative;width:20px;height:20px;flex:none}
.orb-ring::before{content:"";position:absolute;inset:0;border-radius:50%;
  border:1.5px solid rgba(240,207,130,.25);border-top-color:var(--gold);animation:orbSpin 1.1s linear infinite}
.orb-ring::after{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.5rem;color:var(--gold);animation:orbGlow 2.2s ease-in-out infinite}
@keyframes orbSpin{to{transform:rotate(360deg)}}
@keyframes orbGlow{0%,100%{opacity:.4}50%{opacity:1;text-shadow:0 0 10px rgba(240,207,130,.8)}}
.p-foot{font-size:.72rem;letter-spacing:.3em;text-indent:.3em;color:#6f66a0}
/* ---------- 分享按钮 ---------- */
.a-share{display:flex;gap:10px;justify-content:center;margin-top:12px}
.share-btn{flex:0 1 auto;min-width:0;opacity:.9;cursor:pointer}
.share-btn:active{transform:scale(.95)}
#shotModal{position:fixed;inset:0;z-index:50;background:rgba(3,1,14,.86);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px}
#shotModal.show{display:flex}
#shotImg{max-width:92vw;max-height:70vh;border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.6)}
.shot-tip{font-size:.75rem;color:#b5abd8;letter-spacing:.1em}
@media(max-width:400px){.a-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<button class="btn-back" id="btnBack">⌂ 首页</button>

<div class="portal">
  <header>
    <div class="kicker" id="aDate">ASTROLOGY</div>
    <h1 class="p-title">观 星</h1>
    <p class="p-sub" id="chartName">✦ … ✦</p>
  </header>

  <div class="a-grid" id="aGrid"></div>

  <div class="soon-bar">
    <a class="soon-pill pair-btn" href="pair/">☾ 星座配对</a>
    <span class="soon-pill">☽ 星座合盘 · 敬请期待</span>
    <span class="soon-pill">✧ 星座日历 · 敬请期待</span>
    <span class="soon-pill">∞ 星空信箱 · 敬请期待</span>
  </div>

  <section class="a-result" id="aResult">
    <div class="a-now" id="aNow"></div>
    <div class="a-card" id="aText"></div>
    <div class="a-foot">运势由 AI 占星师即兴推演 · 仅供娱乐参考</div>
    <div class="a-share" id="aShare" style="display:none">
      <button class="soon-pill share-btn" id="btnShot">📸 生成分享图</button>
      <button class="soon-pill share-btn" id="btnCopy">📋 文字分享</button>
    </div>
  </section>

  <footer class="p-foot">‥ 有点困 ‥</footer>
</div>

<div id="shotModal">
  <img id="shotImg" alt="分享图">
  <div class="shot-tip">长按图片保存 / 分享</div>
  <button class="soon-pill share-btn" id="shotClose" style="padding:10px 30px">关 闭</button>
</div>

<script>
/* ================= 基础配置 ================= */
const API_BASE='https://apihub.agnes-ai.cn/v1';
const API_KEY='sk-bnT8gvJweewxMFO2oOnzNof2qpqazpKYq1spx5EulZ11vfyZ';
const MODEL='agnes-2.5-flash';

const SIGNS=[
  ['白羊座','♈','3.21-4.19','火象 · 守护火星','行动力强、热情直率、敢于争先'],
  ['金牛座','♉','4.20-5.20','土象 · 守护金星','踏实稳健、重质感、审美与耐心俱佳'],
  ['双子座','♊','5.21-6.21','风象 · 守护水星','思维敏捷、好奇善沟通、点子多'],
  ['巨蟹座','♋','6.22-7.22','水象 · 守护月亮','情感细腻、念家重情、直觉敏锐'],
  ['狮子座','♌','7.23-8.22','火象 · 守护太阳','自信热情、重面子、有领导魅力'],
  ['处女座','♍','8.23-9.22','土象 · 守护水星','细致追求完美、条理清晰、注重健康'],
  ['天秤座','♎','9.23-10.23','风象 · 守护金星','重视平衡美感、善于协调、待人温和'],
  ['天蝎座','♏','10.24-11.22','水象 · 守护冥王星','深沉有洞察力、专注执着、爱憎分明'],
  ['射手座','♐','11.23-12.21','火象 · 守护木星','乐观爱自由、爱探索、讲求信念'],
  ['摩羯座','♑','12.22-1.19','土象 · 守护土星','坚韧务实、目标感强、可靠有担当'],
  ['水瓶座','♒','1.20-2.18','风象 · 守护天王星','独立创新、思维超前、重视友情'],
  ['双鱼座','♓','2.19-3.20','水象 · 守护海王星','感性浪漫、想象力丰富、富同理心']
];

/* ================= 动态粒子星盘背景（居中圆盘 + 随机星座 + 缓慢旋转） ================= */
const cv=document.getElementById('stars'),cx=cv.getContext('2d');
const CHART_NAMES=['天鹅座','天琴座','仙后座','猎户座','飞马座','天龙座','南十字','大熊座','仙女座','天鹰座','波江座','长蛇座'];
let chart=null; /* {cx,cy,R,nodes,links,name,rot,rotV,starsBg} */
function buildChart(){
  const DPR=Math.min(devicePixelRatio||1,2);
  cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;
  /* 星盘固定屏幕正中，半径取约 42% 屏宽，铺满大半屏；卡片透明不会遮挡 */
  const R=Math.min(cv.width,cv.height)*.42;
  const cx0=cv.width/2, cy0=cv.height/2;
  const n=7+Math.floor(Math.random()*4);
  /* 星座点生成在半径 R 的圆盘内 */
  const nodes=[],links=[];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*R*.88;
    nodes.push({x:Math.cos(a)*r,y:Math.sin(a)*r,r:(2.4+Math.random()*2)*DPR,p:Math.random()*7});
  }
  for(let i=1;i<n;i++)links.push([i-1,i]);
  for(let i=2;i<n;i++)if(Math.random()<.6)links.push([Math.floor(Math.random()*(i-1)),i]);
  chart={cx:cx0,cy:cy0,R,nodes,links,
    name:CHART_NAMES[Math.floor(Math.random()*CHART_NAMES.length)],
    rot:0,rotV:.00025+Math.random()*.0002, /* 缓慢旋转，每副速度略不同 */
    starsBg:Array.from({length:130},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,
      r:(Math.random()*1.1+.25)*DPR,p:Math.random()*7,s:.3+Math.random()*.8})),
    dust:Array.from({length:24},()=>({li:Math.floor(Math.random()*links.length),t:Math.random(),v:.0012+Math.random()*.002}))};
}
buildChart();addEventListener('resize',buildChart);
function tick(t){
  cx.clearRect(0,0,cv.width,cv.height);
  /* 背景散星 */
  for(const s of chart.starsBg){
    cx.globalAlpha=.3+.35*Math.abs(Math.sin(t*.001*s.s+s.p));
    cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill();
  }
  chart.rot+=chart.rotV;
  cx.save();cx.translate(chart.cx,chart.cy);cx.rotate(chart.rot);
  /* 星盘外圈（极淡双环） */
  cx.globalAlpha=.10;cx.strokeStyle='rgba(240,207,140,1)';cx.lineWidth=.8;
  cx.beginPath();cx.arc(0,0,chart.R,0,7);cx.stroke();
  cx.globalAlpha=.05;
  cx.beginPath();cx.arc(0,0,chart.R*.8,0,7);cx.stroke();
  /* 星座连线 */
  cx.globalAlpha=.42+.14*Math.sin(t*.0006);
  cx.strokeStyle='rgba(240,207,150,.85)';cx.lineWidth=1.3;
  for(const [a,b] of chart.links){
    cx.beginPath();cx.moveTo(chart.nodes[a].x,chart.nodes[a].y);
    cx.lineTo(chart.nodes[b].x,chart.nodes[b].y);cx.stroke();
  }
  /* 流动星尘 */
  cx.fillStyle='rgba(255,240,200,.9)';
  for(const du of chart.dust){
    du.t+=du.v;if(du.t>1){du.t=0;du.li=Math.floor(Math.random()*chart.links.length);}
    const [a,b]=chart.links[du.li],A=chart.nodes[a],B=chart.nodes[b];
    const x=A.x+(B.x-A.x)*du.t,y=A.y+(B.y-A.y)*du.t;
    cx.globalAlpha=.7*Math.sin(du.t*Math.PI);
    cx.beginPath();cx.arc(x,y,1.1,0,7);cx.fill();
  }
  /* 主星 + 光晕 */
  for(const nd of chart.nodes){
    const tw=.7+.3*Math.sin(t*.0012+nd.p);
    cx.globalAlpha=tw*.9;
    cx.fillStyle='#fdf6e0';cx.beginPath();cx.arc(nd.x,nd.y,nd.r,0,7);cx.fill();
    cx.globalAlpha=tw*.2;
    cx.beginPath();cx.arc(nd.x,nd.y,nd.r*3.4,0,7);cx.fill();
  }
  cx.restore();
  cx.globalAlpha=1;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
/* 星盘名称写在页面上方（同首页天气栏），不随盘旋转 */
document.getElementById('chartName').textContent='✦ '+chart.name+' ✦';

/* ================= 日期 ================= */
const d=new Date(),wk='日一二三四五六'.charAt(d.getDay());
document.getElementById('aDate').textContent=
  d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · 星期'+wk+' · ASTROLOGY';

/* ================= 网格（12星座 + 敬请期待） ================= */
const $=id=>document.getElementById(id);
const grid=$('aGrid');
SIGNS.forEach((s,i)=>{
  const b=document.createElement('div');b.className='a-cell';
  b.innerHTML='<span class="h-sym">'+s[1]+'</span><span class="h-name">'+s[0]+'</span><span class="h-range">'+s[2]+'</span>';
  b.onclick=()=>pick(i);grid.appendChild(b);
});
/* 敬请期待已改为 HTML 胶囊按钮 */

/* ================= AI 推演 ================= */
const HORO_SYS='你是一位资深华人占星师「月下观星师」，擅长基于古典占星推演精准而有温度的「今日星座运势」。请严格结合用户所选星座的【元素】【守护星】【核心性格特质】，以及当前日期的季节与节气能量来推演，让运势真正贴合该星座，而不是任何星座都能套用的万能文案。\n'+
  '输出要求（直接输出正文，不要客套开场）：\n'+
  '## 综合运势\n（2~3句，点出今日整体基调与关键行动建议）\n'+
  '## 爱情\n（1~2句）\n## 事业学业\n（1~2句）\n## 财运\n（1~2句）\n## 健康\n（1句）\n'+
  '## 幸运指引\n（一行：幸运色 / 幸运数字 / 幸运时段）\n'+
  '最后另起一行给一句「今日星语」——一句只属于这个星座今天的、诗意而克制的短句（不超过30字），格式为：> 今日星语：……';
function miniMD(t){
  t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return t
    .replace(/^> ?今日星语：(.*)$/gm,'<p style="text-align:center;color:#f2d488;letter-spacing:.06em;margin-top:12px">✦ $1 ✦</p>')
    .replace(/^## (.*)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n{2,}/g,'<p>')
    .replace(/\n/g,'<br>');
}
let horoSeq=0;
async function pick(i){
  const my=++horoSeq;
  [...grid.querySelectorAll('.a-cell:not(.soon)')].forEach((c,ci)=>c.classList.toggle('on',ci===i));
  const [name,sym,range,astro,trait]=SIGNS[i];
  $('aResult').style.display='block';
  $('aNow').innerHTML='<span class="h-now-sym">'+sym+'</span><b>'+name+'</b><span class="h-now-range">'+range+'</span>';
  $('aText').innerHTML='<div class="a-loading"><span class="orb-ring"></span><span>🌙 正在为你观星推演……</span></div>';
  try{
    const res=await fetch(API_BASE+'/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
      body:JSON.stringify({model:MODEL,messages:[{role:'system',content:HORO_SYS},
        {role:'user',content:'请为「'+name+'」（日期区间'+range+'，属'+astro+'，核心性格特质：'+trait+'）推演今日（'+d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日，周'+wk+'）的运势。请严格贴合该星座特质，避免通用套话。'}],temperature:.8,max_tokens:1500})});
    if(my!==horoSeq)return;
    if(!res.ok)throw new Error('HTTP '+res.status);
    const j=await res.json();
    if(my!==horoSeq)return;
    const raw=(j.choices[0].message.content||'').trim();
    $('aText').innerHTML=miniMD(raw);
    /* 记录本次运势供分享 */
    lastHoro={sign:name,sym,date:d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wk,text:raw};
    $('aShare').style.display='flex';
  }catch(e){
    if(my!==horoSeq)return;
    $('aShare').style.display='none';
    $('aText').innerHTML='<strong style="color:#ff9d9d">✕ 观星信号中断了…</strong><br><span style="font-size:.85rem;color:#b5abd8">请检查网络后再点一次星座试试</span>';
  }
}
let lastHoro=null;

/* ================= 分享：文字 + 分享图 ================= */
$('btnCopy').onclick=async()=>{
  if(!lastHoro)return;
  const txt='✦ 月下观星 ✦\n'+lastHoro.sign+' '+lastHoro.date+'\n\n'+lastHoro.text.replace(/^#+\s*/gm,'').replace(/\*\*/g,'')+'\n\n—— 来自「有点困」';
  try{
    if(navigator.share){await navigator.share({title:'今日观星 · '+lastHoro.sign,text:txt});return;}
    await navigator.clipboard.writeText(txt);
    const b=$('btnCopy');b.textContent='✓ 已复制，去粘贴吧';
    setTimeout(()=>b.textContent='📋 文字分享',2000);
  }catch(e){}
};
/* 分享图：canvas 手绘夜色卡片（星星点缀 + 星座 + 摘要文字） */
function drawShareCard(){
  const W=720,H=1080,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');
  /* 夜空渐变 */
  const bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0620');bg.addColorStop(.55,'#0d0a26');bg.addColorStop(1,'#1a0f2e');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  /* 散星 */
  for(let i=0;i<130;i++){
    g.globalAlpha=.25+Math.random()*.55;g.fillStyle='#fff';
    g.beginPath();g.arc(Math.random()*W,Math.random()*H,Math.random()*1.4+.3,0,7);g.fill();
  }
  g.globalAlpha=1;
  /* 星盘圆环 */
  g.strokeStyle='rgba(240,207,130,.35)';g.lineWidth=1.5;
  g.beginPath();g.arc(W/2,208,128,0,7);g.stroke();
  g.strokeStyle='rgba(240,207,130,.18)';
  g.beginPath();g.arc(W/2,208,104,0,7);g.stroke();
  g.fillStyle='#fdf6e0';g.beginPath();g.arc(W/2+52,208-38,4,0,7);g.fill();
  g.beginPath();g.arc(W/2-64,208+30,3.2,0,7);g.fill();
  g.beginPath();g.arc(W/2+20,208+58,3,0,7);g.fill();
  g.strokeStyle='rgba(240,207,150,.55)';g.lineWidth=1.2;
  g.beginPath();g.moveTo(W/2+52,208-38);g.lineTo(W/2-64,208+30);g.lineTo(W/2+20,208+58);g.stroke();
  /* 标题 */
  g.textAlign='center';
  g.fillStyle='#a9956a';g.font='22px serif';g.fillText('· 月 下 观 星 ·',W/2,78);
  g.fillStyle='#f0cf82';g.font='600 44px "Songti SC","Noto Serif SC",serif';
  g.fillText(lastHoro.sym+' '+lastHoro.sign,W/2,392);
  g.fillStyle='#8f86b8';g.font='22px serif';g.fillText(lastHoro.date,W/2,432);
  /* 正文摘要（取各节前两行，最多 9 行） */
  const lines=lastHoro.text.replace(/^#+.*$/gm,'').replace(/\*\*/g,'').split('\n')
    .map(s=>s.trim()).filter(Boolean).slice(0,9);
  g.font='24px "Songti SC","Noto Serif SC",serif';g.fillStyle='#e6e0f4';
  let y=496;
  for(const ln of lines){
    let s=ln;if(s.length>20)s=s.slice(0,19)+'…';
    g.fillText(s,W/2,y);y+=40;
  }
  /* 星语 */
  const star=lastHoro.text.match(/今日星语[：:]\s*(.+)/);
  if(star){
    g.fillStyle='#f2d488';g.font='italic 26px serif';
    let s=star[1].trim();if(s.length>18)s=s.slice(0,17)+'…';
    g.fillText('✦ '+s+' ✦',W/2,H-190);
  }
  g.fillStyle='#6f66a0';g.font='20px serif';
  g.fillText('‥ 有点困 · AI 占星即兴推演 ‥',W/2,H-96);
  return c;
}
$('btnShot').onclick=()=>{
  if(!lastHoro)return;
  $('shotImg').src=drawShareCard().toDataURL('image/png');
  $('shotModal').classList.add('show');
};
$('shotClose').onclick=()=>$('shotModal').classList.remove('show');
$('shotModal').onclick=e=>{if(e.target.id==='shotModal')$('shotModal').classList.remove('show');};
$('btnBack').onclick=()=>location.href='../';
</script>
