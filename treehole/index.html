<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聊天树洞 · Tree Hole</title>
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&display=swap">
<style>
  :root{--gold:#f0cf82;--gold-dim:#c2a25e;--ivory:#f4ecdd}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Ma Shan Zheng","Xingkai SC","STXingkai","Kaiti SC","STKaiti","KaiTi","楷体",serif;
    color:var(--ivory);background:#04020e}
  /* ===== 背景：星海粒子（particles.js） ===== */
  #holeParticles{position:fixed;inset:0;z-index:0;pointer-events:none}
  /* ===== 液态玻璃 ===== */
  .glass{
    background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    border:1px solid rgba(240,207,130,.20);
    backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 12px 40px rgba(0,0,0,.35)}
  /* ===== 顶栏 ===== */
  .th-head{position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 16px 12px}
  .th-back{width:38px;height:38px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:1.05rem;color:var(--gold);cursor:pointer;transition:.2s}
  .th-back:active{transform:scale(.94)}
  .th-title{flex:1;text-align:center;font-size:1rem;letter-spacing:.34em;text-indent:.34em;color:var(--gold);
    padding:8px 14px;border-radius:16px;text-shadow:0 0 16px rgba(240,207,130,.3)}
  .th-clear{width:38px;height:38px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:.92rem;color:rgba(240,207,130,.7);cursor:pointer;transition:.2s}
  .th-clear:active{transform:scale(.94)}
  /* ===== 海浪白噪音开关（WebAudio 现场合成，非音乐） ===== */
  .th-wave{width:38px;height:38px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:.95rem;color:rgba(240,207,130,.55);cursor:pointer;transition:.25s;position:relative}
  .th-wave:active{transform:scale(.94)}
  .th-wave.on{color:var(--gold);background:rgba(240,207,130,.14);
    box-shadow:inset 0 0 0 1px rgba(240,207,130,.45),0 0 16px rgba(240,207,130,.22)}
  .th-wave .tw-badge{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;
    background:#6fb1e2;box-shadow:0 0 6px rgba(111,177,226,.8);display:none}
  .th-wave.on .tw-badge{display:block;animation:twPulse 1.6s ease-in-out infinite}
  @keyframes twPulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
  /* ===== 消息区 ===== */
  #holeMsgs{position:fixed;inset:0;z-index:5;padding:calc(72px + env(safe-area-inset-top)) 14px calc(94px + env(safe-area-inset-bottom));
    overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  #holeMsgs::-webkit-scrollbar{display:none}
  .msg{display:flex;margin:14px 0;animation:msgIn .38s cubic-bezier(.16,1,.3,1)}
  @keyframes msgIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  .msg.user{justify-content:flex-end}
  .msg.ai{justify-content:flex-start}
  .msg .bub{max-width:76%;padding:12px 16px;border-radius:20px;font-size:.9rem;line-height:1.75;
    white-space:pre-wrap;word-break:break-word}
  .msg.user .bub{
    background:linear-gradient(160deg,rgba(240,207,130,.32),rgba(240,207,130,.14));
    border:1px solid rgba(240,207,130,.40);
    backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 8px 24px rgba(0,0,0,.25);
    color:#fff7e2;border-radius:20px 20px 6px 20px}
  .msg.ai .bub{
    background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
    border:1px solid rgba(240,207,130,.18);
    backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 8px 24px rgba(0,0,0,.22);
    color:#ebe3cf;border-radius:20px 20px 20px 6px}
  .msg .who{font-size:.58rem;color:rgba(240,207,130,.45);letter-spacing:.16em;margin-bottom:4px;padding:0 4px}
  .msg.ai .who{text-align:left}
  .msg.user .who{text-align:right}
  /* 欢迎卡 */
  .welcome{max-width:86%;margin:26px auto 8px;padding:22px 20px;border-radius:24px;text-align:center}
  .welcome .wic{font-size:2rem;margin-bottom:10px;text-shadow:0 0 24px rgba(240,207,130,.35)}
  .welcome .wtitle{font-size:1.05rem;color:var(--gold);letter-spacing:.2em;margin-bottom:8px}
  .welcome .wdesc{font-size:.78rem;color:rgba(240,207,130,.6);line-height:1.8}
  .welcome .whint{margin-top:14px;font-size:.66rem;color:rgba(240,207,130,.4);letter-spacing:.1em}
  /* 正在输入 */
  .typing{display:inline-flex;gap:5px;align-items:center;padding:4px 2px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.5;
    animation:tp 1.2s ease-in-out infinite}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes tp{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-5px);opacity:.9}}
  .th-status{font-size:.7rem;color:rgba(240,207,130,.5);text-align:center;padding:6px 0;letter-spacing:.08em}
  .th-status.changing{color:#e8b48f;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  /* ===== 输入区（液态玻璃悬浮） ===== */
  .th-input{position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    display:flex;gap:10px;align-items:flex-end;
    background:linear-gradient(180deg,rgba(4,2,14,0),rgba(4,2,14,0))}
  .th-input .glassbox{flex:1;display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 16px;border-radius:24px}
  #holeIn{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--ivory);
    font-family:inherit;font-size:.92rem;line-height:1.6;max-height:96px;min-height:34px;padding:7px 0}
  #holeIn::placeholder{color:rgba(240,207,130,.35)}
  #holeSend{flex:none;width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(160deg,rgba(255,238,196,.45),rgba(240,207,130,.22));
    color:#0a0815;font-size:1.02rem;display:flex;align-items:center;justify-content:center;
    transition:.2s;box-shadow:0 4px 16px rgba(240,207,130,.22)}
  #holeSend:active{transform:scale(.9)}
  #holeSend:disabled{opacity:.4;pointer-events:none}
  .th-tip{font-size:.58rem;color:rgba(240,207,130,.32);text-align:center;padding:6px 0 2px;letter-spacing:.14em}
  /* 清空确认 */
  .th-clear-mask{position:fixed;inset:0;z-index:50;background:rgba(5,3,16,.6);
    backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:24px}
  .th-clear-mask.show{display:flex}
  .th-clear-box{width:min(310px,92%);padding:22px 20px;border-radius:22px;text-align:center;animation:msgIn .35s cubic-bezier(.16,1,.3,1)}
  .th-clear-box h4{font-size:.9rem;color:var(--gold);letter-spacing:.1em;margin-bottom:8px}
  .th-clear-box p{font-size:.72rem;color:rgba(240,207,130,.6);line-height:1.7;margin-bottom:16px}
  .th-clear-btns{display:flex;gap:10px}
  .th-clear-btns button{flex:1;padding:11px;border-radius:14px;font-family:inherit;font-size:.76rem;cursor:pointer;border:none;letter-spacing:.06em}
  .th-cancel{background:rgba(255,255,255,.08);color:rgba(240,207,130,.65)}
  .th-ok{background:linear-gradient(165deg,rgba(255,238,196,.4),rgba(240,207,130,.18));color:#fffbef;font-weight:600}
</style>
</head>
<body>
<div id="holeParticles"></div>

<!-- 顶栏 -->
<div class="th-head">
  <div class="th-back glass" id="thBack">←</div>
  <div class="th-title glass">聊天树洞</div>
  <div class="th-clear glass" id="thClear" title="清空记忆">⌫</div>
  <div class="th-wave" id="thWave" title="海浪白噪音（现场合成）">🌊<span class="tw-badge"></span></div>
</div>

<!-- 消息区 -->
<div id="holeMsgs"></div>

<!-- 输入区 -->
<div class="th-input">
  <div class="glassbox glass">
    <textarea id="holeIn" rows="1" placeholder="把想说的，丢进树洞…"></textarea>
    <button id="holeSend">➤</button>
  </div>
</div>

<!-- 清空确认 -->
<div class="th-clear-mask" id="thClearMask">
  <div class="th-clear-box glass">
    <h4>清空树洞记忆？</h4>
    <p>聊天记录和悄悄记住的你，都会被清空。<br>清空后树洞将从零开始认识你。</p>
    <div class="th-clear-btns">
      <button class="th-cancel" id="thClearNo">再想想</button>
      <button class="th-ok" id="thClearYes">清空</button>
    </div>
  </div>
</div>

<script src="../memory.js"></script>
<script src="../supabase-config.js?v=6"></script>
<script src="../ai-relay.js?v=2"></script>
<script src="../treehole.js?v=2"></script>
<script src="particles.min.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);

  /* ============ 星海粒子背景（particles.js，GitHub 30k+ star 好评库） ============ */
  var holeParticles = null;
  function initParticles() {
    var target = document.getElementById('holeParticles');
    if (!target) return;
    if (holeParticles) { holeParticles.destroy && holeParticles.destroy(); holeParticles = null; }
    particlesJS('holeParticles', {
      particles: {
        number: { value: 120, density: { enable: true, value_area: 700 } },
        color: { value: '#ffe9c9' },
        shape: { type: 'circle', stroke: { width: 0, color: '#000000' }, polygon: { nb_sides: 5 } },
        opacity: { value: 0.75, random: true, anim: { enable: true, speed: 1.2, opacity_min: 0.12, sync: false } },
        size: { value: 2.6, random: true, anim: { enable: true, speed: 5, size_min: 0.3, sync: false } },
        line_linked: { enable: true, distance: 150, color: '#f0cf82', opacity: 0.28, width: 0.8 },
        move: { enable: true, speed: 1.1, direction: 'none', random: true, straight: false,
          out_mode: 'out', bounce: false, attract: { enable: false, rotateX: 600, rotateY: 1200 } }
      },
      interactivity: {
        detect_on: 'canvas',
        events: { onhover: { enable: true, mode: 'repulse' }, onclick: { enable: true, mode: 'push' }, resize: true },
        modes: { grab: { distance: 180, line_linked: { opacity: 0.5 } },
          bubble: { distance: 300, size: 6, duration: 1.2, opacity: 0.6, speed: 3 },
          repulse: { distance: 140, duration: 0.4 }, push: { particles_nb: 3 }, remove: { particles_nb: 1 } }
      },
      retina_detect: true
    });
  }
  if (window.particlesJS) initParticles();
  else { window.addEventListener('load', initParticles); }

  /* ============ 海浪白噪音（WebAudio 现场合成 · 非音乐 · 零版权） ============ */
  /* 树洞住在深夜的海边：用合成海浪声做氛围白噪音，不依赖任何音频文件 */
  let waveCtx = null, waveNodes = null, waveOn = false;
  const waveBtn = $('thWave');
  function startWave() {
    try {
      if (!waveCtx) waveCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (waveCtx.state === 'suspended') waveCtx.resume();
      stopWaveNodes();
      const sr = waveCtx.sampleRate;
      /* 一波海浪 ≈ 9 秒：缓起 → 涌上 → 退落，循环播放 */
      const cycle = 9, len = sr * cycle;
      const buf = waveCtx.createBuffer(1, len, sr), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        const ph = (i / sr % cycle) / cycle;
        const env = Math.pow(Math.sin(ph * Math.PI), 1.6);   /* 海浪包络：缓起缓落 */
        d[i] = (Math.random() * 2 - 1) * (0.55 + 0.45 * Math.random()) * env * 0.9;
      }
      const src = waveCtx.createBufferSource(); src.buffer = buf; src.loop = true;
      /* 低通滤波：海浪是低频"哗—"声，滤掉尖锐高频 */
      const lp = waveCtx.createBiquadFilter(); lp.type = 'lowpass';
      lp.frequency.value = 520; lp.Q.value = .4;
      const gain = waveCtx.createGain(); gain.gain.value = .16;
      src.connect(lp); lp.connect(gain); gain.connect(waveCtx.destination);
      /* 第二层 LFO：缓慢呼吸感，让每波之间有点起伏 */
      const lfo = waveCtx.createOscillator(); lfo.frequency.value = .05;
      const lfoG = waveCtx.createGain(); lfoG.gain.value = .045;
      lfo.connect(lfoG); lfoG.connect(gain.gain); lfo.start();
      src.start();
      waveNodes = { src, lp, gain, lfo, lfoG };
      waveOn = true;
      waveBtn.classList.add('on');
      waveBtn.title = '海浪白噪音（播放中，点击关闭）';
    } catch (e) {}
  }
  function stopWaveNodes() {
    if (!waveNodes) return;
    try { waveNodes.src.stop(); } catch (e) {}
    try { waveNodes.lfo.stop(); } catch (e) {}
    waveNodes = null;
  }
  function stopWave() {
    stopWaveNodes();
    waveOn = false;
    waveBtn.classList.remove('on');
    waveBtn.title = '海浪白噪音（现场合成）';
  }
  if (waveBtn) waveBtn.addEventListener('click', () => { waveOn ? stopWave() : startWave(); });
  /* 页面隐藏时自动停（省电，回来需重新开） */
  document.addEventListener('visibilitychange', () => { if (document.hidden && waveOn) stopWave(); });


  /* ============ 消息渲染 ============ */
  const msgs = $('holeMsgs');
  let busy = false;

  function esc(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }
  function scrollToBottom(smooth) {
    requestAnimationFrame(() => msgs.scrollTo({ top: msgs.scrollHeight, behavior: smooth ? 'smooth' : 'auto' }));
  }
  function openMsg(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = '<div class="who">' + (role === 'user' ? '你' : '树洞') + '</div><div class="bub">' + esc(text) + '</div>';
    msgs.appendChild(div);
    scrollToBottom(true);
    return div;
  }
  function showWelcome() {
    const chats = window.TreeHole.readChats();
    if (chats.length) return;
    const div = document.createElement('div');
    div.className = 'welcome glass';
    div.innerHTML = '<div class="wic">🕳️</div>' +
      '<div class="wtitle">把秘密说给树洞听</div>' +
      '<div class="wdesc">这里住着一只树洞，住在深夜的海边。<br>它是一片深海，什么都能装下，从不评判。<br>你说过的话，它都会安静地沉进海底，替你记着。</div>' +
      '<div class="whint">— 树洞会记得，但不会到处说 —</div>';
    msgs.appendChild(div);
    scrollToBottom(false);
  }

  /* 渲染全部历史消息 */
  function renderHistory() {
    const chats = window.TreeHole.readChats();
    if (!chats.length) {
      /* 从占卜页带信息进来：树洞自然开场（不欢迎卡）；否则照常显示欢迎卡 */
      let hasPending = false;
      try { hasPending = !!localStorage.getItem('treehole_pending_opening'); } catch (e) {}
      if (!hasPending) { showWelcome(); return; }
      const aiDiv = document.createElement('div');
      aiDiv.className = 'msg ai';
      aiDiv.innerHTML = '<div class="who">树洞</div><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div>';
      msgs.appendChild(aiDiv);
      scrollToBottom(true);
      window.TreeHole.peekOpening().then(opening => {
        aiDiv.remove();
        if (!opening) { showWelcome(); return; }
        /* 开场白写入聊天记录：让后续回复上下文连贯 */
        try { window.TreeHole.appendChat('assistant', opening); } catch (e) {}
        const bubbles = (window.TreeHole.splitReply && window.TreeHole.splitReply(opening, 4)) || [opening];
        bubbles.forEach((b, i) => {
          setTimeout(() => {
            const d = document.createElement('div');
            d.className = 'msg ai';
            d.innerHTML = '<div class="who">' + (i === 0 ? '树洞' : '') + '</div><div class="bub">' + esc(b) + '</div>';
            msgs.appendChild(d);
            scrollToBottom(true);
          }, i * 420);
        });
      }).catch(() => { aiDiv.remove(); showWelcome(); });
      return;
    }
    chats.forEach(m => openMsg(m.role, m.content));
    /* 底部提示最近一次时间 */
    const last = chats[chats.length - 1];
    if (last && last.at) {
      const d = new Date(last.at);
      const tip = document.createElement('div');
      tip.className = 'th-status';
      tip.textContent = '— 上次 ' + [d.getMonth() + 1, d.getDate()].join('月') + '日 ' +
        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ' —';
      msgs.appendChild(tip);
    }
    scrollToBottom(false);
  }
  renderHistory();

  /* ============ 发送 ============ */
  const inp = $('holeIn'), sendBtn = $('holeSend');
  function autoResize() {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 96) + 'px';
  }
  inp.addEventListener('input', autoResize);

  async function send() {
    const text = inp.value.trim();
    if (!text || busy) return;
    inp.value = ''; autoResize();
    busy = true; sendBtn.disabled = true;

    /* 用户气泡 */
    openMsg('user', text);
    /* AI 占位 + 打字动画 */
    const aiDiv = document.createElement('div');
    aiDiv.className = 'msg ai';
    aiDiv.innerHTML = '<div class="who">树洞</div><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div>';
    msgs.appendChild(aiDiv);
    const bub = aiDiv.querySelector('.bub');
    scrollToBottom(true);

    const status = document.createElement('div');
    status.className = 'th-status changing';
    status.style.display = 'none';   /* 默认隐藏：仅在真正重连时显示，避免首次请求误显示 */
    msgs.appendChild(status);
    scrollToBottom(true);

    let full = '';
    /* 重连提示条：只有 onRetry 触发时才显示/更新（此前 50ms 定时器把元素删了导致提示永远不显示） */
    const showStatus = (tier, n) => {
      if (!status.isConnected) { msgs.appendChild(status); scrollToBottom(true); }
      status.style.display = '';
      status.textContent = '🔄 ' + tier + ' 连接中断，重连中（' + n + '/' + window.AIRelay.RETRY + '）…';
      scrollToBottom(true);
    };
    try {
      await window.TreeHole.sendMessage(text, (d) => {
        full += d;
        bub.innerHTML = esc(full) + '<span class="typing" style="display:inline-flex;vertical-align:bottom"><i></i><i></i><i></i></span>';
        scrollToBottom(true);
      }, (tier, n) => {
        showStatus(tier, n);
      });
      /* 多气泡：把整段回复拆成短句，一条一条发（像真人连发微信） */
      const bubbles = (window.TreeHole.splitReply && window.TreeHole.splitReply(full)) || [full];
      aiDiv.remove();
      if (bubbles.length) {
        bubbles.forEach((b, i) => {
          setTimeout(() => {
            const d = document.createElement('div');
            d.className = 'msg ai';
            d.innerHTML = '<div class="who">' + (i === 0 ? '树洞' : '') + '</div><div class="bub">' + esc(b) + '</div>';
            msgs.appendChild(d);
            scrollToBottom(true);
          }, i * 420);
        });
      } else {
        const d = document.createElement('div');
        d.className = 'msg ai';
        d.innerHTML = '<div class="who">树洞</div><div class="bub">' + esc(full || '…') + '</div>';
        msgs.appendChild(d);
        scrollToBottom(true);
      }
    } catch (e) {
      bub.innerHTML = '🌫️ 树洞暂时听不到你说话，稍后再试试吧。';
      /* 失败回滚：移除刚才追加的 user 消息，避免一条消息变两条 */
      try {
        const chats = window.TreeHole.readChats();
        if (chats.length && chats[chats.length - 1].role === 'user' && !chats.some(c => c.content === text && c.role === 'assistant')) {
          chats.pop(); window.TreeHole.saveChats(chats);
        }
      } catch (e2) {}
    } finally {
      status.remove();
      busy = false; sendBtn.disabled = false;
      scrollToBottom(true);
    }
  }
  sendBtn.addEventListener('click', send);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  /* ============ 清空 ============ */
  $('thClear').addEventListener('click', () => $('thClearMask').classList.add('show'));
  $('thClearNo').addEventListener('click', () => $('thClearMask').classList.remove('show'));
  $('thClearYes').addEventListener('click', () => {
    window.TreeHole.clearChats();
    $('thClearMask').classList.remove('show');
    msgs.innerHTML = '';
    showWelcome();
    toast && toast('树洞已清空 🍃');
  });
  /* ============ 返回 ============ */
  $('thBack').addEventListener('click', () => { if (history.length > 1) history.back(); else location.href = '../'; });

  function toast(t) {
    let el = document.querySelector('.th-toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'th-toast';
      el.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:99;' +
        'background:linear-gradient(160deg,rgba(30,24,50,.92),rgba(30,24,50,.85));backdrop-filter:blur(12px);' +
        'border:1px solid rgba(240,207,130,.25);border-radius:16px;padding:12px 22px;font-size:.78rem;' +
        'color:#f0cf82;letter-spacing:.1em;box-shadow:0 16px 48px rgba(0,0,0,.45);transition:opacity .3s';
      document.body.appendChild(el);
    }
    el.textContent = t;
    el.style.opacity = '1';
    clearTimeout(el._timer);
    el._timer = setTimeout(() => { el.style.opacity = '0'; }, 1600);
  }
})();
</script>
</body>
</html>
